<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>訂單出貨</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">

					<div class="d-flex justify-content-between align-items-center mb-3">
						<a th:href="@{/admin/psi/shipping}" class="btn btn-secondary btn-icon-split">
							<span class="icon text-white-50"><i class="fas fa-arrow-left"></i></span>
							<span class="text">回出貨管理</span>
						</a>
						<!-- 待出貨（ordersStatus = 0）的訂單才顯示，送到 ShippingController 的 ship；送出前先跳確認視窗 -->
						<!-- 沒有明細或有明細庫存不足時（shippable 是 false）按鈕不能按；ShippingService 的 shipOrders 還會再檢查一次 -->
						<form method="post" th:action="@{/admin/psi/shipping/ship}" class="m-0"
							th:if="${orders.ordersStatus == 0}" onsubmit="return confirm('確定要出貨這張訂單嗎？');">
							<input type="hidden" name="ordersId" th:value="${orders.ordersId}">
							<button type="submit" class="btn btn-primary" th:disabled="${!shippable}"
								th:title="${!shippable} ? '沒有明細或庫存不足，無法出貨'">確認出貨</button>
						</form>
					</div>

					<div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div>
					<div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

					<!-- 訂單資料：orders 由 ShippingController 的 listOneShipping 放入 model -->
					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">客戶訂單</h6>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-bordered" width="100%" cellspacing="0">
									<tbody>
										<tr>
											<th class="bg-light" style="width: 150px;">訂單編號</th>
											<td th:text="${orders.ordersId}"></td>
										</tr>
										<tr>
											<th class="bg-light">訂單日期</th>
											<td th:text="${orders.ordersDate != null ? #temporals.format(orders.ordersDate, 'yyyy-MM-dd HH:mm') : ''}"></td>
										</tr>
										<tr>
											<th class="bg-light">收件人姓名</th>
											<td th:text="${orders.receiverName}"></td>
										</tr>
										<tr>
											<th class="bg-light">電話</th>
											<td th:text="${orders.phoneNumber}"></td>
										</tr>
										<tr>
											<th class="bg-light">收件地址</th>
											<td th:text="${(orders.postalCode != null ? orders.postalCode + ' ' : '') + (orders.shippingAddress != null ? orders.shippingAddress : '')}"></td>
										</tr>
										<!-- 物流備註是寫給物流看的，只顯示、不能修改 -->
										<tr>
											<th class="bg-light">物流備註</th>
											<td th:text="${orders.logisticsNote}" style="white-space: pre-line;"></td>
										</tr>
										<tr>
											<th class="bg-light">訂單備註</th>
											<td th:text="${orders.ordersNote}" style="white-space: pre-line;"></td>
										</tr>
									</tbody>
								</table>
							</div>

							<!-- 出貨明細：和訂單資料放在同一個區塊；shippingDetails 由 ShippingService 的 getShippingDetails 組成，一筆是訂單明細（ordersDetail）加上它的商品規格（productSku） -->
							<h6 class="mt-4 mb-3 font-weight-bold text-primary">出貨明細</h6>
							<div class="table-responsive">
								<table class="table table-bordered" width="100%" cellspacing="0">
									<thead>
										<tr>
											<th>商品規格編號</th>
											<th>商品名稱</th>
											<th>商品規格</th>
											<th>訂購數量</th>
											<th>目前庫存</th>
										</tr>
									</thead>
									<tbody>
										<tr th:if="${#lists.isEmpty(shippingDetails)}">
											<td colspan="5" class="text-center">此訂單尚無明細</td>
										</tr>
										<tr th:each="shippingDetail : ${shippingDetails}">
											<td th:text="${shippingDetail.ordersDetail.skuId}"></td>
											<td th:text="${shippingDetail.ordersDetail.productName}"></td>
											<td th:text="${shippingDetail.productSku != null ? shippingDetail.productSku.displayName : ''}"></td>
											<td th:text="${shippingDetail.ordersDetail.ordersQuantity}"></td>
											<!-- 庫存不夠出這一筆時（ShippingDetail 的 isStockEnough）用紅字顯示 -->
											<td th:text="${shippingDetail.productSku != null ? shippingDetail.productSku.stock : '查無此規格'}"
												th:classappend="${!shippingDetail.stockEnough} ? 'text-danger font-weight-bold'"></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

</body>
</html>
