<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>驗收紀錄</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<style>
#receiving_list_all th, #receiving_list_all td {
	white-space: nowrap; /* 不換行 */
	vertical-align: middle; /* 內容上下置中 */
}

#receiving_list_all {
	font-size: 0.9rem;
}

</style>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">

					<!-- 錯誤訊息：查詢條件不正確（一行一個）或查無資料，由 ReceivingController 的 listAllReceiving 放入 model -->
					<div class="alert alert-danger alert-dismissible fade show" role="alert"
					     th:if="${errorMessage != null}">
					    <span th:text="${errorMessage}" style="white-space: pre-line;"></span>
					    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
					        <span aria-hidden="true">&times;</span>
					    </button>
					</div>

					<a th:href="@{/admin/psi/receiving}" class="btn btn-secondary btn-icon-split mb-3">
						<span class="icon text-white-50">
						<i class="fas fa-arrow-left"></i></span>
						<span class="text">回進貨系統管理</span>
					</a>

					<!-- 歷史驗收紀錄：已結案（poStatus = 4，驗收過）的採購單，poPage 由 ReceivingController 的 listAllReceiving 放入 model -->
					<!-- 驗收日期由新到舊，每頁 10 筆；表格比照 purchase/listAllPo.html，清單裡都是驗收過的單，所以驗收相關的四欄固定顯示 -->
					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">驗收紀錄</h6>
						</div>
						<div class="card-body">
							<!-- 查詢表單：條件都是選填、可以同時填（條件之間是「而且」），送到 ReceivingController 的 listAllReceiving；不帶 page，查詢後從第 1 頁開始 -->
							<!-- 欄位值用網址的參數（param）回填，查詢條件不正確時也保留使用者原本輸入的內容 -->
							<form class="form-row align-items-end mb-3" method="get" th:action="@{/admin/psi/receiving/listAllReceiving}">
								<div class="col-auto mb-2">
									<label class="small mb-1" for="searchPoNo">採購單編號</label>
									<input type="text" maxlength="15" class="form-control form-control-sm" id="searchPoNo" name="poNo"
										placeholder="PO202610090001" th:value="${param.poNo}">
								</div>
								<div class="col-auto mb-2">
									<label class="small mb-1" for="searchVendorId">供應商編號</label>
									<input type="text" class="form-control form-control-sm" id="searchVendorId" name="vendorId"
										placeholder="請輸入供應商編號" th:value="${param.vendorId}">
								</div>
								<div class="col-auto mb-2">
									<!-- 已結案的單都驗收過，所以不列「尚未驗收」；狀態文字和表格的驗收狀態欄相同 -->
									<label class="small mb-1" for="searchInboundStatus">驗收狀態</label>
									<select class="custom-select custom-select-sm" id="searchInboundStatus" name="inboundStatus"
										th:with="selected=${param.inboundStatus != null ? #strings.trim(param.inboundStatus[0]) : ''}">
										<option value="" th:selected="${selected == ''}">全部</option>
										<option value="1" th:selected="${selected == '1'}">驗收成功</option>
										<option value="2" th:selected="${selected == '2'}">驗收失敗</option>
										<option value="3" th:selected="${selected == '3'}">已取消</option>
									</select>
								</div>
								<div class="col-auto mb-2">
									<!-- 驗收日期區間：起日、迄日都包含在內，可以只填一邊 -->
									<label class="small mb-1" for="searchStartDate">驗收日期</label>
									<div class="d-flex align-items-center">
										<input type="date" class="form-control form-control-sm" id="searchStartDate" name="startDate" th:value="${param.startDate}">
										<span class="mx-1">~</span>
										<input type="date" class="form-control form-control-sm" name="endDate" th:value="${param.endDate}" aria-label="驗收日期迄日">
									</div>
								</div>
								<div class="col-auto mb-2">
									<button type="submit" class="btn btn-primary btn-sm">查詢</button>
									<a th:href="@{/admin/psi/receiving/listAllReceiving}" class="btn btn-secondary btn-sm">清除條件</a>
								</div>
							</form>

							<div class="table-responsive">
								<table class="table table-bordered" id="receiving_list_all" width="100%" cellspacing="0">
									<thead>
										<tr>
											<th>操作</th>
											<th>編號</th>
											<th>供應商</th>
											<th>採購員工</th>
											<th>採購日期</th>
											<th>總金額</th>
											<th>驗收日期</th>
											<th>驗收狀態</th>
											<th>驗收金額</th>
										</tr>
									</thead>
									<tbody>
										<tr th:if="${poPage.empty}">
											<td colspan="10" class="text-center" th:text="${searching} ? '查無符合條件的驗收紀錄' : '目前沒有驗收紀錄'"></td>
										</tr>
										<tr th:each="poVO : ${poPage.content}">
											<td>
												<!-- 連到 ReceivingController 的 listOneReceiving，以 listOneReceiving.html 顯示單筆資料 -->
												<a th:href="@{/admin/psi/receiving/listOneReceiving(poId=${poVO.poId})}"
												class="btn btn-primary btn-sm mb-1">詳細</a>

												<!-- 修改驗收紀錄：以 POST 把 poId 送到 ReceivingController 的 getOneForUpdate，驗收頁會帶入上次存的內容 -->
												<form method="post" th:action="@{/admin/psi/receiving/getOneForUpdate}" class="d-inline"
													th:if="${poVO.closed}">
													<br>
													<input type="hidden" name="poId" th:value="${poVO.poId}">
													<button type="submit" class="btn btn-danger btn-sm">修改</button>
												</form>
											</td>
											<td th:text="${poVO.poNo}" style="text-align: center"></td>
											<td th:text="${poVO.vendor.vendorId + ' - ' + poVO.vendor.vendorName}"></td>
											<td th:text="${poVO.poEmployeeId.employeeId + ' - ' + poVO.poEmployeeId.employeeName}"></td>
											<td th:text="${{poVO.orderDate}}"></td>
											<td th:text="${poVO.totalAmount}"></td>
											<td th:text="${{poVO.inboundDate}}"></td>
											<td>
												<span th:if="${poVO.inboundStatus == 0}" class="alert alert-secondary d-inline-block py-1 px-2 mb-0">尚未驗收</span>
												<span th:if="${poVO.inboundStatus == 1}" class="alert alert-success d-inline-block py-1 px-2 mb-0">驗收成功</span>
												<span th:if="${poVO.inboundStatus == 2}" class="alert alert-warning d-inline-block py-1 px-2 mb-0">驗收失敗</span>
												<span th:if="${poVO.inboundStatus == 3}" class="alert alert-secondary d-inline-block py-1 px-2 mb-0">已取消</span>
											</td>
											<td th:text="${poVO.inboundAmount}"></td>
										</tr>
									</tbody>
								</table>
							</div>

							<!-- 分頁：poPage.number 是從 0 開始的頁碼，畫面與網址的 page 從 1 開始 -->
							<!-- 頁碼取自 pageNumbers（PsiUtils 的 buildPageNumbers）：頭尾各 5 頁加上目前這頁前後各 2 頁，0 顯示成「…」 -->
							<!-- 每個連結都帶著目前的查詢條件，翻頁時條件不會不見 -->
							<div class="d-flex justify-content-between align-items-center mt-3">
								<span th:text="${'共 ' + poPage.totalElements + ' 筆'}"></span>
								<!-- 只有一頁時不顯示頁碼 -->
								<ul class="pagination mb-0" th:if="${poPage.totalPages > 1}">
									<li class="page-item" th:classappend="${poPage.first} ? 'disabled'">
										<a class="page-link" th:href="@{/admin/psi/receiving/listAllReceiving(page=${poPage.number}, poNo=${poNo}, vendorId=${vendorId}, inboundStatus=${inboundStatus}, startDate=${startDate}, endDate=${endDate})}">上一頁</a>
									</li>
									<th:block th:each="pageNumber : ${pageNumbers}">
										<li class="page-item disabled" th:if="${pageNumber == 0}">
											<span class="page-link">…</span>
										</li>
										<li class="page-item" th:unless="${pageNumber == 0}"
											th:classappend="${pageNumber == poPage.number + 1} ? 'active'">
											<a class="page-link" th:href="@{/admin/psi/receiving/listAllReceiving(page=${pageNumber}, poNo=${poNo}, vendorId=${vendorId}, inboundStatus=${inboundStatus}, startDate=${startDate}, endDate=${endDate})}" th:text="${pageNumber}"></a>
										</li>
									</th:block>
									<li class="page-item" th:classappend="${poPage.last} ? 'disabled'">
										<a class="page-link" th:href="@{/admin/psi/receiving/listAllReceiving(page=${poPage.number + 2}, poNo=${poNo}, vendorId=${vendorId}, inboundStatus=${inboundStatus}, startDate=${startDate}, endDate=${endDate})}">下一頁</a>
									</li>
								</ul>
							</div>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

</body>
</html>
