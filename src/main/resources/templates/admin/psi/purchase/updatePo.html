<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>修改供應商</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<style>
.update_form label {
	font-weight: bold;
}

.update_form .required::after {
	content: " *";
	color: #e74a3b;
}

.update_form input[type="file"]::file-selector-button {
	margin-right: 10px;
	padding: 0.375rem 0.75rem;
	font-size: 1rem;
	line-height: 1.5;
	color: #fff;
	background-color: #858796;
	border: 1px solid #858796;
	border-radius: 0.35rem;
	cursor: pointer;
	transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out;
}

.update_form input[type="file"]::file-selector-button:hover {
	background-color: #717384;
	border-color: #6b6d7d;
}

#blob_holder img {
	margin-top: 10px;
	border: 1px solid #d1d3e2;
}
</style>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">
					<h1 class="h3 mb-4 text-gray-800">採購單管理</h1>

					<a th:href="@{/admin/psi/vendor/listAllVendor}" class="btn btn-secondary btn-icon-split mb-3"> <span class="icon text-white-50"><i class="fas fa-arrow-left"></i></span> <span class="text">回供應商列表</span></a>

					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">修改採購單</h6>
						</div>
						<div class="card-body">
							<p class="text-muted"><span class="text-danger">*</span> 為必填欄位</p>

							<!-- vendorVO 由 VendorController 的 getOne_For_Update 依 listAllVendor 選中的 vendorId 查出後放入 model -->
							<form class="update_form" th:action="@{/admin/psi/po/update}" method="post"
								th:object="${poVO}" >

								<input type="hidden" th:field="*{poId}" />

								<div class="form-group">
									<label for="poNo">編號</label>
									<input type="text" th:field="*{poNo}" class="form-control-plaintext font-weight-bold" readonly />
								</div>

								<div class="form-group">
									<label>供應商編號</label>
									<input type="hidden" th:field="*{vendor.vendorId}" />
									<input type="text" th:value="*{vendor.vendorName}" class="form-control-plaintext" readonly />
								</div>

								<div class="form-group">
									<label>採購員工姓名</label>
									<input type="hidden" th:field="*{poEmployeeId.employeeId}" />
									<input type="text" th:value="*{poEmployeeId.employeeName}" class="form-control-plaintext" readonly />
								</div>

								<div class="form-group">
									<label for="orderDate" class="required">採購日期</label>
									<input type="text" th:field="*{orderDate}" class="form-control" placeholder="yyyy-MM-dd HH:mm" />
								</div>

								<div class="form-group">
									<label for="poStatus" class="required">採購單狀態</label>
									<select th:field="*{poStatus}" class="custom-select">
										<option value="0">待審核</option>
										<option value="1">申請通過</option>
										<option value="2">申請未通過</option>
									</select>
								</div>

								<div class="form-group">
									<label for="totalAmount" class="required">總金額</label>
									<input type="number" th:field="*{totalAmount}" class="form-control" min="0" />
								</div>

								<div class="form-group">
									<label>驗收員工姓名</label>
									<input type="hidden" name="inboundEmployeeId.employeeId" th:if="*{inboundEmployeeId != null}"
										th:value="*{inboundEmployeeId.employeeId}" />
									<input type="text" th:value="*{inboundEmployeeId?.employeeName}" class="form-control-plaintext" readonly />
								</div>

								<div class="form-group">
									<label for="inboundDate">驗收日期</label>
									<input type="text" th:field="*{inboundDate}" class="form-control" placeholder="yyyy-MM-dd HH:mm" />
								</div>

								<div class="form-group">
									<label for="inboundStatus" class="required">驗收狀態</label>
									<select th:field="*{inboundStatus}" class="custom-select">
										<option value="0">尚未驗收</option>
										<option value="1">驗收成功</option>
										<option value="2">驗收失敗</option>
									</select>
								</div>

								<div class="form-group">
									<label for="inboundAmount" class="required">驗收實付金額</label>
									<input type="number" th:field="*{inboundAmount}" class="form-control" min="0" />
								</div>

								<button type="submit" id="submit" class="btn btn-primary">送出修改</button>
							</form>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

	<script>
		//清除提示信息
		function hideContent(d) {
			var el = document.getElementById(d);
			if (el) {
				el.style.display = "none";
			}
		}

		//送出後鎖住按鈕，避免連按重複送出
		document.querySelector(".update_form").addEventListener("submit", function() {
			document.getElementById("submit").disabled = true;
		});

		//按上一頁回到此頁時，瀏覽器可能還原成鎖住的狀態，需恢復按鈕
		window.addEventListener("pageshow", function() {
			document.getElementById("submit").disabled = false;
		});
	</script>

</body>
</html>
