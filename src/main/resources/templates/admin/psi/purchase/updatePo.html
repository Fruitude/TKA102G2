<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>修改供應商</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<style>
.update_form label {
	font-weight: bold;
}

.update_form .required::after {
	content: " *";
	color: #e74a3b;
}

.update_form input[type="file"]::file-selector-button {
	margin-right: 10px;
	padding: 0.375rem 0.75rem;
	font-size: 1rem;
	line-height: 1.5;
	color: #fff;
	background-color: #858796;
	border: 1px solid #858796;
	border-radius: 0.35rem;
	cursor: pointer;
	transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out;
}

.update_form input[type="file"]::file-selector-button:hover {
	background-color: #717384;
	border-color: #6b6d7d;
}

#blob_holder img {
	margin-top: 10px;
	border: 1px solid #d1d3e2;
}
</style>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">

					<a th:href="@{/admin/psi/purchase/listAllPo(poStatus=${poStatus})}" class="btn btn-secondary btn-icon-split mb-3"> 
						<span class="icon text-white-50"><i class="fas fa-arrow-left"></i></span> 
						<span class="text">回採購單列表</span></a>

					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">修改採購單</h6>
						</div>
						<div class="card-body">
							<p class="text-muted"><span class="text-danger">*</span> 為必填欄位</p>

							<!-- vendorVO 由 VendorController 的 getOne_For_Update 依 listAllVendor 選中的 vendorId 查出後放入 model -->
							<form class="update_form" th:action="@{/admin/psi/purchase/update}" method="post"
								th:object="${poVO}" >

								<input type="hidden" th:field="*{poId}" />
								<!-- 列表的篩選條件（model 的 poStatus，不是這張單的狀態），送出後帶回單筆頁與列表 -->
								<input type="hidden" name="poStatus" th:value="${poStatus}" />

								<div class="form-group">
									<label for="poNo">採購單編號</label>
									<input type="text" th:field="*{poNo}" class="form-control-plaintext font-weight-bold" readonly />
								</div>

								<div class="form-group">
									<label>供應商</label>
									<input type="hidden" th:field="*{vendor.vendorId}" />
									<input type="text" th:value="*{vendor.vendorName}" class="form-control-plaintext" readonly />
								</div>

								<div class="form-group">
									<label>採購員工姓名</label>
									<input type="hidden" th:field="*{poEmployeeId.employeeId}" />
									<input type="text" th:value="*{poEmployeeId.employeeName}" class="form-control-plaintext" readonly />
								</div>

								<!-- 採購日期、採購單狀態、總金額只顯示不送出（沒有 name），由 PoService 的 updatePoWithDetails 決定實際存入的值 -->
								<div class="form-group">
									<label>採購日期</label>
									<input type="text" th:value="*{{orderDate}}" class="form-control-plaintext" readonly />
								</div>

								<div class="form-group">
									<label>採購單狀態</label>
									<th:block th:switch="*{poStatus}">
										<input type="text" th:case="0" value="待審核" class="form-control-plaintext" readonly />
										<input type="text" th:case="1" value="申請通過" class="form-control-plaintext" readonly />
										<input type="text" th:case="2" value="申請未通過" class="form-control-plaintext" readonly />
										<input type="text" th:case="3" value="已取消" class="form-control-plaintext" readonly />
									</th:block>
								</div>

								<div class="form-group">
									<label for="totalAmount">總金額</label>
									<input type="text" id="totalAmount" th:value="*{totalAmount}" class="form-control-plaintext" readonly />
								</div>

								<!-- 採購明細：送出 poDetailId、商品規格編號、採購數量、進貨單價；小計與總金額由下方 script 即時計算，存檔時由後端重算 -->
								<!-- skuListData 由 PoController 的 getOne_For_Update 依這張單的供應商查出（不含永久停產的規格） -->
								<table class="table table-bordered" id="po_detail_table">
									<thead>
										<tr>
											<th class="required">商品規格</th>
											<th class="required">採購數量</th>
											<th class="required">進貨單價</th>
											<th>小計</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="poDetailVO, stat : *{poDetails}">
											<td>
												<input type="hidden" th:field="*{poDetails[__${stat.index}__].poDetailId}" />
												<select class="custom-select" th:field="*{poDetails[__${stat.index}__].skuId.skuId}">
													<!-- 這筆明細原本的規格若已永久停產，清單裡不會有，補一個選項讓它維持選中 -->
													<option th:if="${poDetailVO.skuId.status == 4}"
														th:value="${poDetailVO.skuId.skuId}"
														th:text="${poDetailVO.skuId.skuId + ' - ' + poDetailVO.skuId.displayName + '（已停產）'}"></option>
													<option th:each="productSku : ${skuListData}"
														th:value="${productSku.skuId}"
														th:text="${productSku.skuId + ' - ' + productSku.displayName}"></option>
												</select>
											</td>
											<td><input type="number" min="1" required class="form-control detail-quantity"
												th:field="*{poDetails[__${stat.index}__].quantity}" /></td>
											<td><input type="number" min="0" required class="form-control detail-unit-price"
												th:field="*{poDetails[__${stat.index}__].unitPrice}" /></td>
											<td class="detail-subtotal" th:text="${poDetailVO.subtotal}"></td>
										</tr>
									</tbody>
								</table>

								<button type="submit" id="submit" class="btn btn-primary">送出修改</button>
							</form>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

	<script>
		//清除提示信息
		function hideContent(d) {
			var el = document.getElementById(d);
			if (el) {
				el.style.display = "none";
			}
		}

		//採購數量或進貨單價變動時，重算該列小計與整張單的總金額
		function updateAmounts() {
			var total = 0;
			document.querySelectorAll("#po_detail_table tbody tr").forEach(function(row) {
				var quantity = Number(row.querySelector(".detail-quantity").value) || 0;
				var unitPrice = Number(row.querySelector(".detail-unit-price").value) || 0;
				var subtotal = quantity * unitPrice;
				row.querySelector(".detail-subtotal").textContent = subtotal;
				total += subtotal;
			});
			document.getElementById("totalAmount").value = total;
		}

		document.getElementById("po_detail_table").addEventListener("input", updateAmounts);

		//送出後鎖住按鈕，避免連按重複送出
		document.querySelector(".update_form").addEventListener("submit", function() {
			document.getElementById("submit").disabled = true;
		});

		//按上一頁回到此頁時，瀏覽器可能還原成鎖住的狀態，需恢復按鈕
		window.addEventListener("pageshow", function() {
			document.getElementById("submit").disabled = false;
		});
	</script>

</body>
</html>
