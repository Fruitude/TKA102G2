<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>修改採購單</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<style>
.update_form label {
	font-weight: bold;
}

.update_form .required::after {
	content: " *";
	color: #e74a3b;
}

#po_detail_table th, #po_detail_table td {
	vertical-align: middle; /* 內容上下置中 */
}

/* 欄寬固定，不隨輸入的內容或錯誤訊息變動；商品規格沒有設定寬度，使用剩下的空間 */
#po_detail_table {
	table-layout: fixed;
}

#po_detail_table thead th:nth-child(2) {
	width: 72px; /* 建議採購量：剛好放得下標題的五個字 */
}

#po_detail_table thead th:nth-child(3) {
	width: 120px; /* 採購數量：最窄 */
}

#po_detail_table thead th:nth-child(4) {
	width: 150px; /* 進貨單價 */
}

#po_detail_table thead th:nth-child(5) {
	width: 180px; /* 小計：最寬 */
}

#po_detail_table thead th:nth-child(6) {
	width: 90px; /* 操作 */
}

/* 建議採購量只是參考用的提示，顏色比其他欄位淺、字比較小；靠右貼近採購數量的輸入框 */
#po_detail_table .detail-suggested {
	color: #b7b9cc;
	font-size: 0.8rem;
	text-align: right;
	border-right: 0;
	/* 左右只留一點空隙，格子的邊界貼著文字 */
	padding-left: 4px;
	padding-right: 4px;
	white-space: nowrap;
}

/* 建議採購量和右邊的採購數量之間不畫框線，看起來像同一格 */
#po_detail_table .detail-suggested + th,
#po_detail_table .detail-suggested + td {
	border-left: 0;
}
</style>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">

					<a th:href="@{/admin/psi/purchase}" class="btn btn-secondary btn-icon-split mb-3">
						<span class="icon text-white-50"><i class="fas fa-arrow-left"></i></span> 
						<span class="text">回採購單管理</span></a>

					<!-- 從首頁待採購商品的「更新採購單」進來時的提示（PoController 的 getOne_For_Update 放入 model） -->
					<div class="alert alert-info" th:if="${infoMessage != null}" th:text="${infoMessage}"></div>

					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">修改採購單</h6>
						</div>
						<div class="card-body">
							<p class="text-muted"><span class="text-danger">*</span> 為必填欄位</p>

							<!-- poVO、skuListData 由 PoController 的 getOne_For_Update 放入 model；檢查失敗時由 update 放入 -->
							<!-- 頁面不做驗證（novalidate），檢查都在 PoController 的 update；錯誤以 th:errors 顯示在對應欄位下方 -->
							<form class="update_form" th:action="@{/admin/psi/purchase/update}" method="post"
								th:object="${poVO}" novalidate>

								<input type="hidden" th:field="*{poId}" />

								<!-- 採購單編號、供應商、採購員工、採購日期、採購單狀態、總金額只顯示不送出（沒有 name） -->
								<!-- 前五項不可修改，檢查失敗重新顯示時由 PoService 的 prepareUpdatePo 從資料庫補回；總金額由 updatePoWithDetails 重算 -->
								<div class="form-group">
									<label for="poNo">採購單編號</label>
									<input type="text" id="poNo" th:value="*{poNo}" class="form-control-plaintext font-weight-bold" readonly />
								</div>

								<div class="form-group">
									<label>供應商</label>
									<input type="text" th:value="*{vendor.vendorId + ' - ' + vendor.vendorName}" class="form-control-plaintext" readonly />
								</div>

								<div class="form-group">
									<label>採購員工</label>
									<input type="text" th:value="*{poEmployeeId.employeeId + ' - ' + poEmployeeId.employeeName}" class="form-control-plaintext" readonly />
								</div>

								<div class="form-group">
									<label>採購日期</label>
									<input type="text" th:value="*{{orderDate}}" class="form-control-plaintext" readonly />
								</div>

								<div class="form-group">
									<label>採購單狀態</label>
									<th:block th:switch="*{poStatus}">
										<input type="text" th:case="0" value="待審核" class="form-control-plaintext" readonly />
										<input type="text" th:case="1" value="申請通過" class="form-control-plaintext" readonly />
										<input type="text" th:case="2" value="申請未通過" class="form-control-plaintext" readonly />
										<input type="text" th:case="3" value="已取消" class="form-control-plaintext" readonly />
										<input type="text" th:case="4" value="已結案" class="form-control-plaintext" readonly />
									</th:block>
								</div>

								<div class="form-group">
									<label for="totalAmount">總金額</label>
									<input type="text" id="totalAmount" th:value="*{totalAmount}" class="form-control-plaintext" readonly />
									<span th:if="${#fields.hasErrors('totalAmount')}" th:errors="*{totalAmount}"
										class="text-danger d-block mt-1 amount-error"></span>
								</div>

								<!-- 採購明細：可以修改、新增、刪除；送出的是畫面上的每一列（poDetailId、商品規格編號、採購數量、進貨單價） -->
								<!-- 存檔時 PoService 的 updatePoWithDetails 依商品規格對應資料庫的明細：規格還在的是修改、多出來的是新增、不見的是刪除 -->
								<!-- 欄位名的索引由下方 script 的 renumberDetailRows 依列的順序重編；小計與總金額由 script 即時計算，存檔時由後端重算 -->
								<!-- skuListData 由 PoController 的 getOne_For_Update 依這張單的供應商查出（不含永久停產的規格） -->
								<div class="d-flex justify-content-between align-items-center mb-2">
									<label class="mb-0">採購明細</label>
									<button type="button" id="add_detail_row" class="btn btn-success btn-sm">新增明細</button>
								</div>
								<table class="table table-bordered" id="po_detail_table">
									<thead>
										<tr>
											<th class="required">商品規格</th>
											<th class="detail-suggested">建議採購量</th>
											<th class="required">採購數量</th>
											<th class="required">進貨單價</th>
											<th>小計</th>
											<th>操作</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="poDetailVO, stat : *{poDetails}">
											<td>
												<!-- 既有明細帶著明細編號，新增的明細這一格是空的 -->
												<input type="hidden" class="detail-id" th:field="*{poDetails[__${stat.index}__].poDetailId}" />
												<select class="custom-select detail-sku" th:field="*{poDetails[__${stat.index}__].skuId.skuId}">
													<option value="">請選擇商品規格</option>
													<!-- 這筆明細原本的規格若已永久停產，清單裡不會有，補一個選項讓它維持選中 -->
													<option th:if="${poDetailVO.skuId.status == 4}"
														th:value="${poDetailVO.skuId.skuId}"
														th:text="${poDetailVO.skuId.skuId + ' - ' + poDetailVO.skuId.displayName + '（已停產）'}"></option>
													<option th:each="productSku : ${skuListData}"
														th:value="${productSku.skuId}"
														th:text="${productSku.skuId + ' - ' + productSku.displayName}"></option>
												</select>
												<span th:if="${#fields.hasErrors('poDetails[__${stat.index}__].skuId')}"
													th:errors="*{poDetails[__${stat.index}__].skuId}"
													class="text-danger d-block mt-1"></span>
											</td>
											<!-- 建議採購量：只是提示，不會送出；由 script 的 updateSuggested 依這一列選的規格填入 -->
											<td class="detail-suggested"></td>
											<td>
												<!-- type="number" 只是讓瀏覽器擋掉文字輸入；空白、範圍由 PoDetailVO 的註解檢查。th:field 會保留使用者輸入的內容 -->
												<input type="number" class="form-control detail-quantity"
													th:field="*{poDetails[__${stat.index}__].quantity}" />
												<span th:if="${#fields.hasErrors('poDetails[__${stat.index}__].quantity')}"
													th:errors="*{poDetails[__${stat.index}__].quantity}"
													class="text-danger d-block mt-1"></span>
											</td>
											<td>
												<input type="number" class="form-control detail-unit-price"
													th:field="*{poDetails[__${stat.index}__].unitPrice}" />
												<span th:if="${#fields.hasErrors('poDetails[__${stat.index}__].unitPrice')}"
													th:errors="*{poDetails[__${stat.index}__].unitPrice}"
													class="text-danger d-block mt-1"></span>
											</td>
											<td>
												<span class="detail-subtotal" th:text="${poDetailVO.subtotal}"></span>
												<span th:if="${#fields.hasErrors('poDetails[__${stat.index}__].subtotal')}"
													th:errors="*{poDetails[__${stat.index}__].subtotal}"
													class="text-danger d-block mt-1 amount-error"></span>
											</td>
											<td><button type="button" class="btn btn-danger btn-sm detail-remove">刪除</button></td>
										</tr>
									</tbody>
								</table>

								<!-- 不屬於單一欄位的明細錯誤：一筆明細都沒有、要刪除的明細已有到貨數量 -->
								<span th:if="${#fields.hasErrors('poDetails')}" th:errors="*{poDetails}"
									class="text-danger d-block mb-3" id="po_details_error"></span>

								<button type="submit" id="submit" class="btn btn-primary">送出修改</button>
							</form>

							<!-- 明細列的樣板：按「新增明細」時由 script 複製一份放進表格；新增的明細沒有明細編號 -->
							<template id="po_detail_row_template">
								<tr>
									<td>
										<input type="hidden" class="detail-id" />
										<select class="custom-select detail-sku">
											<option value="">請選擇商品規格</option>
											<option th:each="productSku : ${skuListData}"
												th:value="${productSku.skuId}"
												th:text="${productSku.skuId + ' - ' + productSku.displayName}"></option>
										</select>
									</td>
									<td class="detail-suggested"></td>
									<td><input type="number" class="form-control detail-quantity" /></td>
									<td><input type="number" class="form-control detail-unit-price" /></td>
									<td><span class="detail-subtotal">0</span></td>
									<td><button type="button" class="btn btn-danger btn-sm detail-remove">刪除</button></td>
								</tr>
							</template>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

	<!-- 各規格的建議採購量（PoController 的 addUpdateFormData 放入 model）：key 是規格編號，沒有在裡面的規格不需要採購 -->
	<script th:inline="javascript">
		var suggestedQuantityBySkuId = /*[[${suggestedQuantityBySkuId}]]*/ {};
	</script>

	<script>
		//採購數量或進貨單價變動時，重算該列小計與整張單的總金額
		function updateAmounts() {
			var total = 0;
			document.querySelectorAll("#po_detail_table tbody tr").forEach(function(row) {
				var quantity = Number(row.querySelector(".detail-quantity").value) || 0;
				var unitPrice = Number(row.querySelector(".detail-unit-price").value) || 0;
				var subtotal = quantity * unitPrice;
				row.querySelector(".detail-subtotal").textContent = subtotal;
				total += subtotal;
			});
			document.getElementById("totalAmount").value = total;
		}

		document.getElementById("po_detail_table").addEventListener("input", updateAmounts);

		//使用者開始修改明細的某一格（輸入數字或改選規格）時，清掉該格下方的錯誤訊息
		function clearCellError(event) {
			var cell = event.target.closest("td");
			if (!cell) {
				return;
			}
			cell.querySelectorAll(".text-danger").forEach(function(errorSpan) {
				errorSpan.remove();
			});
			//小計、總金額是算出來的，任何一格改動後舊的金額錯誤就不準了，一併清掉
			document.querySelectorAll(".amount-error").forEach(function(errorSpan) {
				errorSpan.remove();
			});
		}
		document.querySelector("#po_detail_table tbody").addEventListener("input", clearCellError);
		document.querySelector("#po_detail_table tbody").addEventListener("change", clearCellError);

		var detailBody = document.querySelector("#po_detail_table tbody");
		var rowTemplate = document.getElementById("po_detail_row_template");

		//依列的順序重編欄位名的索引，新增或刪除列之後索引才會連續
		function renumberDetailRows() {
			detailBody.querySelectorAll("tr").forEach(function(row, index) {
				row.querySelector(".detail-id").name = "poDetails[" + index + "].poDetailId";
				row.querySelector(".detail-sku").name = "poDetails[" + index + "].skuId.skuId";
				row.querySelector(".detail-quantity").name = "poDetails[" + index + "].quantity";
				row.querySelector(".detail-unit-price").name = "poDetails[" + index + "].unitPrice";
			});
		}

		//伺服器畫出來的錯誤訊息是照送出當時的列順序放的；新增或刪除列之後就對不上，直接清掉
		function clearDetailErrors() {
			document.querySelectorAll("#po_detail_table .text-danger, #po_details_error, .amount-error").forEach(function(errorSpan) {
				errorSpan.remove();
			});
		}

		//建議採購量：依這一列選的規格，從 suggestedQuantityBySkuId 找出數量顯示在採購數量左邊；沒有選規格或該規格不需要採購時留空
		function updateSuggested(row) {
			var suggestedQuantity = suggestedQuantityBySkuId[row.querySelector(".detail-sku").value];
			row.querySelector(".detail-suggested").textContent = suggestedQuantity == null ? "" : suggestedQuantity;
		}
		detailBody.querySelectorAll("tr").forEach(updateSuggested);
		//改選規格時，建議採購量跟著換成新規格的
		detailBody.addEventListener("change", function(event) {
			if (event.target.classList.contains("detail-sku")) {
				updateSuggested(event.target.closest("tr"));
			}
		});

		document.getElementById("add_detail_row").addEventListener("click", function() {
			clearDetailErrors();
			detailBody.appendChild(rowTemplate.content.cloneNode(true));
			renumberDetailRows();
		});

		//刪除明細列；至少保留一列。真正刪除資料是在送出修改之後，由後端比對沒送回來的規格
		detailBody.addEventListener("click", function(event) {
			if (!event.target.classList.contains("detail-remove")) {
				return;
			}
			if (detailBody.querySelectorAll("tr").length <= 1) {
				return;
			}
			clearDetailErrors();
			event.target.closest("tr").remove();
			renumberDetailRows();
			updateAmounts();
		});

		//進頁面時依輸入框的數量、單價算一次；檢查失敗回來時，畫面上的小計與總金額才會和使用者填的內容一致
		updateAmounts();

		//送出後鎖住按鈕，避免連按重複送出
		document.querySelector(".update_form").addEventListener("submit", function() {
			document.getElementById("submit").disabled = true;
		});

		//按上一頁回到此頁時，瀏覽器可能還原成鎖住的狀態，需恢復按鈕
		window.addEventListener("pageshow", function() {
			document.getElementById("submit").disabled = false;
		});
	</script>

</body>
</html>
