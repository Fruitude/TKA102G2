<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Purchase System</title>

	<!-- 引入css資源 -->
	 <th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<style>
.search-toggle i {
	transition: transform 0.2s;
}

/* 收合時箭頭轉向右邊 */
.search-toggle[aria-expanded="false"] i {
	transform: rotate(-90deg);
}


</style>
</head>
<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- 引入側邊欄 -->
        <ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- 引入Topbar -->
                <nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

                <!-- 這裡放頁面自己的內容 -->
    			<div class="container-fluid">

					<!-- 錯誤訊息 -->
					<div class="alert alert-danger alert-dismissible fade show" role="alert"
					     th:if="${errorMessage != null}">
					    <span th:text="${errorMessage}" style="white-space: pre-line;"></span>
					    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
					        <span aria-hidden="true">&times;</span>
					    </button>
					</div>

					<!-- 條件查詢：一個表單，採購單編號、採購單狀態、供應商編號、採購員工編號可以同時填（條件之間是「而且」），沒填的條件不使用 -->
					<!-- 送到 PoNoController 的 searchPos，結果以 listAllPo.html 顯示；格式不符或查無資料時回到本頁，以上方的錯誤訊息顯示原因 -->
					<!-- 進頁面時固定展開，可以按標題列右側的按鈕收合 -->
					<div class="card shadow mb-4">
						<div class="card-header py-3 d-flex justify-content-between align-items-center">

							<h6 class="m-0 font-weight-bold text-primary">條件查詢</h6>

							<!-- 收合按鈕：Bootstrap 會在點擊時自動切換 aria-expanded -->
							<button type="button" class="btn btn-link btn-sm search-toggle"
								data-toggle="collapse" data-target="#poSearchBody"
								aria-controls="poSearchBody" aria-expanded="true">
								<i class="fas fa-chevron-down"></i>
							</button>

						</div>
						<div id="poSearchBody" class="collapse show">
						<div class="card-body">
							<!-- 欄位值用這次請求帶來的參數（param）回填，格式不符或查無資料回到本頁時保留使用者輸入的內容 -->
							<form th:action="@{/admin/psi/purchase/searchPos}" method="post" class="form-row align-items-end">
								<div class="col-auto mb-2">
									<label class="small mb-1" for="poNoInput">採購單編號</label>
									<input type="text" id="poNoInput" name="poNo"
										class="form-control form-control-sm" placeholder="PO202610090001" maxlength="15"
										th:value="${param.poNo}">
								</div>
								<div class="col-auto mb-2">
									<!-- 預設「查詢全部」，不限採購單狀態 -->
									<label class="small mb-1" for="poStatus">採購單狀態</label>
									<select id="poStatus" name="poStatus" class="custom-select custom-select-sm"
										th:with="selected=${param.poStatus != null ? #strings.trim(param.poStatus[0]) : ''}">
										<option value="" th:selected="${selected == ''}">查詢全部</option>
										<option value="0" th:selected="${selected == '0'}">待審核</option>
										<option value="1" th:selected="${selected == '1'}">申請通過</option>
										<option value="2" th:selected="${selected == '2'}">申請未通過</option>
										<option value="3" th:selected="${selected == '3'}">已取消</option>
										<option value="4" th:selected="${selected == '4'}">已結案</option>
									</select>
								</div>
								<div class="col-auto mb-2">
									<label class="small mb-1" for="vendorIdInput">供應商編號</label>
									<input type="text" id="vendorIdInput" name="vendorId"
										class="form-control form-control-sm" placeholder="請輸入供應商編號"
										th:value="${param.vendorId}">
								</div>
								<div class="col-auto mb-2">
									<label class="small mb-1" for="poEmployeeIdInput">採購員工編號</label>
									<input type="text" id="poEmployeeIdInput" name="poEmployeeId"
										class="form-control form-control-sm" placeholder="請輸入採購員工編號"
										th:value="${param.poEmployeeId}">
								</div>
								<div class="col-auto mb-2">
									<button type="submit" class="btn btn-primary btn-sm">查詢</button>
									<a th:href="@{/admin/psi/purchase}" class="btn btn-secondary btn-sm">清除條件</a>
								</div>
							</form>
						</div>
						</div>
					</div>

					<!-- 新增採購單：放在待採購商品區塊上方的右邊，不帶供應商，進新增頁後再選 -->
					<div class="d-flex justify-content-end mb-2">
						<a th:href="@{/admin/psi/purchase/addPo}"
							class="btn btn-success btn-icon-split btn-sm"> <span
							class="icon text-white-50"><i class="fas fa-plus"></i></span> <span
							class="text">新增採購單</span>
						</a>
					</div>

					<!-- 待採購商品：低於安全庫存的規格，belowSafetyStockByVendor 由 PoController、PoNoController 放入 model -->
					<!-- key 是供應商編號、value 是該供應商的規格清單，一個供應商一個區塊；沒有資料時區塊照樣顯示，改顯示「沒有待採購商品」 -->
					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-danger">待採購商品</h6>
						</div>
						<div class="card-body">
							<p class="mb-0 text-gray-800"
								th:if="${belowSafetyStockByVendor == null or belowSafetyStockByVendor.isEmpty()}">沒有待採購商品</p>
							<div class="row" th:unless="${belowSafetyStockByVendor == null or belowSafetyStockByVendor.isEmpty()}">
								<div class="col-12 mb-3" th:each="vendorEntry : ${belowSafetyStockByVendor}"
									th:with="vendor=${vendorEntry.value[0].product.vendor}">
									<div class="card">
										<div class="card-body">
											<div class="d-flex justify-content-between align-items-start mb-3">
												<h6 class="font-weight-bold text-gray-800"
													th:text="${vendor != null ? vendor.vendorId + ' - ' + vendor.vendorName : '未設定供應商'}"></h6>
												<!-- 帶 vendorId 到新增頁，由 PoController 的 addPo 先選好供應商，並把這個區塊的規格帶入明細（只帶入規格，新增頁另外顯示建議採購量）；未啟用的供應商無法採購，不顯示 -->
												<!-- 區塊裡已經有規格在待審核的採購單裡時（pendingPoIdByVendorId 有這個供應商），不能再新增，改顯示下方的「更新採購單」 -->
												<a th:if="${vendor != null and vendor.isActive == 1 and pendingPoIdByVendorId?.get(vendor.vendorId) == null}"
													th:href="@{/admin/psi/purchase/addPo(vendorId=${vendor.vendorId})}"
													class="btn btn-success btn-icon-split btn-sm"> <span
													class="icon text-white-50"><i class="fas fa-plus"></i></span> <span
													class="text">新增採購單</span>
												</a>
												<!-- 更新採購單：以 POST 把待審核採購單的 poId 送到 PoController 的 getOne_For_Update；送出時已經被審核的單會被擋下 -->
												<form method="post" th:action="@{/admin/psi/purchase/getOne_For_Update}"
													th:if="${vendor != null and pendingPoIdByVendorId?.get(vendor.vendorId) != null}">
													<input type="hidden" name="poId" th:value="${pendingPoIdByVendorId.get(vendor.vendorId)}">
													<!-- fillShortage：把待採購、但還不在這張單裡的規格先加進修改頁的明細（只帶入規格，修改頁另外顯示建議採購量） -->
													<input type="hidden" name="fillShortage" value="true">
													<button type="submit" class="btn btn-warning btn-icon-split btn-sm">
														<span class="icon text-white-50"><i class="fas fa-edit"></i></span>
														<span class="text">更新採購單</span>
													</button>
												</form>
											</div>
											<div class="table-responsive">
												<table class="table table-bordered table-sm mb-0" width="100%" cellspacing="0">
													<thead>
														<tr>
															<th>規格編號</th>
															<th>商品名稱-規格</th>
															<th>缺口數量</th>
															<th>待審核數量</th>
														</tr>
													</thead>
													<tbody>
														<tr th:each="productSku : ${vendorEntry.value}">
															<td th:text="${productSku.skuId}"></td>
															<!-- 商品名稱-規格名稱；查不到商品時只顯示規格名稱 -->
															<td th:text="${productSku.product?.productName != null ? productSku.product.productName + '-' + productSku.skuName : productSku.skuName}"></td>
															<td th:text="${productSku.shortageQty != null ? productSku.shortageQty : '良率為0，請人工確認'}"></td>
															<!-- pendingQuantityBySkuId 由 PoController、PoNoController 放入 model；沒有待審核明細的規格顯示 0 -->
															<td th:text="${pendingQuantityBySkuId?.get(productSku.skuId) ?: 0}"></td>
														</tr>
													</tbody>
												</table>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

			 <!-- /.container-fluid -->
            </div>

            <!-- 引入Footer -->
            <footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

        </div>
    </div>

    <!-- Scroll to Top Button-->
    <span class="scroll-to-top rounded">
        <i class="fas fa-angle-up"></i>
    </span>
		<!-- 	引入js資源     -->
    <th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

</body>
</html>
