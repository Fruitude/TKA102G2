<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>採購單列表</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<!-- DataTables 樣式 -->
<link th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet">
<style>
#vendor_list_all th, #vendor_list_all td {
	white-space: nowrap; /* 不換行 */
	vertical-align: middle; /* 內容上下置中 */
}

.intro-text {
	white-space: normal; /* 這欄允許換行 */
	width: 120px;
	display: -webkit-box;
	 /*-webkit-line-clamp: 3; 限制顯示三行 */
	-webkit-box-orient: vertical;
	overflow: hidden;
}

#vendor_list_all {
	font-size: 0.9rem;
}

</style>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">
					<h4 class="h4 mb-4 text-gray-800" th:switch="${poStatus}">
					    <span th:case="0">待審核</span>
					    <span th:case="1">申請通過</span>
					    <span th:case="2">申請未通過</span>
					    <span th:case="3">已取消</span>
					    <span th:case="*">顯示全部採購單</span>
					</h4>

					<a th:href="@{/admin/psi/purchase}" class="btn btn-secondary btn-icon-split mb-3"> 
						<span class="icon text-white-50">
						<i class="fas fa-arrow-left"></i></span> 
						<span class="text">回採購單管理</span>
					</a>

					<!-- 供應商查詢全部，樣式參考 tables.html -->
					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">採購單列表</h6>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-bordered" id="vendor_list_all" width="100%" cellspacing="0">
									<thead>
										<tr>
											<th>操作</th>
											<th>編號</th>
											<th>供應商</th>
											<th>採購員工</th>
											<th>採購日期</th>
											<th>採購單狀態</th>
											<th>總金額</th>
											<th th:if="${poStatus == 1}">驗收員工</th>
											<th th:if="${poStatus == 1}">驗收日期</th>
											<th th:if="${poStatus == 1}">驗收狀態</th>
											<th th:if="${poStatus == 1}">驗收實付金額</th>
										</tr>
									</thead>
									<tfoot>
										<tr>
											<th>操作</th>
											<th>編號</th>
											<th>供應商</th>
											<th>採購員工</th>
											<th>採購日期</th>
											<th>採購單狀態</th>
											<th>總金額</th>
											<th th:if="${poStatus == 1}">驗收員工</th>
											<th th:if="${poStatus == 1}">驗收日期</th>
											<th th:if="${poStatus == 1}">驗收狀態</th>
											<th th:if="${poStatus == 1}">驗收實付金額</th>
										</tr>
									</tfoot>
									<tbody>
										<tr th:each="poVO : ${poListData}">
											<td>
												<a th:href="@{/admin/psi/purchase/listOnePo(poId=${poVO.poId}, poStatus=${poStatus})}"
												class="btn btn-primary btn-sm mb-1">詳細</a>

												<!-- 待審核（poStatus = 0）的採購單才顯示修改按鈕 -->
												<form method="post" th:action="@{/admin/psi/purchase/getOne_For_Update}" class="d-inline"
													th:if="${poVO.editable}">
													<br>
													<input type="hidden" name="poId" th:value="${poVO.poId}">
													<input type="hidden" name="poStatus" th:value="${poStatus}">
													<button type="submit" class="btn btn-danger btn-sm">修改</button>
												</form>
											</td>
											<td th:text="${poVO.poNo}" style="text-align: center"></td>
											<td th:text="${poVO.vendor.vendorName}"></td>
										 	<td th:text="${poVO.poEmployeeId.employeeName}"></td>										
											<td th:text="${{poVO.orderDate}}"></td>
											<td th:switch="${poVO.poStatus}">
												<span th:case="0">待審核</span>
												<span th:case="1">申請通過</span>
												<span th:case="2">申請未通過</span>
												<span th:case="3">已取消</span>
											</td>
											<td th:text="${poVO.totalAmount}"></td>
											<!-- 只有篩選「申請通過」時才顯示驗收相關的四欄（表頭、表尾同樣以 poStatus 判斷） -->
											<td th:if="${poStatus == 1}" th:text="${poVO.inboundEmployeeId?.employeeName}"></td>
											<td th:if="${poStatus == 1}" th:text="${{poVO.inboundDate}}"></td>
											<td th:if="${poStatus == 1}">
												<span th:if="${poVO.inboundStatus == 0}" class="alert alert-secondary d-inline-block py-1 px-3 mb-0">尚未驗收</span>
												<span th:if="${poVO.inboundStatus == 1}" class="alert alert-success d-inline-block py-1 px-3 mb-0">驗收成功</span>
												<span th:if="${poVO.inboundStatus == 2}" class="alert alert-warning d-inline-block py-1 px-3 mb-0">驗收失敗</span>
											</td>
											<td th:if="${poStatus == 1}" th:text="${poVO.inboundAmount}"></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

	<!-- DataTables 套件與初始化 -->
	<script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
	<script th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"></script>
	<script>
		$(document).ready(function() {
			var table = $('#vendor_list_all').DataTable({
				searching : true, // 顯示右上角的搜尋欄位
				lengthMenu : [ 5, 10, 25, 50, 100 ], // 每頁顯示筆數的選項
				pageLength : 5, // 預設每頁顯示筆數
				columnDefs : [ {
					orderable : false,
					searchable : false,
					targets : [ 0, 5 ] // 操作、品牌標誌
				} ],
				order : [ [ 1, 'asc' ] ], // 預設依供應商編號排序
				language : {
					lengthMenu : "每頁顯示 _MENU_ 筆", // 左上角的筆數選單
					search : "搜尋：", // 右上角的搜尋欄位
					info : "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆", // 左下角的資訊
					infoEmpty : "顯示第 0 至 0 筆，共 0 筆", // 沒有資料時的左下角資訊
					infoFiltered : "（從 _MAX_ 筆中篩選）", // 搜尋後附加在左下角資訊後面
					zeroRecords : "找不到符合的資料", // 搜尋不到資料時顯示
					emptyTable : "目前沒有資料", // 表格完全沒資料時顯示
					paginate : {
						previous : "上一頁",
						next : "下一頁"
					}
				}
			});
			
			var searchInput = $('#vendor_list_all_filter input');
			var searchButton = $('<button type="button" class="btn btn-primary btn-sm ml-2">搜尋</button>');
			
			searchInput.off('.DT'); // 移除 DataTables 內建的即時搜尋
			$('#vendor_list_all_filter').append(searchButton); // 把按鈕放在搜尋欄位後面

			searchButton.on('click', function() {
			    table.search(searchInput.val()).draw();
			});

			// 在搜尋欄位按 Enter 也可以搜尋
			searchInput.on('keydown', function(e) {
			    if (e.key === 'Enter') {
			        table.search(searchInput.val()).draw();
			    }
			});
			
			// 搜尋欄位被清空時，自動還原成全部資料
			searchInput.on('input', function() {
			    if (searchInput.val().trim() === '') {
			        table.search('').draw();
			    }
			});
		});
	</script>

</body>
</html>
