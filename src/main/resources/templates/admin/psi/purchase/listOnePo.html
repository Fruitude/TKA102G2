<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>供應商資料</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">

					<a th:href="@{/admin/psi/purchase}" class="btn btn-secondary btn-icon-split mb-3"> <span class="icon text-white-50"><i class="fas fa-arrow-left"></i></span> <span class="text">回採購單管理</span></a>

					<!-- 新增、修改成功的提示（VendorController 的 insert、update） -->
					<div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div>

					<!-- 供應商單筆資料：vendorVO 由 VendorNoController 的 getOne_For_Display，或 VendorController 的 listOneVendor 放入 model -->
					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">採購單資料</h6>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-bordered" width="100%" cellspacing="0">
									<tbody>
										<tr>
											<th class="bg-light" style="width: 150px;">編號</th>
											<td th:text="${poVO.poNo}"></td>
										</tr>
										<tr>
											<th class="bg-light">供應商</th>
											<td th:text="${poVO.vendor.vendorName}"></td>
										</tr>
										<tr>
											<th class="bg-light">採購員工</th>
											<td th:text="${poVO.poEmployeeId.employeeName}"></td>
										</tr>
										<tr>
											<th class="bg-light">採購日期</th>
											<td th:text="${poVO.orderDate}"></td>
										</tr>
										<tr>
											<th class="bg-light">採購單狀態</th>
											<td th:text="${poVO.poStatus}"></td>
										</tr>
										<tr>
											<th class="bg-light">總金額</th>
											<td th:text="${poVO.totalAmount}"></td>
										</tr>
										<tr>
											<th class="bg-light">驗收員工</th>
											<td th:text="${poVO.inboundEmployeeId?.employeeName}"></td>
										</tr>
										<tr>
											<th class="bg-light">驗收日期</th>
											<td th:text="${poVO.inboundDate}"></td>
										</tr>
										<tr>
											<th class="bg-light">驗收狀態</th>
											<td th:text="${poVO.inboundStatus}"></td>
										</tr>
										<tr>
											<th class="bg-light">驗收實付金額</th>
											<td th:text="${poVO.inboundAmount}"></td>
										</tr>
										<tr>
											<th class="bg-light">操作</th>
											<td>
												<form method="post" th:action="@{/admin/psi/po/getOne_For_Update}">
													<input type="hidden" name="poId" th:value="${poVO.poId}">
													<button type="submit" class="btn btn-primary btn-sm">修改</button>
												</form>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

</body>
</html>
