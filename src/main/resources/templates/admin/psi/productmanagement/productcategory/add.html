<!DOCTYPE html><html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>水果商城管理</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f7f4;color:#26332b;margin:24px}main{max-width:1100px;margin:auto;background:white;padding:24px;border-radius:10px}nav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px}a{color:#287a4b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}label{display:block;margin:12px 0}input,select,textarea{padding:8px;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:90px}button{padding:8px 14px;background:#287a4b;color:white;border:0;border-radius:4px;cursor:pointer}form.inline{display:inline}.error{color:#b42318}.success{color:#287a4b}.sku-card{border:1px solid #ccc;padding:16px;margin:16px 0}.preview{max-width:240px;max-height:160px}fieldset{margin:16px 0} @media(max-width:700px){main{padding:12px}table{display:block;overflow-x:auto}}</style></head><body><main><nav><a th:href="@{/}">首頁</a><a th:href="@{/product/listAllProduct}">商品</a><a th:href="@{/productsku/listAllProductSku}">規格</a><a th:href="@{/productcategory/list}">分類</a><a th:href="@{/product/image/list}">圖片</a></nav><p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p><p class="error" th:if="${errorMsg}" th:text="${errorMsg}"></p><p class="success" th:if="${successMessage}" th:text="${successMessage}"></p><p class="success" th:if="${success}" th:text="${success}"></p><h1>新增分類</h1><form th:action="@{/productcategory/insert}" th:object="${productCategory}" method="post"><ul class="error" th:if="${#fields.hasAnyErrors()}"><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul><input type="hidden" th:field="*{productCategoryId}"><label>分類名稱 <input th:field="*{categoryName}" required maxlength="50"></label><label>父分類 <select name="parentCategoryId"><option value="">無（根分類）</option><option th:each="c:${categoryList}" th:if="${c.productCategoryId != productCategory.productCategoryId}" th:value="${c.productCategoryId}" th:text="${c.categoryName}" th:selected="${parentCategoryId != null and parentCategoryId == c.productCategoryId}"></option></select></label><label>描述 <textarea th:field="*{categoryDesc}" maxlength="255"></textarea></label><label>排序 <input type="number" th:field="*{sortOrder}" min="0" required></label><label>狀態 <select th:field="*{status}"><option value="0">停用</option><option value="1">啟用</option></select></label><button>儲存</button> <a th:href="@{/productcategory/list}">返回</a></form></main></body></html>
