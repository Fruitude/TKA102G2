<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Stock</title>

	<!-- 引入css資源 -->
	 <th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
</head>
<body>
<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- 引入側邊欄 -->
        <ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- 引入Topbar -->
                <nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

                <!-- 這裡放頁面自己的內容 -->
                <div class="container-fluid">

					<!-- 錯誤訊息：由 StockController 的 handleError 放入 model -->
					<div class="alert alert-danger alert-dismissible fade show" role="alert"
					     th:if="${errorMessage != null}">
					    <span th:text="${errorMessage}" style="white-space: pre-line;"></span>
					    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
					        <span aria-hidden="true">&times;</span>
					    </button>
					</div>
					<!-- 條件查詢：四個表單各自獨立，都用 GET 送到 StockController 的 stock，結果顯示在下方的庫存列表 -->
					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">條件查詢</h6>
						</div>
						<div class="card-body">

							<!-- 狀態碼與文字和 ProductSku 的 getStatusLabel 相同；status 由 StockController 放入 model，標示目前選的狀態 -->
							<form th:action="@{/admin/psi/stock}" method="get" class="form-inline mb-3">
								<label for="statusSelect" class="mr-3" style="width: 120px;">規格狀態</label>
								<select id="statusSelect" name="status" class="custom-select mr-2">
									<option value="">查詢全部</option>
									<option value="1" th:selected="${status == '1'}">上架</option>
									<option value="0" th:selected="${status == '0'}">下架</option>
									<option value="2" th:selected="${status == '2'}">缺貨</option>
									<option value="3" th:selected="${status == '3'}">即將售完</option>
									<option value="4" th:selected="${status == '4'}">售完</option>
									<option value="5" th:selected="${status == '5'}">預備上架</option>
									<option value="6" th:selected="${status == '6'}">即將停產</option>
									<option value="7" th:selected="${status == '7'}">永久停產</option>
								</select>
								<button type="submit" class="btn btn-primary">查詢</button>
							</form>

							<form th:action="@{/admin/psi/stock}" method="get" class="form-inline mb-3">
								<label for="skuIdInput" class="mr-3" style="width: 120px;">輸入規格編號</label>
								<input type="text" id="skuIdInput" name="skuId"
									class="form-control mr-2" placeholder="請輸入規格編號"
									th:value="${param.skuId}">
								<button type="submit" class="btn btn-primary">送出</button>
							</form>

							<form th:action="@{/admin/psi/stock}" method="get" class="form-inline mb-3">
								<label for="productNameInput" class="mr-3" style="width: 120px;">輸入商品名稱</label>
								<input type="text" id="productNameInput" name="productName"
									class="form-control mr-2" placeholder="請輸入商品名稱關鍵字" maxlength="30"
									th:value="${param.productName}">
								<button type="submit" class="btn btn-primary">送出</button>
							</form>

							<form th:action="@{/admin/psi/stock}" method="get" class="form-inline">
								<label for="skuNameInput" class="mr-3" style="width: 120px;">輸入規格名稱</label>
								<input type="text" id="skuNameInput" name="skuName"
									class="form-control mr-2" placeholder="請輸入規格名稱關鍵字" maxlength="30"
									th:value="${param.skuName}">
								<button type="submit" class="btn btn-primary">送出</button>
							</form>
						</div>
					</div>

					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">庫存列表</h6>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<!-- skuListData 由 StockController 的 stock 放入 model，沒有查詢條件時是全部規格（包含下架、售完、永久停產），規格編號由小到大，每頁 20 筆 -->
								<table class="table table-bordered" id="stock_list_all" width="100%" cellspacing="0">
									<thead>
										<tr>
											<th>操作</th>
											<th>規格編號</th>
											<th>商品名稱</th>
											<th>規格名稱</th>
											<th>供應商</th>
											<th>庫存</th>
											<th>安全庫存</th>
											<th>待進貨</th>
											<th>待出貨</th>
											<th>狀態</th>
										</tr>
									</thead>
									<tbody>
										<tr th:if="${skuListData.totalElements == 0}">
											<td colspan="10" class="text-center">目前沒有規格資料</td>
										</tr>
										<tr th:each="productSku : ${skuListData.content}">
											<!-- 操作按鈕上下排列並置中；align-middle 讓按鈕在列高較高時也維持在格子中間 -->
											<td class="align-middle">
												<div class="d-flex flex-column align-items-center">
													<!-- 檢視：連到 StockController 的 listOneStock，以 listOneStock.html 顯示單筆資料 -->
													<a th:href="@{/admin/psi/stock/listOneStock(skuId=${productSku.skuId})}"
														class="btn btn-primary btn-sm mb-1">檢視</a>
													<!-- 更新：連到 StockController 的 updateStock，以單筆頁調整這個規格的庫存 -->
													<a th:href="@{/admin/psi/stock/updateStock(skuId=${productSku.skuId})}"
														class="btn btn-danger btn-sm">更新</a>
												</div>
											</td>
											<!-- 操作欄以外的欄位文字用 align-middle 垂直置中，和操作欄的按鈕對齊 -->
											<td th:text="${productSku.skuId}" class="align-middle" style="text-align: center"></td>
											<td th:text="${productSku.product != null ? productSku.product.productName : ''}" class="align-middle"></td>
											<td th:text="${productSku.skuName}" class="align-middle"></td>
											<!-- 商品所屬的供應商；商品或供應商沒有資料時留空白 -->
											<td th:text="${productSku.product != null and productSku.product.vendor != null ? productSku.product.vendor.vendorName : ''}" class="align-middle"></td>
											<!-- 低於安全庫存（庫存 + 待進貨 - 待出貨 < 安全庫存，ProductSku 的 isBelowSafetyStock）時庫存數字標紅 -->
											<td th:text="${productSku.stock}" class="align-middle"
												th:classappend="${productSku.belowSafetyStock} ? 'text-danger font-weight-bold'"></td>
											<td th:text="${productSku.safetyStock}" class="align-middle"></td>
											<td th:text="${productSku.inboundQty}" class="align-middle"></td>
											<td th:text="${productSku.outboundQty}" class="align-middle"></td>
											<!-- 狀態的中文取自 ProductSku 的 getStatusLabel，和上方規格狀態下拉選單的文字相同 -->
											<td th:text="${productSku.statusLabel}" class="align-middle"></td>
										</tr>
									</tbody>
								</table>
							</div>

							<!-- 分頁：skuListData.number 是從 0 開始的頁碼，畫面與網址的 page 從 1 開始；queryString 是目前的查詢條件，接在 page 後面 -->
							<div class="d-flex justify-content-between align-items-center mt-3">
								<span th:text="${'共 ' + skuListData.totalElements + ' 筆'}"></span>
								<!-- 只有一頁時不顯示頁碼 -->
								<ul class="pagination mb-0" th:if="${skuListData.totalPages > 1}">
									<li class="page-item" th:classappend="${skuListData.first} ? 'disabled'">
										<a class="page-link" th:href="@{/admin/psi/stock} + '?page=' + ${skuListData.number} + ${queryString}">上一頁</a>
									</li>
									<li class="page-item" th:each="pageNumber : ${#numbers.sequence(1, skuListData.totalPages)}"
										th:classappend="${pageNumber == skuListData.number + 1} ? 'active'">
										<a class="page-link" th:href="@{/admin/psi/stock} + '?page=' + ${pageNumber} + ${queryString}" th:text="${pageNumber}"></a>
									</li>
									<li class="page-item" th:classappend="${skuListData.last} ? 'disabled'">
										<a class="page-link" th:href="@{/admin/psi/stock} + '?page=' + ${skuListData.number + 2} + ${queryString}">下一頁</a>
									</li>
								</ul>
							</div>
						</div>
					</div>

                    
                    
                    
                    
                    
                    
                    
                </div>
                <!-- 這裡放頁面自己的內容 -->
	
            </div>

            <!-- 引入Footer -->
            <footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

        </div>
    </div>

    <!-- Scroll to Top Button-->
    <span class="scroll-to-top rounded">
        <i class="fas fa-angle-up"></i>
    </span>
		<!-- 	引入js資源     -->
    <th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

</body>

</body>
</html>
