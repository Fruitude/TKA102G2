<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>規格庫存資料</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">

					<a th:href="@{/admin/psi/stock}" class="btn btn-secondary btn-icon-split mb-3">
						<span class="icon text-white-50"><i class="fas fa-arrow-left"></i></span>
						<span class="text">回庫存管理系統</span>
					</a>

					<!-- 成功、失敗的提示：之後調整頁存檔後 redirect 回來時顯示 -->
					<div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div>
					<div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

					<!-- 規格單筆資料：productSku 由 StockController 的 listOneStock 放入 model -->
					<div class="card shadow mb-4">
						<div class="card-header py-3 d-flex justify-content-between align-items-center">
							<h6 class="m-0 font-weight-bold text-primary">規格資料</h6>
							<!-- 連到 StockController 的 updateStock，以單筆頁調整這個規格的庫存 -->
							<a th:href="@{/admin/psi/stock/updateStock(skuId=${productSku.skuId})}"
								class="btn btn-danger btn-sm">更新</a>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-bordered" width="100%" cellspacing="0">
									<tbody>
										<tr>
											<th class="bg-light" style="width: 150px;">規格編號</th>
											<td th:text="${productSku.skuId}"></td>
										</tr>
										<tr>
											<th class="bg-light">商品名稱</th>
											<td th:text="${productSku.product != null ? productSku.product.productName : ''}"></td>
										</tr>
										<tr>
											<th class="bg-light">規格名稱</th>
											<td th:text="${productSku.skuName}"></td>
										</tr>
										<!-- 商品所屬的供應商；商品或供應商沒有資料時留空白 -->
										<tr>
											<th class="bg-light">供應商</th>
											<td th:text="${productSku.product != null and productSku.product.vendor != null ? productSku.product.vendor.vendorName : ''}"></td>
										</tr>
										<!-- 狀態的中文取自 ProductSku 的 getStatusLabel -->
										<tr>
											<th class="bg-light">規格狀態</th>
											<td th:text="${productSku.statusLabel}"></td>
										</tr>
									</tbody>
								</table>
							</div>

							<!-- 庫存數量：和規格資料放在同一張卡片，只顯示，要調整時按卡片標題右邊的更新 -->
							<div class="table-responsive">
								<table class="table table-bordered mb-0" width="100%" cellspacing="0">
									<!-- 六個數字橫向排成一列 -->
									<thead>
										<tr>
											<th class="bg-light">庫存數量</th>
											<th class="bg-light">安全庫存</th>
											<th class="bg-light">待進貨</th>
											<th class="bg-light">待出貨</th>
											<th class="bg-light">允許超賣量</th>
											<th class="bg-light">採購溢額量</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<!-- 低於安全庫存（庫存 + 待進貨 - 待出貨 < 安全庫存，ProductSku 的 isBelowSafetyStock）時庫存數字標紅，和首頁列表相同 -->
											<td th:text="${productSku.stock}"
												th:classappend="${productSku.belowSafetyStock} ? 'text-danger font-weight-bold'"></td>
											<td th:text="${productSku.safetyStock}"></td>
											<td th:text="${productSku.inboundQty}"></td>
											<td th:text="${productSku.outboundQty}"></td>
											<td th:text="${productSku.maxBackorderQty}"></td>
											<td th:text="${productSku.purchaseAddOnQty}"></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

</body>
</html>
