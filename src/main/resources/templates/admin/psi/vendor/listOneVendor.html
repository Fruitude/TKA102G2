<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>listOneVendor</title>


</head>
<body>

<!-- 供應商查詢全部：由 index.html 以 fragment 方式 include，樣式參考 tables.html -->
<div th:fragment="vendorListTable" class="card shadow mb-4">
	<div class="card-header py-3">
		<h6 class="m-0 font-weight-bold text-primary">供應商列表</h6>
	</div>
	<div class="card-body">
		<div class="table-responsive">
			<table class="table table-bordered" id="vendor_list_all" width="100%" cellspacing="0">
				<thead>
					<tr>
						<th style="text-align: center">供應商<br>編號</th>
						<th>品牌名稱</th>
						<th>供應商介紹</th>
						<th>產地</th>
						<th>品牌標誌</th>
						<th style="text-align: center">聯絡人<br>姓名</th>
						<th>統一編號</th>
						<th>連絡電話</th>
						<th>電子郵件</th>
						<th>啟用狀態</th>
						<th>修改/刪除</th>
					</tr>
				</thead>
				<tfoot>
					<tr>
						<th style="text-align: center">供應商<br>編號</th>
						<th>品牌名稱</th>
						<th>供應商介紹</th>
						<th>產地</th>
						<th>品牌標誌</th>
						<th style="text-align: center">聯絡人<br>姓名</th>
						<th>統一編號</th>
						<th>連絡電話</th>
						<th>電子郵件</th>
						<th>啟用狀態</th>
						<th>修改/刪除</th>
					</tr>
				</tfoot>
				<tbody>
					<tr th:each="vendorVO : ${vendorListData}">
						<td th:text="${vendorVO.vendorId}" style="text-align: center"></td>
						<td th:text="${vendorVO.vendorName}"></td>
						<td>
					  	<div class="intro-text" th:text="${vendorVO.vendorIntroduction}"
						       th:title="${vendorVO.vendorIntroduction}"></div>
						</td>
						<td th:text="${vendorVO.origin}"></td>
						<td><img th:src="@{/vendor/DBGifReader(vendorId=${vendorVO.vendorId})}" width="80px"></td>
						<td th:text="${vendorVO.contactPerson}"></td>
						<td th:text="${vendorVO.taxId}"></td>
						<td th:text="${vendorVO.phone}"></td>
						<td th:text="${vendorVO.email}"></td>
						<td>
						  <span th:if="${vendorVO.isActive == 0}" class="badge badge-secondary">停用</span>
						  <span th:if="${vendorVO.isActive == 1}" class="badge badge-success">啟用</span>
						  <span th:if="${vendorVO.isActive == 2}" class="badge badge-warning">審核中</span>
						</td>
						<td>
						  <div class="d-flex">
						    <form method="post" th:action="@{/vendor/getOne_For_Update}" class="mr-1">
						      <input type="hidden" name="vendorId" th:value="${vendorVO.vendorId}">
						      <button type="submit" class="btn btn-primary btn-sm">修改</button>
						    </form>
						    <form method="post" th:action="@{/vendor/delete}">
						      <input type="hidden" name="vendorId" th:value="${vendorVO.vendorId}">
						      <button type="submit" class="btn btn-danger btn-sm">刪除</button>
						    </form>
						  </div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

</body>
</html>
