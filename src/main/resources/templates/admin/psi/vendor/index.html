<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Vendor management</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<!-- DataTables 樣式（供查詢結果表格使用） -->
<link th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet">
<style>
#vendor_list_all th,
#vendor_list_all td {
  white-space: nowrap;     /* 不換行 */
  vertical-align: middle;  /* 內容上下置中 */
}
.intro-text {
  white-space: normal;        /* 這欄允許換行 */
  width: 120px;
  display: -webkit-box;
  -webkit-line-clamp: 3;  /* 限制顯示三行 */
  -webkit-box-orient: vertical;
  overflow: hidden;
}
#vendor_list_all { font-size: 0.9rem; }
</style>

</head>
<body>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">
					<h1 class="h3 mb-4 text-gray-800">供應商管理</h1>

					<a th:href="@{/admin/psi/vendor/listAllVendor}"class="btn btn-info btn-icon-split">
<!-- 	icon				<span class="icon text-white-50">  -->
<!-- 	暫時拿掉					<i class="fas fa-info-circle"></i> -->
<!-- 					</span>  -->
						<span class="text">查詢全部</span>
					</a>
					
					<form href="#" class="btn btn-info btn-icon-split">
<!-- 	icon				<span class="icon text-white-50">  -->
<!-- 	暫時拿掉					<i class="fas fa-info-circle"></i> -->
<!-- 					</span>  -->
						<span class="text">單筆查詢</span>
					</form>
					
					<form href="#" class="btn btn-info btn-icon-split">
<!-- 	icon				<span class="icon text-white-50">  -->
<!-- 	暫時拿掉					<i class="fas fa-info-circle"></i> -->
<!-- 					</span>  -->
						<span class="text">新增供應商</span>
					</form>
					
					<div th:if="${vendorListData != null}" class="mt-4">
 					<div th:replace="~{admin/psi/vendor/listAllVendor :: vendorListTable}"></div>
					</div>








				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>
	<!-- 	引入js資源     -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

	<!-- DataTables 套件與初始化（只有顯示查詢結果時才載入） -->
	<th:block th:if="${vendorListData != null}">
		<script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
		<script th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"></script>
		<script>
			$(document).ready(function() {
				$('#vendor_list_all').DataTable({
					columnDefs : [ { orderable : false, targets : [ 5, 11, 12 ] } ]
				});
			});
		</script>
	</th:block>

</body>

</body>
</html>
