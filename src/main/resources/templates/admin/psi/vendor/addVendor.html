<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新增供應商</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<style>
#vendor_add_form label {
	font-weight: bold;
}

#vendor_add_form .required::after {
	content: " *";
	color: #e74a3b;
}

#vendor_add_form input[type="file"]::file-selector-button {
	margin-right: 10px;
	padding: 0.375rem 0.75rem;
	font-size: 1rem;
	line-height: 1.5;
	color: #fff;
	background-color: #858796;
	border: 1px solid #858796;
	border-radius: 0.35rem;
	cursor: pointer;
	transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out;
}

#vendor_add_form input[type="file"]::file-selector-button:hover {
	background-color: #717384;
	border-color: #6b6d7d;
}

#blob_holder img {
	margin-top: 10px;
	border: 1px solid #d1d3e2;
}
</style>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">
					<h1 class="h3 mb-4 text-gray-800">供應商管理</h1>

					<a th:href="@{/admin/psi/vendor}" class="btn btn-secondary btn-icon-split mb-3"> <span class="icon text-white-50"><i class="fas fa-arrow-left"></i></span> <span class="text">回供應商管理</span></a>

					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">新增供應商</h6>
						</div>
						<div class="card-body">
							<p class="text-muted"><span class="text-danger">*</span> 為必填欄位</p>

							<form id="vendor_add_form" th:action="@{/admin/psi/vendor/insert}" method="post"
								th:object="${vendorVO}" enctype="multipart/form-data">

								<!-- 小農資訊：勾選才會顯示在前台「小農資訊」頁；圖片欄位 farmerImage 由 VendorController 另外接收，存到 front/img/farmers 並記錄相對路徑 -->
								<div class="form-group">
									<div class="custom-control custom-checkbox">
										<input type="checkbox" th:field="*{showInFarmers}" class="custom-control-input" id="showInFarmers" />
										<label class="custom-control-label" for="showInFarmers">是否顯示在小農資訊</label>
									</div>
								</div>

								<div id="farmer_fields" class="border rounded p-3 mb-3" style="display: none;">
									<div class="form-group">
										<label for="farmerImage" class="required">小農圖片</label>
										<input type="file" id="farmerImage" name="farmerImage" class="form-control-file"
											accept="image/png, image/jpeg, image/gif"
											onchange="hideContent('farmerImage.errors'); previewFarmerImage(this);" />
										<small class="form-text text-muted">PNG、JPEG、GIF，5MB 以內</small>
										<span class="text-danger d-block mt-1" th:text="${farmerImageError}" id="farmerImage.errors"></span>
										<div id="farmer_blob_holder">
											<img th:if="${vendorVO.farmerImagePath != null}" th:src="@{${vendorVO.farmerImagePath}}" width="120px" />
										</div>
									</div>

									<div class="form-group">
										<label for="growProduct" class="required">品名（種植）</label>
										<input type="text" th:field="*{growProduct}" class="form-control" maxlength="50"
											placeholder="種植何種水果，例如：愛文芒果" onclick="hideContent('growProduct.errors');" />
										<span th:if="${#fields.hasErrors('growProduct')}" th:errors="*{growProduct}"
											class="text-danger d-block mt-1" id="growProduct.errors"></span>
									</div>

									<div class="form-group">
										<label for="farmerSlogan" class="required">標語</label>
										<input type="text" th:field="*{farmerSlogan}" class="form-control" maxlength="100"
											onclick="hideContent('farmerSlogan.errors');" />
										<span th:if="${#fields.hasErrors('farmerSlogan')}" th:errors="*{farmerSlogan}"
											class="text-danger d-block mt-1" id="farmerSlogan.errors"></span>
									</div>

									<div class="form-group mb-0">
										<label for="farmerStory" class="required">小農故事</label>
										<textarea th:field="*{farmerStory}" class="form-control" rows="8" maxlength="5000"
											placeholder="一行一段，前台會依換行分段顯示" onclick="hideContent('farmerStory.errors');"></textarea>
										<span th:if="${#fields.hasErrors('farmerStory')}" th:errors="*{farmerStory}"
											class="text-danger d-block mt-1" id="farmerStory.errors"></span>
									</div>
								</div>

								<div class="form-group">
									<label for="vendorName" class="required">品牌名稱</label>
									<input type="text" th:field="*{vendorName}" class="form-control" maxlength="30"
										onclick="hideContent('vendorName.errors');" />
									<span th:if="${#fields.hasErrors('vendorName')}" th:errors="*{vendorName}"
										class="text-danger d-block mt-1" id="vendorName.errors"></span>
								</div>

								<div class="form-group">
									<label for="vendorIntroduction">供應商介紹</label>
									<textarea th:field="*{vendorIntroduction}" class="form-control" rows="4" maxlength="150"
										onclick="hideContent('vendorIntroduction.errors');"></textarea>
									<span th:if="${#fields.hasErrors('vendorIntroduction')}" th:errors="*{vendorIntroduction}"
										class="text-danger d-block mt-1" id="vendorIntroduction.errors"></span>
								</div>

								<div class="form-group">
									<label for="origin" class="required">產地</label>
									<input type="text" th:field="*{origin}" class="form-control" maxlength="20"
										onclick="hideContent('origin.errors');" />
									<span th:if="${#fields.hasErrors('origin')}" th:errors="*{origin}"
										class="text-danger d-block mt-1" id="origin.errors"></span>
								</div>

								<div class="form-group">
									<label for="contactPerson" class="required">聯絡人姓名</label>
									<input type="text" th:field="*{contactPerson}" class="form-control" maxlength="10"
										onclick="hideContent('contactPerson.errors');" />
									<span th:if="${#fields.hasErrors('contactPerson')}" th:errors="*{contactPerson}"
										class="text-danger d-block mt-1" id="contactPerson.errors"></span>
								</div>

								<div class="form-group">
									<label for="taxId">統一編號</label>
									<input type="text" th:field="*{taxId}" class="form-control" maxlength="8"
										placeholder="8碼數字" onclick="hideContent('taxId.errors');" />
									<span th:if="${#fields.hasErrors('taxId')}" th:errors="*{taxId}"
										class="text-danger d-block mt-1" id="taxId.errors"></span>
								</div>

								<div class="form-group">
									<label for="phone" class="required">連絡電話</label>
									<input type="text" th:field="*{phone}" class="form-control" maxlength="12"
										placeholder="02-12345678或0987-654321" onclick="hideContent('phone.errors');" />
									<span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"
										class="text-danger d-block mt-1" id="phone.errors"></span>
								</div>

								<div class="form-group">
									<label for="email">電子郵件</label>
									<input type="text" th:field="*{email}" class="form-control" maxlength="100"
										onclick="hideContent('email.errors');" />
									<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
										class="text-danger d-block mt-1" id="email.errors"></span>
								</div>

								<div class="form-group">
									<label for="isActive" class="required">啟用狀態</label>
									<select th:field="*{isActive}" class="custom-select"
										onclick="hideContent('isActive.errors');">
										<option value="0">尚未啟用</option>
										<option value="1">已啟用</option>
										<option value="2">已停用</option>
									</select>
									<span th:if="${#fields.hasErrors('isActive')}" th:errors="*{isActive}"
										class="text-danger d-block mt-1" id="isActive.errors"></span>
								</div>

								<!-- 品牌標誌：欄位名稱 upFiles 不是 VendorVO 的屬性，由 VendorController 的 insert 另外接收後存入 logo -->
								<div class="form-group">
									<label for="upFiles">品牌標誌</label>
									<input type="file" id="upFiles" name="upFiles" class="form-control-file"
										accept="image/png, image/jpeg, image/gif"
										onchange="hideContent('upFiles.errors'); previewImage(this);" />
									<span class="text-danger d-block mt-1" th:utext="${errorMessage}" id="upFiles.errors"></span>
									<div id="blob_holder"></div>
								</div>

								<button type="submit" id="submit" class="btn btn-primary">送出新增</button>
							</form>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

	<script>
		//清除提示信息
		function hideContent(d) {
			var el = document.getElementById(d);
			if (el) {
				el.style.display = "none";
			}
		}

		//送出後鎖住按鈕，避免連按重複送出
		document.getElementById("vendor_add_form").addEventListener("submit", function() {
			document.getElementById("submit").disabled = true;
		});

		//按上一頁回到此頁時，瀏覽器可能還原成鎖住的狀態，需恢復按鈕
		window.addEventListener("pageshow", function() {
			document.getElementById("submit").disabled = false;
		});

		//照片上傳-預覽用
		var acceptedTypes = {
			'image/png' : true,
			'image/jpeg' : true,
			'image/gif' : true
		};

		function previewImage(input) {
			var blob_holder = document.getElementById("blob_holder");
			var submitBtn = document.getElementById("submit");
			var file = input.files[0];

			blob_holder.innerHTML = "";
			submitBtn.disabled = false;

			// 沒有選擇檔案（品牌標誌非必填）
			if (!file) {
				return;
			}

			if (acceptedTypes[file.type] === true) {
				var reader = new FileReader();
				reader.onload = function(event) {
					var image = new Image();
					image.src = event.target.result;
					image.width = 120;
					blob_holder.appendChild(image);
				};
				reader.readAsDataURL(file);
			} else {
				var info = document.createElement("div");
				info.className = "text-danger small mt-2";
				info.innerText = "● filename: " + file.name
						+ "\n● ContentType: " + file.type
						+ "\n● size: " + file.size + " bytes"
						+ "\n● 上傳ContentType限制: image/png、image/jpeg、image/gif";
				blob_holder.appendChild(info);
				submitBtn.disabled = true;
			}
		}

		//小農資訊：勾選才顯示小農圖片、品名等欄位
		function toggleFarmerFields() {
			document.getElementById("farmer_fields").style.display =
					document.getElementById("showInFarmers").checked ? "block" : "none";
		}
		document.getElementById("showInFarmers").addEventListener("change", toggleFarmerFields);
		toggleFarmerFields();

		//小農圖片預覽；不合格的檔案直接清除選擇
		function previewFarmerImage(input) {
			var holder = document.getElementById("farmer_blob_holder");
			var file = input.files[0];
			if (!file) {
				return;
			}
			if (acceptedTypes[file.type] !== true || file.size > 5 * 1024 * 1024) {
				input.value = "";
				holder.innerHTML = "";
				var info = document.createElement("div");
				info.className = "text-danger small mt-2";
				info.innerText = "● 只能上傳 5MB 以內的 PNG、JPEG、GIF 圖片";
				holder.appendChild(info);
				return;
			}
			var reader = new FileReader();
			reader.onload = function(event) {
				holder.innerHTML = "";
				var image = new Image();
				image.src = event.target.result;
				image.width = 120;
				holder.appendChild(image);
			};
			reader.readAsDataURL(file);
		}
	</script>

</body>
</html>
