<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>listAllVendor</title>


<style type="text/css">
body {
	margin: 1rem 12rem 2rem 12rem;
}
</style>
</head>
<body>

	<table id="vendor_list_all" class="display" style="width: 100%">
  <thead >
	<tr style="background-color:#CCCCFF">
		<th>計數</th>
		<th>供應商編號</th>
		<th>品牌名稱</th>
		<th>供應商介紹</th>
		<th>產地</th>
		<th>品牌標誌</th>
		<th>聯絡人姓名</th>
		<th>統一編號</th>
		<th>連絡電話</th>
		<th>電子郵件</th>
		<th>啟用狀態</th>
		<th>修改</th>
		<th>刪除</th>
	</tr>
  </thead>
	
 <tbody>
  <th:block th:each="vendorVO : ${vendorListData}">
    <tr>
      <td th:text="${vendorVOStat.count}"></td>
      <td th:text="${vendorVO.vendorId}"></td>
      <td th:text="${vendorVO.vendorName}"></td>
      <td th:text="${vendorVO.vendorIntroduction}"></td>
      <td th:text="${vendorVO.origin}"></td>
      <td><img th:src="@{/vendor/DBGifReader(vendorId=${vendorVO.vendorId})}" width="100px"></td>
      <td th:text="${vendorVO.contactPerson}"></td>
      <td th:text="${vendorVO.taxId}"></td>
      <td th:text="${vendorVO.phone}"></td>
      <td th:text="${vendorVO.email}"></td>
      <td th:text="${vendorVO.isActive}"></td>
      <td>
        <form method="post" th:action="@{/vendor/getOne_For_Update}" style="margin-bottom: 0px;">
          <input type="submit" value="修改">
          <input type="hidden" name="vendorId" th:value="${vendorVO.vendorId}">
        </form>
      </td>
      <td>
        <form method="post" th:action="@{/vendor/delete}" style="margin-bottom: 0px;">
          <input type="submit" value="刪除">
          <input type="hidden" name="vendorId" th:value="${vendorVO.vendorId}">
        </form>
      </td>
    </tr>
  </th:block>
</tbody>
</table>
	

</body>
</html>
