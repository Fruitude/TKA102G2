<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Promo Detail</title>

	<!-- 引入css資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>

	<!-- 只作用在這頁的活動明細表格（class="promo-table"），不影響其他頁面的 table -->
	<style>
		.promo-table {
			width: 100%;
			white-space: nowrap;        /* 欄位內容不換行，不會被擠成直的 */
		}
		.promo-table th,
		.promo-table td {
			vertical-align: middle;
			padding: .5rem .75rem;
		}
		.promo-table thead th {
			background-color: #f8f9fc;
			text-align: center;
		}
		/* 數字欄靠右 */
		.promo-table .num {
			text-align: right;
		}
	</style>
</head>
<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- 引入側邊欄，activeMenu='promo' 讓左邊選單的「活動管理」反白 -->
        <ul th:replace="~{admin/index :: adminIndex-sidebar(activeMenu='promo')}"></ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- 引入Topbar -->
                <nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

                <!-- 這裡放頁面自己的內容 -->
                <div class="container-fluid">
                    <h1 class="h3 mb-4 text-gray-800">活動明細</h1>
                    <p class="text-gray-800" th:text="|活動 ${promo.promoProjectId}：${promo.promoProjectTitle}|"></p>

                    <div class="card shadow mb-4">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered table-hover promo-table" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>活動商品編號</th>
                                            <th>活動編號</th>
                                            <th>商品規格編號</th>
                                            <th>活動促銷價格</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="p : ${promotions}">
                                            <td th:text="${p.promotionId}"></td>
                                            <td th:text="${p.promoProjectId}"></td>
                                            <td th:text="${p.skuId}"></td>
                                            <td class="num" th:text="${p.promoPrice}"></td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(promotions)}">
                                            <td colspan="4" class="text-center text-muted py-4">這個活動目前沒有活動商品</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <a th:href="@{/admin/promo/}" class="btn btn-light btn-sm mt-3">返回列表</a>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 引入Footer -->
            <footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

        </div>
    </div>

    <!-- Scroll to Top Button-->
    <span class="scroll-to-top rounded">
        <i class="fas fa-angle-up"></i>
    </span>

    <!-- 引入js資源 -->
    <th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

</body>
</html>
