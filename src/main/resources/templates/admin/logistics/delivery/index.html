<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Delivery System</title>

	<!-- 引入css資源 -->
	 <th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
</head>
<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- 引入側邊欄 -->
        <ul th:replace="~{admin/index :: adminIndex-sidebar(activeMenu='logistics')}"></ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- 引入Topbar -->
                <nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

                <!-- 這裡放頁面自己的內容 -->
                <div class="container-fluid">
					<!-- 錯誤訊息：由 LogisticsController 的 deliver 放入 flash -->
					<div class="alert alert-danger alert-dismissible fade show" role="alert"
					     th:if="${errorMessage != null}">
					    <span th:text="${errorMessage}" style="white-space: pre-line;"></span>
					    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
					        <span aria-hidden="true">&times;</span>
					    </button>
					</div>
					<div class="alert alert-success alert-dismissible fade show" role="alert"
					     th:if="${success != null}">
					    <span th:text="${success}"></span>
					    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
					        <span aria-hidden="true">&times;</span>
					    </button>
					</div>
                    <div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-danger">配送中訂單</h6>
						</div>
						<div class="card-body">
							<!-- 工具列：左邊「送達」按鈕（用 form 屬性送出下方表格的勾選），右邊依訂單編號搜尋配送中的訂單，GET 送到 LogisticsController 的 delivery；沒填就列出全部 -->
							<div class="d-flex flex-wrap align-items-center mb-3">
								<button type="submit" id="deliver-button" form="deliver-form" class="btn btn-primary btn-icon-split mr-3" disabled>
									<span class="icon text-white-50"><i class="fas fa-route"></i></span>
									<span class="text">送達</span>
								</button>
								<form class="form-inline" th:action="@{/admin/logistics/delivery}" method="get">
									<label class="mr-2" for="search-orders-id">訂單編號</label>
									<input type="text" class="form-control mr-2" id="search-orders-id" name="ordersId"
										inputmode="numeric" placeholder="輸入訂單編號" th:value="${ordersIdText}">
									<button type="submit" class="btn btn-info mr-2">
										<i class="fas fa-search"></i> 搜尋
									</button>
									<a th:if="${!ordersIdText.isEmpty()}" th:href="@{/admin/logistics/delivery}" class="btn btn-secondary">清除</a>
								</form>
							</div>
							<!-- 勾選的訂單編號以 ordersIds 送到 LogisticsController 的 deliver，狀態由配送中（1）改成已配送（7） -->
							<form id="deliver-form" th:action="@{/admin/logistics/delivery/deliver}" method="post">
								<div class="table-responsive">
									<!-- 配送中訂單（ordersStatus = 1），ordersPage 由 LogisticsController 的 delivery 放入 model，訂單日期由舊到新，每頁 10 筆 -->
									<table class="table table-bordered" id="delivery_list_all" width="100%" cellspacing="0">
										<thead>
											<tr>
												<th style="width: 40px; text-align: center">
													<input type="checkbox" id="check-all" aria-label="全選">
												</th>
												<th>訂單編號</th>
												<th>訂單日期</th>
												<th>收件人姓名</th>
												<th>訂單備註</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="orders : ${ordersPage.content}">
												<td style="text-align: center">
													<input type="checkbox" class="order-check" name="ordersIds"
														th:value="${orders.ordersId}" th:aria-label="${'選取訂單 ' + orders.ordersId}">
												</td>
												<td th:text="${orders.ordersId}" style="text-align: center"></td>
												<td th:text="${orders.ordersDate != null ? #temporals.format(orders.ordersDate, 'yyyy-MM-dd HH:mm') : ''}"></td>
												<td th:text="${orders.receiverName}"></td>
												<td th:text="${orders.ordersNote}"></td>
											</tr>
											<tr th:if="${ordersPage.empty}">
												<td colspan="5" class="text-center text-muted"
													th:text="${ordersIdText.isEmpty() ? '目前沒有配送中的訂單' : '查無符合條件的配送中訂單'}">目前沒有配送中的訂單</td>
											</tr>
										</tbody>
									</table>
								</div>
							</form>

							<!-- 分頁：ordersPage.number 是從 0 開始的頁碼，畫面與網址的 page 從 1 開始 -->
							<div class="d-flex justify-content-between align-items-center mt-3">
								<span th:text="${'共 ' + ordersPage.totalElements + ' 筆'}"></span>
								<!-- 只有一頁時不顯示頁碼 -->
								<ul class="pagination mb-0" th:if="${ordersPage.totalPages > 1}">
									<li class="page-item" th:classappend="${ordersPage.first} ? 'disabled'">
										<a class="page-link" th:href="@{/admin/logistics/delivery(page=${ordersPage.number}, ordersId=${ordersIdText})}">上一頁</a>
									</li>
									<!-- 頁碼取自 pageNumbers（PsiUtils 的 buildPageNumbers）：0 顯示成「…」 -->
									<th:block th:each="pageNumber : ${pageNumbers}">
										<li class="page-item disabled" th:if="${pageNumber == 0}">
											<span class="page-link">…</span>
										</li>
										<li class="page-item" th:unless="${pageNumber == 0}"
											th:classappend="${pageNumber == ordersPage.number + 1} ? 'active'">
											<a class="page-link" th:href="@{/admin/logistics/delivery(page=${pageNumber}, ordersId=${ordersIdText})}" th:text="${pageNumber}"></a>
										</li>
									</th:block>
									<li class="page-item" th:classappend="${ordersPage.last} ? 'disabled'">
										<a class="page-link" th:href="@{/admin/logistics/delivery(page=${ordersPage.number + 2}, ordersId=${ordersIdText})}">下一頁</a>
									</li>
								</ul>
							</div>
						</div>
					</div>
                </div>

            </div>

            <!-- 引入Footer -->
            <footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

        </div>
    </div>

    <!-- Scroll to Top Button-->
    <span class="scroll-to-top rounded">
        <i class="fas fa-angle-up"></i>
    </span>
		<!-- 	引入js資源     -->
    <th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

    <script>
        $(document).ready(function() {
            var checks = $('.order-check');
            var checkAll = $('#check-all');
            var button = $('#deliver-button');

            // 有勾選才能按「送達」；全選框跟著各列的勾選狀態
            function refresh() {
                var checked = checks.filter(':checked').length;
                button.prop('disabled', checked === 0);
                checkAll.prop('checked', checks.length > 0 && checked === checks.length);
            }

            checkAll.on('change', function() {
                checks.prop('checked', this.checked);
                refresh();
            });
            checks.on('change', refresh);

            $('#deliver-form').on('submit', function(e) {
                var count = checks.filter(':checked').length;
                if (count === 0 || !confirm('確定要將 ' + count + ' 筆訂單改為已送達嗎？')) {
                    e.preventDefault();
                }
            });
            refresh();
        });
    </script>

</body>
</html>
