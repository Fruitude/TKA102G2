<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Order List</title>

	<!-- 引入css資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>

	<!-- 只作用在這頁的訂單表格（class="orders-table"），不影響其他頁面的 table -->
	<style>
		.orders-table {
			width: 100%;
			white-space: nowrap;        /* 欄位內容不換行，不會被擠成直的 */
		}
		.orders-table th,
		.orders-table td {
			vertical-align: middle;
			padding: .5rem .75rem;
		}
		.orders-table thead th {
			background-color: #f8f9fc;
			text-align: center;
		}
		/* 仿 Gmail 的分頁列：靠右，灰字「1–50 筆 (共 N 筆)」加上 < > 兩個箭頭 */
		.orders-pager {
			display: flex;
			justify-content: space-between;   /* 搜尋在左，筆數與箭頭在右 */
			align-items: center;
			flex-wrap: wrap;
			gap: .5rem;
			margin-bottom: .5rem;
			color: #5f6368;
			font-size: .85rem;
		}
		.orders-pager .pager-right {
			display: flex;
			align-items: center;
			margin-left: auto;
		}
		.orders-pager .pager-info {
			margin-right: 1rem;
		}
		/* 可排序的表頭：滑鼠移上去變手指，已排序的欄位後面顯示 ▲ 或 ▼ */
		.orders-table thead th.sortable a {
			color: inherit;
			text-decoration: none;
			cursor: pointer;
			display: block;
		}
		.orders-table thead th.sortable a:hover {
			color: #4e73df;
		}
		.orders-table thead th.sortable .sort-arrow {
			font-size: .7em;
			margin-left: .25rem;
			color: #4e73df;
		}
		.orders-search {
			display: flex;
			align-items: center;
			gap: .4rem;
		}
		.orders-search select {
			width: auto;
		}
		.orders-search input[type="text"] {
			width: 200px;
		}
		.orders-pager .pager-btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 36px;
			height: 36px;
			border-radius: 50%;
			color: #444746;
			text-decoration: none;
		}
		.orders-pager a.pager-btn:hover {
			background-color: #e8eaed;
		}
		.orders-pager .pager-btn.disabled {
			color: #c4c7c5;
			cursor: default;
			pointer-events: none;
		}
		/* 滑鼠移到表格上才出現的水平捲軸：固定在視窗底部，移開就消失 */
		#orders-hscroll {
			display: none;
			position: fixed;
			bottom: 0;
			height: 17px;
			overflow-x: auto;
			overflow-y: hidden;
			z-index: 1050;
			background: rgba(255, 255, 255, .9);
		}
		#orders-hscroll > div {
			height: 1px;
		}
		/* 數字欄靠右 */
		.orders-table .num {
			text-align: right;
		}
		/* 地址、信箱較長：限制寬度，超過用 ... 省略，滑鼠移上去可看完整內容（title） */
		.orders-table .long {
			max-width: 200px;
			overflow: hidden;
			text-overflow: ellipsis;
		}
	</style>
</head>
<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- 引入側邊欄 -->
        <ul th:replace="~{admin/index :: adminIndex-sidebar(activeMenu='orders')}"></ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- 引入Topbar -->
                <nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

                <!-- 這裡放頁面自己的內容 -->
                <div class="container-fluid">
                    <h1 class="h3 mb-4 text-gray-800">訂單管理</h1>

                    <div class="card shadow mb-4">
                        <div class="card-body">
                            <!-- 分頁列：1–50 筆 (共 N 筆)  <  > ；< 上一頁、> 下一頁，到頭尾時變灰不能按 -->
                            <div class="orders-pager">
                                <!-- 搜尋：選欄位、輸入內容、按搜尋；用 GET，網址帶著條件，翻頁也不會掉 -->
                                <form class="orders-search" method="get" th:action="@{/admin/orders/}">
                                    <!-- 搜尋時保留目前的排序 -->
                                    <input type="hidden" name="sort" th:value="${sort}" />
                                    <input type="hidden" name="dir" th:value="${dir}" />
                                    <select name="field" class="form-control form-control-sm" aria-label="搜尋欄位">
                                        <option value="id" th:selected="${field == 'id'}">ID</option>
                                        <option value="member" th:selected="${field == 'member'}">會員</option>
                                        <option value="status" th:selected="${field == 'status'}">狀態</option>
                                        <option value="receiver" th:selected="${field == 'receiver'}">收件者名稱</option>
                                        <option value="phone" th:selected="${field == 'phone'}">電話號碼</option>
                                    </select>
                                    <input type="text" name="keyword" class="form-control form-control-sm"
                                           placeholder="輸入搜尋內容" maxlength="50" th:value="${keyword}" />
                                    <button type="submit" class="btn btn-primary btn-sm">搜尋</button>
                                    <a th:if="${keyword != ''}" th:href="@{/admin/orders/}" class="btn btn-light btn-sm">清除</a>
                                </form>
                                <div class="pager-right">
                                    <span class="pager-info"
                                          th:text="|${fromIndex}–${toIndex} 筆 (共 ${totalCount} 筆)|"></span>
                                    <a th:if="${currentPage > 1}" class="pager-btn" title="上一頁"
                                       th:href="@{/admin/orders/(page=${currentPage - 1}, field=${field}, keyword=${keyword}, sort=${sort}, dir=${dir})}"><i class="fas fa-chevron-left"></i></a>
                                    <span th:unless="${currentPage > 1}" class="pager-btn disabled"><i class="fas fa-chevron-left"></i></span>
                                    <a th:if="${currentPage < totalPages}" class="pager-btn" title="下一頁"
                                       th:href="@{/admin/orders/(page=${currentPage + 1}, field=${field}, keyword=${keyword}, sort=${sort}, dir=${dir})}"><i class="fas fa-chevron-right"></i></a>
                                    <span th:unless="${currentPage < totalPages}" class="pager-btn disabled"><i class="fas fa-chevron-right"></i></span>
                                </div>
                            </div>
                            <div class="table-responsive" id="orders-wrap">
                                <table class="table table-bordered table-hover orders-table" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>操作</th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('ordersId','ID')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('member','會員')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('status','狀態')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('postalCode','郵遞區號')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('address','地址')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('payment','付款方式')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('productTotal','商品總額')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('discount','折扣')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('shippingFee','運費')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('shoppingCredit','購物金')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('actualPayment','實付')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('receiver','收件者名稱')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('email','電子信箱')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('phone','電話號碼')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('logisticsNote','物流備註')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('ordersNote','訂單備註')}"></th>
                                            <th th:replace="~{admin/orders/sortable :: sortTh('date','日期')}"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="row : ${ordersList}"
                                            th:with="orders=${row.get('orders')},
                                                     member=${row.get('member')}">

                                            <td>
                                                <button type="button" class="btn btn-primary btn-sm"
                                                    th:onclick="|location.href='@{/admin/orders/orderDetail(ordersId=${orders.ordersId})}'|">詳細</button>
                                                <button type="button" class="btn btn-warning btn-sm btn-edit-status"
                                                    th:attr="data-orders-id=${orders.ordersId}, data-status=${orders.ordersStatus}">修改</button>
                                            </td>
                                            <td th:text="${orders.ordersId}"></td>
                                            <td th:text="${member.memberName}"></td>
                                            <td th:with="statuses=${T(com.fruitude.utils.Utils$OrderStatus).values()}"
                                                th:text="${orders.ordersStatus != null and orders.ordersStatus >= 0 and orders.ordersStatus < statuses.length}
                                                         ? ${statuses[orders.ordersStatus].displayStatus + '(' + orders.ordersStatus + ')'} : '狀態異常'"></td>
                                            <td th:text="${orders.postalCode}"></td>
                                            <td class="long" th:text="${orders.shippingAddress}" th:title="${orders.shippingAddress}"></td>
                                            <td th:text="${orders.paymentMethod}"></td>
                                            <td class="num" th:text="${orders.productTotal}"></td>
                                            <td class="num" th:text="${orders.discount}"></td>
                                            <td class="num" th:text="${orders.shippingFee}"></td>
                                            <td class="num" th:text="${orders.shoppingCredit}"></td>
                                            <td class="num" th:text="${orders.actualPaymentAmount}"></td>
                                            <td th:text="${orders.receiverName}"></td>
                                            <td class="long" th:text="${orders.email}" th:title="${orders.email}"></td>
                                            <td th:text="${orders.phoneNumber}"></td>
                                            <td th:text="${orders.logisticsNote}"></td>
                                            <td th:text="${orders.ordersNote}"></td>
                                            <td th:text="${#temporals.format(orders.ordersDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 引入Footer -->
            <footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

        </div>
    </div>

    <!-- Scroll to Top Button-->
    <span class="scroll-to-top rounded">
        <i class="fas fa-angle-up"></i>
    </span>

    <!-- 引入js資源 -->
    <th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

    <!-- 修改訂單：按列上的「修改」跳出這個對話框，狀態選項來自 Utils.OrderStatus
         （value = getCode()，顯示文字 = getDisplayStatus()） -->
    <div class="modal fade" id="edit-status-modal" tabindex="-1" role="dialog"
         aria-labelledby="edit-status-title" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="edit-status-title">修改訂單狀態</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="關閉">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p class="mb-3">訂單編號：<strong id="edit-status-orders-id"></strong></p>
                    <label for="edit-status-select">狀態</label>
                    <select id="edit-status-select" class="form-control">
                        <option th:each="s : ${T(com.fruitude.utils.Utils$OrderStatus).values()}"
                                th:value="${s.code}" th:text="|${s.displayStatus} (${s.code})|"></option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="edit-status-confirm">確定</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
    // 按「修改」：把這一列的訂單編號與目前狀態帶進對話框，再顯示對話框
    // 按「確定」：POST 到 /admin/orders/updateStatus 更新這筆訂單的狀態，成功後重新載入頁面
    // （重新載入會保留網址上的搜尋、排序、頁碼，畫面上的狀態文字也由伺服器重新產生）
    $(function () {
        var currentOrdersId = null;
        var $confirm = $('#edit-status-confirm');

        $('.btn-edit-status').on('click', function () {
            currentOrdersId = $(this).data('orders-id');
            $('#edit-status-orders-id').text(currentOrdersId);
            $('#edit-status-select').val(String($(this).data('status')));
            $('#edit-status-modal').modal('show');
        });

        $confirm.on('click', function () {
            var status = $('#edit-status-select').val();
            if (currentOrdersId === null || status === null || status === '') {
                alert('請先選擇狀態');
                return;
            }
            $confirm.prop('disabled', true);   // 送出中，避免連按重複送出
            $.ajax({
                url: /*[[@{/admin/orders/updateStatus}]]*/ '/admin/orders/updateStatus',
                type: 'POST',
                data: { ordersId: currentOrdersId, ordersStatus: status }
            }).done(function () {
                location.reload();
            }).fail(function (xhr) {
                alert('更新失敗：' + (xhr.responseText || '請稍後再試'));
                $confirm.prop('disabled', false);
            });
        });
    });
    </script>

    <!-- 滑鼠在表格上時，才在視窗底部顯示水平捲軸，並與表格同步捲動 -->
    <div id="orders-hscroll"><div></div></div>
    <script>
    (function () {
        var wrap = document.getElementById('orders-wrap');
        var bar = document.getElementById('orders-hscroll');
        var inner = bar.firstElementChild;
        var hideTimer = null, syncing = false;

        function place() {
            var r = wrap.getBoundingClientRect();
            bar.style.left = r.left + 'px';
            bar.style.width = r.width + 'px';
            inner.style.width = wrap.scrollWidth + 'px';
            bar.scrollLeft = wrap.scrollLeft;
        }
        function show() {
            clearTimeout(hideTimer);
            if (wrap.scrollWidth <= wrap.clientWidth) return;   // 不需要水平捲動就不顯示
            place();
            bar.style.display = 'block';
        }
        function hide() {
            // 稍微延遲，滑鼠從表格移到捲軸時不會閃掉
            hideTimer = setTimeout(function () { bar.style.display = 'none'; }, 150);
        }

        wrap.addEventListener('mouseenter', show);
        wrap.addEventListener('mouseleave', hide);
        bar.addEventListener('mouseenter', show);
        bar.addEventListener('mouseleave', hide);
        window.addEventListener('resize', place);

        bar.addEventListener('scroll', function () {
            if (syncing) { syncing = false; return; }
            syncing = true; wrap.scrollLeft = bar.scrollLeft;
        });
        wrap.addEventListener('scroll', function () {
            if (syncing) { syncing = false; return; }
            syncing = true; bar.scrollLeft = wrap.scrollLeft;
        });
    })();
    </script>

</body>
</html>
