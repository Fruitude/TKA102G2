<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Order Detail</title>

	<!-- 引入css資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>

	<!-- 只作用在這頁的訂單明細表格（class="orders-table"），不影響其他頁面的 table -->
	<style>
		.orders-table {
			width: 100%;
			white-space: nowrap;        /* 欄位內容不換行，不會被擠成直的 */
		}
		.orders-table th,
		.orders-table td {
			vertical-align: middle;
			padding: .5rem .75rem;
		}
		.orders-table thead th {
			background-color: #f8f9fc;
			text-align: center;
		}
		/* 滑鼠移到表格上才出現的水平捲軸：固定在視窗底部，移開就消失 */
		#orders-hscroll {
			display: none;
			position: fixed;
			bottom: 0;
			height: 17px;
			overflow-x: auto;
			overflow-y: hidden;
			z-index: 1050;
			background: rgba(255, 255, 255, .9);
		}
		#orders-hscroll > div {
			height: 1px;
		}
		/* 數字欄靠右 */
		.orders-table .num {
			text-align: right;
		}
		/* 地址較長：限制寬度，超過用 ... 省略，滑鼠移上去可看完整內容（title） */
		.orders-table .long {
			max-width: 200px;
			overflow: hidden;
			text-overflow: ellipsis;
		}
	</style>
</head>
<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- 引入側邊欄 -->
        <ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- 引入Topbar -->
                <nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

                <!-- 這裡放頁面自己的內容 -->
                <div class="container-fluid">
                    <h1 class="h3 mb-4 text-gray-800">訂單明細</h1>

                    <div class="card shadow mb-4">
                        <div class="card-body">
                            <div class="table-responsive" id="orders-wrap">
                                <table class="table table-bordered table-hover orders-table" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>明細編號</th>
                                            <th>會員名稱</th>
                                            <th>商品規格名稱</th>
                                            <th>訂單編號</th>
                                            <th>商品名稱</th>
                                            <th>訂購數量</th>
                                            <th>單件價格</th>
                                            <th>商品評論</th>
                                            <th>評論時間</th>
                                            <th>評論狀態</th>
                                            <th>評論星數</th>
                                            <th>發票載具</th>
                                            <th>收件者名稱</th>
                                            <th>收件地址</th>
                                            <th>付款方式</th>
                                            <th>實付金額</th>
                                            <th>訂單日期</th>
                                            <th>訂單狀態</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="row : ${ordersDetailList}"
                                            th:with="details=${row.get('details')},
                                                     orders=${row.get('orders')},
                                                     sku=${row.get('sku')},
                                                     member=${row.get('member')}">

                                            <td th:text="${details.ordersDetailId}"></td>
                                            <td th:text="${member.memberName}"></td>
                                            <td th:text="${sku.skuName}"></td>
                                            <td th:text="${details.ordersId}"></td>
                                            <td th:text="${details.productName}"></td>
                                            <td class="num" th:text="${details.ordersQuantity}"></td>
                                            <td class="num" th:text="${details.unitPrice}"></td>
                                            <td class="long" th:text="${details.commentText}" th:title="${details.commentText}"></td>
                                            <td th:text="${details.commentDate != null} ? ${#temporals.format(details.commentDate, 'yyyy-MM-dd HH:mm')} : ''"></td>
                                            <td th:text="${details.commentStatus == null} ? '' : (${details.commentStatus == 0} ? '沒有評論' : (${details.commentStatus == 1} ? '有評論' : (${details.commentStatus == 2} ? '被檢舉' : (${details.commentStatus == 3} ? '檢舉成立隱藏' : ${details.commentStatus}))))"></td>
                                            <td class="num" th:text="${details.commentStar}"></td>
                                            <td th:text="${details.invoiceCarrier}"></td>
                                            <td th:text="${orders.receiverName}"></td>
                                            <td class="long" th:text="${orders.shippingAddress}" th:title="${orders.shippingAddress}"></td>
                                            <td th:text="${orders.paymentMethod}"></td>
                                            <td class="num" th:text="${orders.actualPaymentAmount}"></td>
                                            <td th:text="${#temporals.format(orders.ordersDate, 'yyyy-MM-dd HH:mm')}"></td>
                                            <td th:text="${orders.ordersStatus}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 引入Footer -->
            <footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

        </div>
    </div>

    <!-- Scroll to Top Button-->
    <span class="scroll-to-top rounded">
        <i class="fas fa-angle-up"></i>
    </span>

    <!-- 引入js資源 -->
    <th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

    <!-- 滑鼠在表格上時，才在視窗底部顯示水平捲軸，並與表格同步捲動 -->
    <div id="orders-hscroll"><div></div></div>
    <script>
    (function () {
        var wrap = document.getElementById('orders-wrap');
        var bar = document.getElementById('orders-hscroll');
        var inner = bar.firstElementChild;
        var hideTimer = null, syncing = false;

        function place() {
            var r = wrap.getBoundingClientRect();
            bar.style.left = r.left + 'px';
            bar.style.width = r.width + 'px';
            inner.style.width = wrap.scrollWidth + 'px';
            bar.scrollLeft = wrap.scrollLeft;
        }
        function show() {
            clearTimeout(hideTimer);
            if (wrap.scrollWidth <= wrap.clientWidth) return;   // 不需要水平捲動就不顯示
            place();
            bar.style.display = 'block';
        }
        function hide() {
            // 稍微延遲，滑鼠從表格移到捲軸時不會閃掉
            hideTimer = setTimeout(function () { bar.style.display = 'none'; }, 150);
        }

        wrap.addEventListener('mouseenter', show);
        wrap.addEventListener('mouseleave', hide);
        bar.addEventListener('mouseenter', show);
        bar.addEventListener('mouseleave', hide);
        window.addEventListener('resize', place);

        bar.addEventListener('scroll', function () {
            if (syncing) { syncing = false; return; }
            syncing = true; wrap.scrollLeft = bar.scrollLeft;
        });
        wrap.addEventListener('scroll', function () {
            if (syncing) { syncing = false; return; }
            syncing = true; bar.scrollLeft = wrap.scrollLeft;
        });
    })();
    </script>

</body>
</html>
