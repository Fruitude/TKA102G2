<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>客服聊天室</title>

	<!-- 引入css資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
	<style>
		.chat-list { max-height: 70vh; overflow-y: auto; }
        /* lg 以上左右並排時，左邊清單和右邊對話內容的高度都由 fitChatPanels 填滿到視窗底部，不受 70vh / 60vh 限制 */
        @media (min-width: 992px) { .chat-list { max-height: none; min-height: 240px; } }
        .chat-list-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin-top:12px}
        .chat-list-control{display:flex;align-items:center;gap:7px;font-size:.85rem}
        .chat-list-control label{margin:0;white-space:nowrap}
        .chat-list-control select{width:auto;min-width:94px}
        .chat-list-control button{min-width:62px}
		.chat-list .list-group-item { cursor: pointer; }
		.chat-messages { height: 60vh; overflow-y: auto; background: #f8f9fc; }
		.chat-row { display: flex; margin-bottom: .75rem; }
		.chat-row.staff { justify-content: flex-end; }
		/* 每則訊息的外層：寬度最多整列的 70%；裡面的泡泡、圖片、時間在會員/系統訊息靠左，客服訊息靠右 */
		.chat-row > div { max-width: 70%; display: flex; flex-direction: column; align-items: flex-start; }
		.chat-row.staff > div { align-items: flex-end; }
		.chat-bubble { padding: .5rem .75rem; border-radius: .5rem; white-space: pre-wrap; word-break: break-word; }
		.chat-row.member .chat-bubble { background: #fff; border: 1px solid #e3e6f0; }
		.chat-row.staff .chat-bubble { background: #4e73df; color: #fff; }
		.chat-row.system .chat-bubble { background: #eaecf4; color: #5a5c69; }
		.chat-meta { font-size: .75rem; color: #858796; margin-top: .25rem; }
		.chat-images { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .25rem; }
		/* 圖片多到換行時，客服訊息的最後一排也靠右 */
		.chat-row.staff .chat-images { justify-content: flex-end; }
		.chat-images img { width: 100px; height: 100px; object-fit: cover; border-radius: .25rem; background: #fff; cursor: zoom-in; }
		.chat-image-broken { font-size: .75rem; padding: .25rem .5rem; border: 1px dashed #d1d3e2; border-radius: .25rem; color: #858796; background: #fff; }
		.send-previews { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
		.send-preview { position: relative; }
		.send-preview img { width: 64px; height: 64px; object-fit: cover; border-radius: .25rem; border: 1px solid #e3e6f0; }
		.send-preview button { position: absolute; top: -.5rem; right: -.5rem; width: 1.25rem; height: 1.25rem; padding: 0; line-height: 1; border-radius: 50%; }
		.send-suggestions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .5rem; }
		.send-suggestions .suggestions-label { font-size: .8rem; color: #858796; }
		/* 看大圖的懸浮視窗：圖片最大是視窗的 90%，保持原比例 */
		#image-viewer .modal-dialog { max-width: 90vw; }
		#image-viewer .modal-content { background: transparent; border: 0; }
		#image-viewer .viewer-stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 200px; }
		#image-viewer .viewer-image { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: .25rem; background: #fff; }
		#image-viewer .viewer-status { color: #fff; }
		#image-viewer .viewer-close { position: absolute; top: -2.5rem; right: 0; color: #fff; opacity: .9; font-size: 2rem; }
		#image-viewer .viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 2.75rem; height: 2.75rem; border: 0; border-radius: 50%;
			background: rgba(0, 0, 0, .5); color: #fff; font-size: 1.25rem; }
		#image-viewer .viewer-nav:hover { background: rgba(0, 0, 0, .75); }
		#image-viewer .viewer-prev { left: .5rem; }
		#image-viewer .viewer-next { right: .5rem; }
		#image-viewer .viewer-counter { color: #fff; text-align: center; margin-top: .5rem; }
        .chat-reply-menu{position:fixed;z-index:2100;padding:4px;border:1px solid #d1d3e2;border-radius:7px;background:white;box-shadow:0 4px 18px #0002}.chat-reply-menu button{padding:8px 18px;background:white;border:0;border-radius:5px;color:#4e73df;cursor:pointer}.chat-reply-menu button:hover,.chat-reply-menu button:focus{background:#eef1fc}
        .chat-reply-draft{position:relative;margin-bottom:10px;padding:8px 30px 8px 12px;border-left:3px solid #4e73df;border-radius:5px;background:#edf1fc;font-size:.8rem}.chat-reply-draft p{margin:3px 0 0;max-height:40px;overflow:hidden;overflow-wrap:anywhere}.chat-reply-draft button{position:absolute;right:5px;top:3px;border:0;background:transparent;color:#858796;cursor:pointer}
        .chat-quoted{align-self:stretch;margin-bottom:5px;padding:6px 10px;border-left:3px solid #9bade8;border-radius:4px;background:#edf1fc;color:#58668b;font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere}.chat-quoted p{margin:3px 0 0}.chat-reply-menu[hidden],.chat-reply-draft[hidden]{display:none!important}.chat-row:focus-visible{outline:2px solid #b4c1eb;outline-offset:3px;border-radius:5px}
        /* 會員訊息右邊的回覆箭頭：平常隱藏，滑鼠移到該則訊息（或鍵盤聚焦）才出現；滑到箭頭上方顯示「回覆」提示氣泡 */
        /* 箭頭和泡泡在同一列（chat-bubble-line），貼著泡泡右邊；靠上對齊，margin-top 讓箭頭尖端（圖示 9/24 高處）和泡泡第一行文字的中線切齊：
           泡泡上 padding 8px + 半行高 12px = 20px；按鈕 padding 4px + 圖示 20px × 9/24 = 11.5px；20 - 11.5 = 8.5px */
        .chat-bubble-line{display:flex;align-items:flex-start;max-width:100%}
        .chat-bubble-line>.chat-bubble,.chat-bubble-line>.chat-images{min-width:0}
        /* 訊息旁的小按鈕（回覆箭頭 ↶、更多 ⋮）共用外觀：平常隱藏，滑鼠移到該則訊息或鍵盤聚焦才出現；⋮ 的選單開著時保持顯示 */
        .chat-action-button{position:relative;flex:0 0 auto;width:28px;height:28px;padding:4px;border:0;border-radius:50%;background:transparent;color:#858796;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s,color .15s,background-color .15s}
        .chat-row:hover .chat-action-button,.chat-row:focus-within .chat-action-button,.chat-action-button.is-open{opacity:1;pointer-events:auto}
        .chat-action-button:hover,.chat-action-button:focus-visible,.chat-action-button.is-open{color:#4e73df;background:#eef1fc;outline:none}
        .chat-action-button svg{display:block;width:100%;height:100%}
        /* 回覆箭頭：會員訊息在泡泡右邊、客服訊息在泡泡左邊（鏡像排列） */
        .chat-row.member .chat-reply-button{margin:8.5px 0 0 4px}
        .chat-row.staff .chat-reply-button{margin:8.5px 4px 0 0}
        /* ⋮ 和回覆箭頭同樣大小、同樣的 margin-top，兩個按鈕水平對齊；箭頭位置不變 */
        .chat-row.member .chat-more-button{margin:8.5px 0 0 2px}
        .chat-row.staff .chat-more-button{margin:8.5px 2px 0 0}
        .chat-reply-button::after{content:attr(data-tooltip);position:absolute;z-index:1;top:50%;left:calc(100% + 6px);transform:translateY(-50%);padding:3px 8px;border-radius:4px;background:#5a5c69;color:#fff;font-size:.72rem;line-height:1.4;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
        .chat-reply-button:hover::after,.chat-reply-button:focus-visible::after{opacity:1}
        /* 客服訊息的箭頭在泡泡左邊，提示氣泡改顯示在箭頭左邊，避免蓋住泡泡 */
        .chat-row.staff .chat-reply-button::after{left:auto;right:calc(100% + 6px)}
        .chat-copy-menu button:disabled{color:#1cc88a;cursor:default;background:white}
        /* 標為未讀鎖住時：顏色變淺，pointer-events:none 讓滑鼠滑過去沒有 hover 效果、點了也沒反應（不顯示提示文字） */
        .chat-mark-unread{flex:0 0 auto;margin-left:12px}
        .chat-mark-unread:disabled{opacity:.35;pointer-events:none;cursor:default}
        /* 對話列預覽：眼睛按鈕、右鍵選單共用的預覽視窗；只看不標已讀 */
        .chat-row-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
        .chat-preview-button{width:28px;height:28px;padding:0;border:0;border-radius:50%;background:transparent;color:#4e73df;cursor:pointer;line-height:28px}
        .chat-preview-button:hover,.chat-preview-button:focus{background:#eef1fc;outline:none}
        .list-group-item.active .chat-preview-button{color:#fff}.list-group-item.active .chat-preview-button:hover,.list-group-item.active .chat-preview-button:focus{background:rgba(255,255,255,.2)}
        .chat-preview-panel{position:fixed;z-index:2100;width:min(360px,calc(100vw - 16px));border:1px solid #d1d3e2;border-radius:7px;background:white;box-shadow:0 4px 18px #0002;overflow:hidden}
        .chat-preview-panel[hidden]{display:none!important}
        .chat-preview-heading{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;background:#4e73df;color:#fff}
        .chat-preview-heading strong{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem}
        .chat-preview-heading span{font-size:.75rem;color:rgba(255,255,255,.85);white-space:nowrap}
        .chat-preview-heading button{border:0;background:transparent;color:#fff;font-size:1.2rem;line-height:1;cursor:pointer;padding:0 4px}
        .chat-preview-body{max-height:50vh;overflow-y:auto;padding:6px 0;background:#f8f9fc}
        .chat-preview-item{padding:8px 14px;border-bottom:1px solid #edf0f5}.chat-preview-item:last-child{border-bottom:0}
        .chat-preview-item time{display:block;color:#858796;font-size:.72rem;margin-bottom:3px}
        .chat-preview-item p{margin:0;color:#3a3b45;font-size:.85rem;white-space:pre-wrap;overflow-wrap:anywhere}
        .chat-preview-item .chat-quoted{margin-bottom:5px}
        .chat-preview-images{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.chat-preview-images img{width:64px;height:64px;object-fit:cover;border-radius:4px;background:#fff}
        .chat-preview-status{padding:18px 14px;color:#858796;text-align:center;font-size:.85rem}
        .chat-preview-footer{padding:8px 10px;border-top:1px solid #e3e6f0;text-align:right}
	</style>
</head>
<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- 引入側邊欄 -->
        <ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- 引入Topbar -->
                <nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

                <div class="container-fluid">
					<!-- 錯誤訊息：API 回傳的錯誤由下方 script 顯示在這裡 -->
					<div class="alert alert-danger d-none" role="alert" id="chat-error"></div>

					<div class="row">
						<!-- 左邊：對話清單，資料來自 AdminChatController 的 conversations，最後訊息時間由新到舊 -->
						<div class="col-lg-4 mb-4">
							<div class="card shadow">
								<div class="card-header py-3">
									<h6 class="m-0 font-weight-bold text-primary">會員對話</h6>
                                    <div class="chat-list-controls">
                                        <div class="chat-list-control"><label for="conversation-filter">顯示</label><select class="form-control form-control-sm" id="conversation-filter"><option value="all">全部</option><option value="unread">僅未讀</option></select></div>
                                        <div class="chat-list-control"><span id="conversation-order-label">順序</span><button type="button" class="btn btn-sm btn-outline-primary" id="conversation-order" aria-labelledby="conversation-order-label conversation-order" title="目前最新優先，點擊改為最舊優先">最新</button></div>
                                    </div>
								</div>
								<div class="list-group list-group-flush chat-list" id="conversation-list">
									<div class="list-group-item text-muted">載入中…</div>
								</div>
							</div>
						</div>

						<!-- 右邊：目前選取會員的對話；員工訊息顯示發送員工姓名 -->
						<div class="col-lg-8 mb-4">
							<div class="card shadow">
								<div class="card-header py-3 d-flex justify-content-between align-items-center">
									<h6 class="m-0 font-weight-bold text-primary" id="conversation-title">請選擇會員開啟對話</h6>
									<!-- 標為未讀：把還沒回覆的會員訊息改回未讀並離開對話；最後一則是客服訊息時鎖住（顏色變淺、沒有反應），後端也會再檢查 -->
									<button type="button" class="btn btn-sm btn-outline-secondary chat-mark-unread" id="mark-unread-button" hidden>標為未讀</button>
								</div>
								<div class="card-body chat-messages" id="message-list"></div>
								<!-- 沒有 CHAT_REPLY 權限時不顯示輸入框（canReply 由 AdminChatController 的 chat 放入） -->
								<div class="card-footer" th:if="${canReply}">
									<!-- 建議回覆：依會員最新一則訊息比對罐頭訊息的關鍵字（AdminChatController 的 suggestions），點了帶入輸入框，可修改後再送出；沒有建議時不顯示 -->
									<div class="send-suggestions d-none" id="send-suggestions"></div>
									<!-- 選好、還沒送出的圖片縮圖，可以按 × 移除 -->
									<div class="send-previews" id="send-previews"></div>
									<form id="send-form" class="d-flex align-items-start" autocomplete="off">
										<!-- 只收 PNG、JPEG、GIF，一則最多 5 張、單張 5 MB；後端 ChatImageSupport 會再檢查一次 -->
										<input type="file" id="send-images" accept="image/png,image/jpeg,image/gif" multiple hidden>
										<button type="button" class="btn btn-outline-secondary mr-2" id="pick-images-button"
											title="選擇圖片" aria-label="選擇圖片" disabled><i class="fas fa-image"></i></button>
										<textarea class="form-control mr-2" id="send-content" rows="2" maxlength="1000"
											placeholder="輸入訊息，Enter 送出、Shift+Enter 換行" disabled></textarea>
										<button type="submit" class="btn btn-primary" id="send-button" disabled>送出</button>
									</form>
								</div>
							</div>
						</div>
					</div>
                </div>

            </div>

            <!-- 引入Footer -->
            <footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

        </div>
    </div>

    <!-- 看大圖的懸浮視窗（Bootstrap Modal）：整頁共用一個，點縮圖時由下方 script 換圖片並打開
         關閉：按 ×、點視窗外、按 Esc；同一則訊息有多張時可按左右箭頭或鍵盤 ← → 切換 -->
    <div class="modal fade" id="image-viewer" tabindex="-1" role="dialog" aria-label="查看圖片" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <button type="button" class="close viewer-close" data-dismiss="modal" aria-label="關閉">&times;</button>
                <div class="viewer-stage">
                    <button type="button" class="viewer-nav viewer-prev" id="viewer-prev" aria-label="上一張"><i class="fas fa-chevron-left"></i></button>
                    <img class="viewer-image d-none" id="viewer-image" alt="聊天圖片">
                    <span class="viewer-status" id="viewer-status"></span>
                    <button type="button" class="viewer-nav viewer-next" id="viewer-next" aria-label="下一張"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="viewer-counter" id="viewer-counter"></div>
            </div>
        </div>
    </div>

    <!-- Scroll to Top Button-->
    <span class="scroll-to-top rounded">
        <i class="fas fa-angle-up"></i>
    </span>
	<!-- 引入js資源 -->
    <th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
	<script th:inline="javascript">
	(function () {
		// 網站根路徑（有設定 context path 時也正確）
		const basePath = /*[[@{/}]]*/ '/';
		const conversationList = document.getElementById('conversation-list');
        const conversationFilter=document.getElementById('conversation-filter'),conversationOrder=document.getElementById('conversation-order');
        let oldestFirst=false,conversationRequest=0;
		const messageList = document.getElementById('message-list');
		const conversationTitle = document.getElementById('conversation-title');
		const errorBox = document.getElementById('chat-error');
		const sendForm = document.getElementById('send-form');
		const sendContent = document.getElementById('send-content');
		const sendButton = document.getElementById('send-button');
		const sendImagesInput = document.getElementById('send-images');
		const pickImagesButton = document.getElementById('pick-images-button');
		const sendPreviews = document.getElementById('send-previews');
		const sendSuggestions = document.getElementById('send-suggestions');

		// 圖片上限：和後端 ChatService.MAX_IMAGES、ChatImageSupport.MAX_SIZE、application.properties 的 max-request-size 相同
		const MAX_IMAGES = 5;
		const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
		const MAX_REQUEST_SIZE = 30 * 1024 * 1024;
		const ALLOWED_IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/gif'];

		// 目前開著的會員編號；還沒選時是 null
		let currentMemberId = null;
		// 選好、還沒送出的圖片
		let selectedImages = [];
		// 輸入框的內容是由哪一筆建議回覆帶入的（罐頭訊息編號）；送出時一起送，後端存成罐頭訊息。輸入框清空就取消
		let selectedCannedId = null;
		// 目前畫面上的對話清單，切換對話時用來顯示會員姓名
		let conversations = [];
        const messageData=new Map();let replyTarget=null,menuTarget=null;
        const replyDraft=document.createElement('div'),replyMenu=document.createElement('div'),replyAction=document.createElement('button');
        replyDraft.className='chat-reply-draft';replyDraft.hidden=true;if(sendForm)sendForm.before(replyDraft);
        replyMenu.className='chat-reply-menu';replyMenu.hidden=true;replyMenu.setAttribute('role','menu');
        replyAction.type='button';replyAction.textContent='回覆';replyAction.setAttribute('role','menuitem');replyMenu.append(replyAction);document.body.append(replyMenu);
        function senderLabel(m){return m.senderType===2?(m.employeeName||(m.employeeId?'員工 #'+m.employeeId:'客服')):m.senderType===1?'會員':'系統';}
        function replyText(m){const text=m.messageContent?.trim()||'[圖片訊息]';return Array.from(text).slice(0,100).join('')+(Array.from(text).length>100?'…':'');}
        function closeReplyMenu(){replyMenu.hidden=true;menuTarget=null;}
        function setReply(target){
            replyTarget=target;replyDraft.replaceChildren();replyDraft.hidden=!target;if(!target)return;
            const label=document.createElement('strong'),text=document.createElement('p'),cancel=document.createElement('button');
            label.textContent='回覆 '+senderLabel(target);text.textContent=replyText(target);cancel.type='button';cancel.textContent='×';cancel.setAttribute('aria-label','取消回覆');
            cancel.addEventListener('click',()=>setReply(null));replyDraft.append(label,text,cancel);
        }
        function showReplyMenu(event){
            const row=event.target.closest('.chat-row[data-message-id]');if(!row||!sendForm||sendButton.disabled)return;
            event.preventDefault();const target=messageData.get(Number(row.dataset.messageId));if(!target||target.memberId!==currentMemberId)return;
            menuTarget=target;replyMenu.hidden=false;const rect=row.getBoundingClientRect(),x=event.clientX||rect.left+15,y=event.clientY||rect.top+15;
            replyMenu.style.left=Math.max(8,Math.min(x,innerWidth-replyMenu.offsetWidth-8))+'px';replyMenu.style.top=Math.max(8,Math.min(y,innerHeight-replyMenu.offsetHeight-8))+'px';replyAction.focus({preventScroll:true});
        }
        messageList.addEventListener('contextmenu',showReplyMenu);
        messageList.addEventListener('keydown',event=>{if(event.key==='ContextMenu'||(event.shiftKey&&event.key==='F10'))showReplyMenu(event);});
        replyAction.addEventListener('click',()=>{if(menuTarget&&menuTarget.memberId===currentMemberId){setReply(menuTarget);sendContent.focus({preventScroll:true});}closeReplyMenu();});
        document.addEventListener('pointerdown',event=>{if(!replyMenu.contains(event.target))closeReplyMenu();});
        document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!replyMenu.hidden){event.preventDefault();closeReplyMenu();}});
        window.addEventListener('resize',closeReplyMenu);messageList.addEventListener('scroll',closeReplyMenu,{passive:true});
        function updateMessageMeta(row,message){
            if(message.senderType===2&&message.isRead===1)row.dataset.read='1';
            row.querySelector('.chat-meta').textContent=senderLabel(message)+'・'+formatTime(message.createdAt)+(message.senderType===2&&row.dataset.read==='1'?' · 客戶已讀':'');
        }


		function showError(message) {
			errorBox.textContent = message;
			errorBox.classList.remove('d-none');
		}

		function hideError() {
			errorBox.classList.add('d-none');
		}

		// 呼叫 API；失敗時丟出帶著後端訊息的錯誤
		async function callApi(path, options) {
			const response = await fetch(basePath + path, options);
			const body = await response.json().catch(() => null);
			if (!response.ok) {
				throw new Error(body && body.message ? body.message : '操作失敗（' + response.status + '）');
			}
			return body;
		}

		function formatTime(value) {
			return value ? value.replace('T', ' ').substring(0, 16) : '';
		}

		function memberLabel(conversation) {

		}

		// 對話清單：每位會員一列，有未讀時顯示紅色數字
		async function loadConversations() {
            const request=++conversationRequest;
			try {
                const result=await callApi('api/admin/chat/conversations');
                if(request!==conversationRequest)return;conversations=result;
			} catch (error) {
				showError(error.message);
				return;
			}
            renderConversations();
        }
        function renderConversations(){
            const scrollTop=conversationList.scrollTop;
            const visible=conversations.filter(item=>conversationFilter.value!=='unread'||Number(item.unreadCount)>0).slice().sort((a,b)=>{
                const timeA=Date.parse(a.lastMessageAt)||0,timeB=Date.parse(b.lastMessageAt)||0;
                return (oldestFirst?1:-1)*((timeA-timeB)||(a.memberId-b.memberId));
            });
			conversationList.replaceChildren();
			if (visible.length === 0) {
				const empty = document.createElement('div');
				empty.className = 'list-group-item text-muted';

				item.appendChild(text);
				if (conversation.unreadCount > 0) {
                    // 有未讀才有預覽：眼睛按鈕放在未讀數字左邊，點了不會開啟對話

                    previewButton.title='預覽未讀訊息（不會標為已讀）';previewButton.setAttribute('aria-label','預覽 '+memberLabel(conversation)+' 的未讀訊息');
                    const eye=document.createElement('i');eye.className='fas fa-eye';eye.setAttribute('aria-hidden','true');previewButton.append(eye);
                    previewButton.addEventListener('click',event=>{event.stopPropagation();openPreview(conversation.memberId,previewButton);});

				}
				item.addEventListener('click', () => openConversation(conversation.memberId));
				conversationList.appendChild(item);
			}
            conversationList.scrollTop=scrollTop;
		}

        // 對話列預覽：眼睛按鈕或右鍵選單打開，呼叫 preview API（只看不標已讀），需要時再按「開啟對話」
        const previewMenu=document.createElement('div'),previewAction=document.createElement('button');

        previewAction.type='button';previewAction.textContent='預覽未讀訊息';previewAction.setAttribute('role','menuitem');previewMenu.append(previewAction);document.body.append(previewMenu);
        const previewPanel=document.createElement('div'),previewHeading=document.createElement('div'),previewTitle=document.createElement('strong'),previewCount=document.createElement('span'),previewClose=document.createElement('button');

        previewPanel.append(previewHeading,previewBody,previewFooter);document.body.append(previewPanel);
        let previewMemberId=null,previewRequest=0,previewMenuMemberId=null;
        function closePreviewMenu(){previewMenu.hidden=true;previewMenuMemberId=null;}
        function previewStatus(text){const status=document.createElement('div');status.className='chat-preview-status';status.textContent=text;previewBody.replaceChildren(status);}
        // 關閉後焦點還給該列的眼睛按鈕（清單可能已重畫，所以用會員編號重新找）
        function closePreview(returnFocus){

        function previewItem(message){

                    thumbnail.src=basePath+'api/admin/chat/images/'+imageId+'/thumbnail';thumbnail.alt='聊天圖片';thumbnail.loading='lazy';
                    link.append(thumbnail);images.append(link);

        }
        async function loadPreview(){
            const id=previewMemberId,request=++previewRequest;if(id===null)return;
            try{
                const rows=await callApi('api/admin/chat/'+id+'/preview');
                if(request!==previewRequest||previewMemberId!==id)return;

            }catch(error){if(request===previewRequest&&previewMemberId===id)previewStatus(error.message);}
        }
        function openPreview(memberId,anchor){
            closePreviewMenu();const conversation=conversations.find(item=>item.memberId===memberId);
            previewMemberId=memberId;previewTitle.textContent=conversation?memberLabel(conversation):'會員 #'+memberId;

        }
        conversationList.addEventListener('contextmenu',event=>{
            const item=event.target.closest('[data-member-id]');if(!item)return;
            const memberId=Number(item.dataset.memberId),conversation=conversations.find(row=>row.memberId===memberId);
            // 沒有未讀的列保留瀏覽器原本的右鍵選單
            if(!conversation||!(conversation.unreadCount>0))return;
            event.preventDefault();closeReplyMenu();previewMenuMemberId=memberId;previewMenu.hidden=false;
            previewMenu.style.left=Math.max(8,Math.min(event.clientX,innerWidth-previewMenu.offsetWidth-8))+'px';
            previewMenu.style.top=Math.max(8,Math.min(event.clientY,innerHeight-previewMenu.offsetHeight-8))+'px';
            previewAction.focus({preventScroll:true});
        });
        previewAction.addEventListener('click',()=>{
            const id=previewMenuMemberId;if(id===null)return;
            const item=conversationList.querySelector('[data-member-id="'+Number(id)+'"]');if(item)openPreview(id,item);else closePreviewMenu();
        });
        previewClose.addEventListener('click',()=>closePreview(true));
        previewOpen.addEventListener('click',()=>{const id=previewMemberId;closePreview(false);if(id!==null)openConversation(id);});
        document.addEventListener('pointerdown',event=>{
            if(!previewMenu.contains(event.target))closePreviewMenu();

		// 一則訊息：senderType 1 是會員、2 是客服、0 是系統
		function appendMessage(message) {
            messageData.set(message.messageId,message);
            const existing=messageList.querySelector('[data-message-id="'+Number(message.messageId)+'"]');if(existing){updateMessageMeta(existing,message);return;}
			const senderClass = message.senderType === 2 ? 'staff' : message.senderType === 1 ? 'member' : 'system';
			const senderName = message.senderType === 2 ? (message.employeeName || (message.employeeId ? '員工 #' + message.employeeId : '客服')) : message.senderType === 1 ? '會員' : '系統';
			const row = document.createElement('div');
			row.className = 'chat-row ' + senderClass;
            row.dataset.messageId=message.messageId;row.dataset.sender=message.senderType;row.tabIndex=0;
			const wrapper = document.createElement('div');
            if(message.replyMessageId){const quote=document.createElement('div'),label=document.createElement('strong'),text=document.createElement('p');quote.className='chat-quoted';
                label.textContent='回覆 '+(message.reply?.senderType===1?'會員':message.reply?.senderType===2?'客服':message.reply?.senderType===0?'系統':'原訊息');
                text.textContent=message.reply?.messageContent||'原訊息已無法顯示';quote.append(label,text);wrapper.append(quote);}
			// 圖片訊息可以沒有文字，沒有文字就不顯示泡泡
			const contentBoxes = [];
			if (message.messageContent) {
				const bubble = document.createElement('div');
				bubble.className = 'chat-bubble';
				bubble.textContent = message.messageContent;
				contentBoxes.push(bubble);
			}
			if (message.imageIds && message.imageIds.length > 0) {
				contentBoxes.push(createImageList(message.imageIds));
			}
            // 訊息旁的小按鈕和第一個內容（文字泡泡，沒有文字時是圖片）放同一列，貼著它：
            // 會員訊息：泡泡 → 回覆箭頭 → ⋮；客服訊息鏡像排列：⋮ → 回覆箭頭 → 泡泡
            // 回覆箭頭要有輸入區（CHAT_REPLY）才有；⋮ 只有可以複製的文字訊息才有；系統訊息都不加
            const fromPerson=message.senderType===1||message.senderType===2;
            const canReply=fromPerson&&!!sendForm,canCopy=fromPerson&&!!message.messageContent;
            if(contentBoxes.length>0&&(canReply||canCopy)){
                const line=document.createElement('div');line.className='chat-bubble-line';
                const actions=[];if(canReply)actions.push(createReplyButton(message.messageId));if(canCopy)actions.push(createMoreButton(message.messageId));
                if(message.senderType===2)line.append(...actions.reverse(),contentBoxes[0]);else line.append(contentBoxes[0],...actions);
                contentBoxes[0]=line;
            }
			contentBoxes.forEach(box => wrapper.appendChild(box));
			const meta = document.createElement('div');
			meta.className = 'chat-meta';
			meta.textContent = senderName + '・' + formatTime(message.createdAt);
			wrapper.appendChild(meta);
			row.appendChild(wrapper);
			messageList.appendChild(row);updateMessageMeta(row,message);
            // 新訊息可能改變最後發送者（客服回覆後鎖住、會員再傳又解鎖）
            updateMarkUnreadButton();
		}

        // 回覆箭頭按鈕：線條 SVG（往上再往左轉的箭頭），顏色跟著按鈕文字色；點了跟右鍵「回覆該訊息」做一樣的事
        function createReplyButton(messageId){
            const svgNamespace='http://www.w3.org/2000/svg';
            const button=document.createElement('button');button.type='button';button.className='chat-action-button chat-reply-button';
            button.dataset.tooltip='回覆';button.setAttribute('aria-label','回覆這則訊息');
            const icon=document.createElementNS(svgNamespace,'svg');
            icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('fill','none');icon.setAttribute('stroke','currentColor');
            icon.setAttribute('stroke-width','2');icon.setAttribute('stroke-linecap','round');icon.setAttribute('stroke-linejoin','round');icon.setAttribute('aria-hidden','true');
            const head=document.createElementNS(svgNamespace,'polyline');head.setAttribute('points','9 14 4 9 9 4');
            const curve=document.createElementNS(svgNamespace,'path');curve.setAttribute('d','M20 20v-7a4 4 0 0 0-4-4H4');
            icon.append(head,curve);button.append(icon);
            button.addEventListener('click',()=>{
                const target=messageData.get(messageId);
                // 訊息送出中不能切換回覆對象；只能回覆目前開著的對話
                if(!target||sendButton.disabled||target.memberId!==currentMemberId)return;
                closeReplyMenu();setReply(target);sendContent.focus({preventScroll:true});
            });
            return button;
        }

        // ⋮ 更多按鈕：線條 SVG 三個實心小圓點；點一下在按鈕下方打開共用的「複製」選單，再點一次或點外面、按 Esc 關閉
        function createMoreButton(messageId){
            const svgNamespace='http://www.w3.org/2000/svg';
            const button=document.createElement('button');button.type='button';button.className='chat-action-button chat-more-button';
            button.setAttribute('aria-label','更多操作');button.setAttribute('aria-haspopup','menu');button.setAttribute('aria-expanded','false');
            const icon=document.createElementNS(svgNamespace,'svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('fill','currentColor');icon.setAttribute('aria-hidden','true');
            [5,12,19].forEach(y=>{const dot=document.createElementNS(svgNamespace,'circle');dot.setAttribute('cx','12');dot.setAttribute('cy',String(y));dot.setAttribute('r','2');icon.append(dot);});
            button.append(icon);
            button.addEventListener('click',()=>{if(copyMenuButton===button)closeCopyMenu();else openCopyMenu(button,messageId);});
            return button;
        }
        const copyMenu=document.createElement('div'),copyAction=document.createElement('button');
        copyMenu.className='chat-reply-menu chat-copy-menu';copyMenu.hidden=true;copyMenu.setAttribute('role','menu');
        copyAction.type='button';copyAction.setAttribute('role','menuitem');copyMenu.append(copyAction);document.body.append(copyMenu);
        let copyMenuButton=null,copyMessageId=null,copyCloseTimer=null;
        function openCopyMenu(button,messageId){
            closeCopyMenu();closeReplyMenu();copyMenuButton=button;copyMessageId=messageId;
            copyAction.textContent='複製';copyAction.disabled=false;copyMenu.hidden=false;
            button.classList.add('is-open');button.setAttribute('aria-expanded','true');
            // 放在 ⋮ 下方；客服訊息靠右，所以選單右緣對齊按鈕右緣，會員訊息左緣對齊；超出視窗時夾回來
            const rect=button.getBoundingClientRect(),left=button.closest('.chat-row.staff')?rect.right-copyMenu.offsetWidth:rect.left;
            copyMenu.style.left=Math.max(8,Math.min(left,innerWidth-copyMenu.offsetWidth-8))+'px';
            copyMenu.style.top=Math.max(8,Math.min(rect.bottom+4,innerHeight-copyMenu.offsetHeight-8))+'px';
            copyAction.focus({preventScroll:true});
        }
        function closeCopyMenu(returnFocus){
            clearTimeout(copyCloseTimer);if(!copyMenuButton)return;
            const button=copyMenuButton;copyMenuButton=null;copyMessageId=null;copyMenu.hidden=true;
            button.classList.remove('is-open');button.setAttribute('aria-expanded','false');if(returnFocus)button.focus({preventScroll:true});
        }
        // 複製文字：有 Clipboard API（https 或 localhost）時用它；部署在一般 http 時瀏覽器不提供，改用隱藏 textarea + execCommand
        async function copyText(text){
            if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return;}
            const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';
            document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw new Error('copy failed');
        }
        copyAction.addEventListener('click',async()=>{
            const message=messageData.get(copyMessageId);if(!message||!message.messageContent){closeCopyMenu(true);return;}
            try{await copyText(message.messageContent);copyAction.textContent='已複製';}catch(error){copyAction.textContent='複製失敗';}
            // 顯示結果一下子再自動關閉
            copyAction.disabled=true;clearTimeout(copyCloseTimer);copyCloseTimer=setTimeout(()=>closeCopyMenu(true),900);
        });
        document.addEventListener('pointerdown',event=>{if(copyMenuButton&&!copyMenu.contains(event.target)&&!copyMenuButton.contains(event.target))closeCopyMenu();});
        document.addEventListener('keydown',event=>{if(event.key==='Escape'&&copyMenuButton){event.preventDefault();closeCopyMenu(true);}});
        window.addEventListener('resize',()=>closeCopyMenu());messageList.addEventListener('scroll',()=>closeCopyMenu(),{passive:true});

		// 訊息裡的圖片：顯示縮圖，點了用懸浮視窗看原圖，可在同一則訊息的圖片之間左右切換
		// 連結仍指向原圖：Ctrl + 點擊或滑鼠中鍵照樣可以開新分頁
		// 縮圖讀不到（例如測試資料沒有圖片內容）時顯示「圖片無法顯示」
		function createImageList(imageIds) {
			const imageList = document.createElement('div');
			imageList.className = 'chat-images';
			imageIds.forEach((imageId, index) => {
				const link = document.createElement('a');
				link.href = imageUrl(imageId);
				link.target = '_blank';
				link.rel = 'noopener';
				link.addEventListener('click', event => {
					// 有按 Ctrl / Cmd / Shift 時照瀏覽器原本的方式開新分頁
					if (event.ctrlKey || event.metaKey || event.shiftKey) {

					event.preventDefault();
					openViewer(imageIds, index);
				});
				const thumbnail = document.createElement('img');
				thumbnail.src = basePath + 'api/admin/chat/images/' + imageId + '/thumbnail';
				thumbnail.alt = '聊天圖片';
				thumbnail.loading = 'lazy';
				thumbnail.addEventListener('error', () => {
					const broken = document.createElement('span');
					broken.className = 'chat-image-broken';
					broken.textContent = '圖片無法顯示';
					link.replaceWith(broken);
				});
				link.appendChild(thumbnail);
				imageList.appendChild(link);
			});
			return imageList;
		}

		function imageUrl(imageId) {
			return basePath + 'api/admin/chat/images/' + imageId;
		}

		// 懸浮視窗：viewerImageIds 是目前這則訊息的圖片編號，viewerIndex 是正在看第幾張
		const viewer = $('#image-viewer');
		const viewerImage = document.getElementById('viewer-image');
		const viewerStatus = document.getElementById('viewer-status');
		const viewerCounter = document.getElementById('viewer-counter');
		const viewerPrev = document.getElementById('viewer-prev');
		const viewerNext = document.getElementById('viewer-next');
		let viewerImageIds = [];
		let viewerIndex = 0;

		function openViewer(imageIds, index) {
			viewerImageIds = imageIds;
			showViewerImage(index);
			viewer.modal('show');
		}

		// 顯示第 index 張；超過頭尾時繞回另一端。原圖讀取中顯示「載入中…」，讀不到顯示「圖片無法顯示」
		function showViewerImage(index) {
			const count = viewerImageIds.length;
			viewerIndex = (index + count) % count;
			viewerImage.classList.add('d-none');
			viewerStatus.textContent = '載入中…';
			viewerImage.onload = () => {
				viewerStatus.textContent = '';
				viewerImage.classList.remove('d-none');
			};
			viewerImage.onerror = () => {
				viewerStatus.textContent = '圖片無法顯示';
			};
			viewerImage.src = imageUrl(viewerImageIds[viewerIndex]);
			// 只有一張時不顯示箭頭和張數
			const multiple = count > 1;
			viewerPrev.classList.toggle('d-none', !multiple);
			viewerNext.classList.toggle('d-none', !multiple);
			viewerCounter.textContent = multiple ? (viewerIndex + 1) + ' / ' + count : '';
		}

		viewerPrev.addEventListener('click', () => showViewerImage(viewerIndex - 1));
		viewerNext.addEventListener('click', () => showViewerImage(viewerIndex + 1));
		// 視窗開著時，鍵盤 ← → 切換（Esc 關閉由 Bootstrap 處理）
		document.addEventListener('keydown', event => {
			if (!viewer.hasClass('show') || viewerImageIds.length < 2) {
				return;
			}
			if (event.key === 'ArrowLeft') {
				showViewerImage(viewerIndex - 1);
			} else if (event.key === 'ArrowRight') {
				showViewerImage(viewerIndex + 1);
			}
		});
		// 關閉後清掉圖片，下次打開不會先閃一下上一張
		viewer.on('hidden.bs.modal', () => {
			viewerImage.removeAttribute('src');
			viewerImage.classList.add('d-none');
		});

		function scrollToBottom() {
			messageList.scrollTop = messageList.scrollHeight;
		}

		// 開啟一位會員的對話；後端會把會員送來的未讀訊息改成已讀
		async function openConversation(memberId) {
            setReply(null);closeReplyMenu();closeCopyMenu();
			currentMemberId = memberId;
			hideError();
            // 訊息載入完成前先鎖住標為未讀，避免用上一個對話的訊息判斷
            markUnreadButton.hidden=false;markUnreadButton.disabled=true;
			const conversation = conversations.find(item => item.memberId === memberId);
			conversationTitle.textContent = conversation ? memberLabel(conversation) : '會員 #' + memberId;
			let messages;
			try {
				messages = await callApi('api/admin/chat/' + memberId + '/messages');
			} catch (error) {
				showError(error.message);
				return;
			}
            if(currentMemberId!==memberId)return;
			messageList.replaceChildren();messageData.clear();
			messages.forEach(appendMessage);
			scrollToBottom();
			if (sendForm) {
				sendContent.disabled = false;
				sendButton.disabled = false;
				pickImagesButton.disabled = false;
				sendContent.focus();
				loadSuggestions(memberId);
			}
            updateMarkUnreadButton();
			loadConversations();
		}

        // 標為未讀按鈕：用畫面上已載入的訊息判斷能不能用，規則和後端 ChatService.markUnreadByStaff 相同
        // 鎖住：最後一則是客服訊息、或最後一則客服訊息之後沒有會員訊息（例如最後是系統訊息）、正在送出訊息、正在標為未讀
        const markUnreadButton=document.getElementById('mark-unread-button');
        let markingUnread=false;
        function updateMarkUnreadButton(){
            if(currentMemberId===null){markUnreadButton.hidden=true;return;}
            markUnreadButton.hidden=false;
            let last=null,lastStaffId=0;
            for(const message of messageData.values()){
                if(message.memberId!==currentMemberId)continue;
                if(!last||message.messageId>last.messageId)last=message;
                if(message.senderType===2&&message.messageId>lastStaffId)lastStaffId=message.messageId;
            }
            let pendingMember=false;
            for(const message of messageData.values())if(message.memberId===currentMemberId&&message.senderType===1&&message.messageId>lastStaffId)pendingMember=true;
            markUnreadButton.disabled=!last||last.senderType===2||!pendingMember||markingUnread||(!!sendForm&&sendButton.disabled);
        }
        // 離開目前的對話：右邊清空、輸入區還原並停用，左邊清單取消選取
        function leaveConversation(){
            currentMemberId=null;setReply(null);closeReplyMenu();closeCopyMenu();
            messageList.replaceChildren();messageData.clear();
            conversationTitle.textContent='請選擇會員開啟對話';
            if(sendForm){
                sendContent.value='';selectedCannedId=null;selectedImages=[];renderPreviews();renderSuggestions([]);
                sendContent.disabled=true;sendButton.disabled=true;pickImagesButton.disabled=true;
            }
            renderConversations();updateMarkUnreadButton();
        }
        markUnreadButton.addEventListener('click',async()=>{
            const memberId=currentMemberId;if(memberId===null||markUnreadButton.disabled)return;
            markingUnread=true;updateMarkUnreadButton();
            try{
                await callApi('api/admin/chat/'+memberId+'/unread',{method:'POST'});
                hideError();
                // 一定要離開對話：對話開著時收到會員新訊息會自動標回已讀
                if(currentMemberId===memberId)leaveConversation();
                loadConversations();document.dispatchEvent(new CustomEvent('fruitude:admin-chat-update'));
            }catch(error){
                // 後端拒絕（例如其他客服剛好回覆、畫面還沒更新）：顯示原因、留在對話並補載最新訊息
                showError(error.message);if(currentMemberId===memberId)refreshCurrentConversation();
            }finally{markingUnread=false;updateMarkUnreadButton();}
        });

		// 建議回覆：依會員最新一則訊息比對出來的罐頭訊息，按鈕顯示標題，滑鼠移上去顯示完整內容
		async function loadSuggestions(memberId) {
			let suggestions;
			try {
				suggestions = await callApi('api/admin/chat/' + memberId + '/suggestions');
			} catch (error) {
				// 建議只是輔助，讀不到就不顯示，不影響回覆
				suggestions = [];
			}
			// 等回應期間切換到別的會員時，不要蓋掉新對話的建議
			if (memberId !== currentMemberId) {
				return;
			}
			renderSuggestions(suggestions);
		}

		function renderSuggestions(suggestions) {
			sendSuggestions.replaceChildren();
			sendSuggestions.classList.toggle('d-none', suggestions.length === 0);
			if (suggestions.length === 0) {
				return;
			}
			const label = document.createElement('span');
			label.className = 'suggestions-label';
			label.textContent = '建議回覆：';
			sendSuggestions.appendChild(label);
			for (const suggestion of suggestions) {
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'btn btn-sm btn-outline-info';
				button.textContent = suggestion.title;
				button.title = suggestion.messageContent + '\n（命中關鍵字：' + suggestion.matchedKeywords.join('、') + '）';
				// 帶入輸入框（取代原本的內容），客服可以修改後再送出
				button.addEventListener('click', () => {
					sendContent.value = suggestion.messageContent;
					selectedCannedId = suggestion.cannedId;
					sendContent.focus();
				});
				sendSuggestions.appendChild(button);
			}
		}

		// 選好、還沒送出的圖片縮圖；按 × 從清單移除
		function renderPreviews() {
			for (const img of sendPreviews.querySelectorAll('img')) {
				URL.revokeObjectURL(img.src);
			}
			sendPreviews.replaceChildren();
			selectedImages.forEach((file, index) => {
				const preview = document.createElement('div');
				preview.className = 'send-preview';
				const img = document.createElement('img');
				img.src = URL.createObjectURL(file);
				img.alt = file.name;
				img.title = file.name;
				const removeButton = document.createElement('button');
				removeButton.type = 'button';
				removeButton.className = 'btn btn-sm btn-danger';
				removeButton.textContent = '×';
				removeButton.setAttribute('aria-label', '移除 ' + file.name);
				removeButton.addEventListener('click', () => {
					selectedImages.splice(index, 1);
					renderPreviews();
				});
				preview.append(img, removeButton);
				sendPreviews.appendChild(preview);
			});
		}

		// 加入選擇的圖片：先在頁面擋下類型不對、太大、超過張數的，後端還會再檢查一次
		function addImages(files) {
			hideError();
			for (const file of files) {
				if (!ALLOWED_IMAGE_TYPES.includes(file.type)) {
					showError('只接受 PNG、JPEG 或 GIF 圖片：' + file.name);
					continue;
				}
				if (file.size > MAX_IMAGE_SIZE) {
					showError('圖片不可超過 5 MB：' + file.name);
					continue;
				}
				if (selectedImages.length >= MAX_IMAGES) {
					showError('一則訊息最多 ' + MAX_IMAGES + ' 張圖片');
					break;
				}
				selectedImages.push(file);
			}
			renderPreviews();
		}

		// 送出訊息（文字與圖片一起用 FormData 送）：成功後畫面由 WebSocket 推播的 MESSAGE 事件加上，這裡不重複加
		async function sendMessage() {
			const content = sendContent.value.trim();
			if ((!content && selectedImages.length === 0) || currentMemberId === null) {
				return;
			}
			const totalSize = selectedImages.reduce((sum, file) => sum + file.size, 0);
			if (totalSize > MAX_REQUEST_SIZE) {
				showError('圖片合計不可超過 30 MB');
				return;
			}
			const sendingTo=currentMemberId;const formData = new FormData();
            if(replyTarget)formData.append('replyMessageId',replyTarget.messageId);
			formData.append('content', content);
			for (const file of selectedImages) {
				formData.append('images', file);
			}
			if (selectedCannedId !== null) {
				formData.append('cannedId', selectedCannedId);
			}
			sendButton.disabled = true;
			// 送出中先鎖住標為未讀，避免送出與標為未讀同時進行
			updateMarkUnreadButton();
			try {
				await callApi('api/admin/chat/' + sendingTo + '/messages', {
					method: 'POST',
					body: formData
				});
                if(currentMemberId!==sendingTo)return;setReply(null);
				sendContent.value = '';
				selectedCannedId = null;
				selectedImages = [];
				renderPreviews();
				// 已經回覆了，建議列收起來；會員再傳新訊息時才重新比對
				renderSuggestions([]);
				hideError();
			} catch (error) {
				showError(error.message);
			} finally {
				sendButton.disabled = false;
				sendContent.focus();
				updateMarkUnreadButton();
			}
		}

		if (sendForm) {
			// 輸入框被清空，就不算是罐頭訊息了
			sendContent.addEventListener('input', () => {
				if (sendContent.value.trim() === '') {
					selectedCannedId = null;
				}
			});
			pickImagesButton.addEventListener('click', () => sendImagesInput.click());
			sendImagesInput.addEventListener('change', () => {
				addImages(Array.from(sendImagesInput.files));
				// 清空，下次選同一個檔案也會觸發 change
				sendImagesInput.value = '';
			});
			sendForm.addEventListener('submit', event => {
				event.preventDefault();
				sendMessage();
			});
			sendContent.addEventListener('keydown', event => {
				if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
					event.preventDefault();
					sendMessage();
				}
			});
		}

		// WebSocket：訂閱 /topic/chat/staff，有新訊息或已讀時更新清單；是目前開著的對話就把新訊息加到畫面
		const websocketUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + basePath + 'admin/chat/ws';
		const stompClient = new StompJs.Client({
			brokerURL: websocketUrl,
			reconnectDelay: 5000
		});
		stompClient.onConnect = () => {
            document.dispatchEvent(new CustomEvent('fruitude:admin-chat-update'));
			stompClient.subscribe('/topic/chat/staff', frame => {
				const event = JSON.parse(frame.body);
                if(event.type==='MESSAGE'||event.type==='READ')document.dispatchEvent(new CustomEvent('fruitude:admin-chat-update'));
                // 預覽開著時，同一位會員有新訊息或被其他客服讀掉，就重新載入預覽
                if((event.type==='MESSAGE'||event.type==='READ')&&event.memberId===previewMemberId)loadPreview();
                // 其他客服把對話標回未讀：通知 topbar 信封更新數字，預覽開著的話也重新載入（清單在下面統一重新載入）
                if(event.type==='UNREAD'){document.dispatchEvent(new CustomEvent('fruitude:admin-chat-update'));if(event.memberId===previewMemberId)loadPreview();}
                if(event.type==='MEMBER_READ'&&event.memberId===currentMemberId){
                    for(const [id,message] of messageData)if(message.senderType===2&&id<=event.readThroughId){message.isRead=1;const row=messageList.querySelector('[data-message-id="'+id+'"]');if(row)updateMessageMeta(row,message);}
                }
				if (event.type === 'MESSAGE' && event.memberId === currentMemberId && event.message) {
					appendMessage(event.message);
					scrollToBottom();
                    if(event.message.senderType===1 && !document.hidden){
                        callApi('api/admin/chat/'+currentMemberId+'/messages').catch(error=>showError(error.message));
                        if(sendForm)loadSuggestions(currentMemberId);
                    }
				}
				loadConversations();
			});
			// 斷線重連期間可能漏掉訊息，清單和目前對話都補載。
            if(currentMemberId!==null)refreshCurrentConversation();
			loadConversations();
		};
        async function refreshCurrentConversation(){
            const id=currentMemberId;if(id===null)return;
            try{const rows=await callApi('api/admin/chat/'+id+'/messages');
                if(currentMemberId!==id)return;rows.forEach(appendMessage);scrollToBottom();
            }catch(error){showError(error.message);}
        }
        document.addEventListener('visibilitychange',()=>{if(!document.hidden&&currentMemberId!==null)refreshCurrentConversation();});
		stompClient.onStompError = frame => showError('即時連線錯誤：' + (frame.headers.message || ''));
		stompClient.activate();

        // 左邊會員對話清單、右邊對話內容都跟側邊欄一樣填滿到視窗底部，兩張卡片底部對齊
        // 共同底線 = 視窗高 - 卡片下方間距（mb-4 24px + 邊框 1px）；任一邊低於最小高度 240px 時，底線一起往下移，兩邊仍對齊
        // 右邊的高度要扣掉輸入區（card-footer），輸入區會因建議回覆、圖片縮圖、回覆草稿變高，所以也要監聽
        // 只在左右並排（lg 以上）時生效；手機窄版上下排列時維持 CSS 的 70vh / 60vh，避免把對話內容推到很下面
        const sideBySide=window.matchMedia('(min-width: 992px)');
        const messageFooter=messageList.nextElementSibling?.classList.contains('card-footer')?messageList.nextElementSibling:null;
        function fitChatPanels(){
            if(!sideBySide.matches){conversationList.style.height='';messageList.style.height='';return;}
            const listTop=conversationList.getBoundingClientRect().top+window.scrollY;
            const messagesTop=messageList.getBoundingClientRect().top+window.scrollY,footerHeight=messageFooter?messageFooter.offsetHeight:0;
            const bottom=Math.max(innerHeight-25,listTop+240,messagesTop+240+footerHeight);
            const atBottom=messageList.scrollHeight-messageList.scrollTop-messageList.clientHeight<4;
            conversationList.style.height=(bottom-listTop)+'px';
            messageList.style.height=(bottom-messagesTop-footerHeight)+'px';
            // 原本停在最新訊息的話，調整高度後繼續停在最下面
            if(atBottom)scrollToBottom();
        }
        window.addEventListener('resize',fitChatPanels);
        // 錯誤訊息、兩邊標題列、輸入區的高度改變都會影響位置，跟著重算
        const panelObserver=new ResizeObserver(fitChatPanels);
        [errorBox,conversationList.previousElementSibling,messageList.previousElementSibling,messageFooter].forEach(element=>{if(element)panelObserver.observe(element);});
        fitChatPanels();

		loadConversations();
	})();
	</script>

</body>
</html>
