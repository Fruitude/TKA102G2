<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品總覽</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Huninn&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/product-overview.css}" rel="stylesheet">
</head>
<body class="products-loading">
<div class="container">

    <p style="color:#b42318" th:if="${errorMessage}" th:text="${errorMessage}"></p><p th:if="${success}" th:text="${success}"></p>

    <section class="product-search-drawer" id="product-search-drawer" data-collapsed="false" aria-label="商品搜尋篩選">
    <div class="product-search-content" id="product-search-content">
    <div class="list-controls" id="product-list-controls">
        <div class="product-search-toolbar">
        <form class="product-search-row" id="product-search-form" role="search" aria-label="商品模糊搜尋">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
            <input id="product-search-input" type="search" maxlength="200" th:value="${keyword}" placeholder="輸入搜尋文字" aria-label="模糊搜尋文字" autocomplete="off">
            <label><input id="search-product-name" type="checkbox" th:checked="${searchProductName}">商品</label>
            <label><input id="search-sku-name" type="checkbox" th:checked="${searchSkuName}">規格</label>
        </form>
            <div class="page-status-buttons">
                <button type="button" id="page-status-on" title="整頁上架" aria-label="整頁上架" th:disabled="${#lists.isEmpty(productListData)}" onclick="changePageProductStatus(1)">整頁上架</button>
                <button type="button" id="page-status-off" class="page-status-off" title="整頁下架" aria-label="整頁下架" th:disabled="${#lists.isEmpty(productListData)}" onclick="changePageProductStatus(0)">整頁下架</button>
            </div>
        </div>
        <div class="filter-row-primary">
        <label for="page-size">每頁
            <select id="page-size">
                <option value="10" th:selected="${pageSize == 10}">10</option><option value="20" th:selected="${pageSize == 20}">20</option>
                <option value="50" th:selected="${pageSize == 50}">50</option><option value="100" th:selected="${pageSize == 100}">100</option>
            </select>個
        </label>
        <div class="category-filter">
            <span id="category-label">分類</span>
            <input id="parent-category" type="hidden" th:value="${selectedParentCategoryId}">
            <input id="child-category" type="hidden" th:value="${selectedCategoryId}">
            <div class="category-dropdown" id="category-dropdown">
                <button type="button" class="category-trigger" id="category-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="category-menu" aria-labelledby="category-label category-caption">
                    <span id="category-caption">全部</span><span aria-hidden="true">▾</span>
                </button>
                <div class="category-menu" id="category-menu" role="menu" aria-label="分類" hidden>
                    <input id="category-search" class="dropdown-search" type="search" placeholder="輸入分類名稱" aria-label="搜尋分類" autocomplete="off">
                    <p id="category-no-results" class="dropdown-empty" role="status" hidden>沒有符合的分類</p>
                    <div class="category-options">
                    <button type="button" class="category-all" role="menuitem" data-category-parent="" data-category-child="">全部</button>
                    <div class="category-group" th:each="parent : ${parentCategoryListData}">
                        <div class="category-parent-row">
                            <button type="button" class="category-parent" role="menuitem" th:attr="data-category-parent=${parent.productCategoryId},data-category-child=''" th:text="${parent.categoryName}"></button>
                            <button type="button" class="category-expand" aria-haspopup="menu" aria-expanded="false" th:attr="aria-label=${'展開' + parent.categoryName + '的小分類'},aria-controls=${'category-children-' + parent.productCategoryId}"><span aria-hidden="true">▸</span></button>
                        </div>
                        <div class="category-submenu" role="menu" th:id="${'category-children-' + parent.productCategoryId}" th:attr="aria-label=${parent.categoryName + '小分類'}" hidden>
                            <th:block th:each="child : ${categoryChildrenByParent[parent.productCategoryId]}">
                                <button type="button" class="category-child" role="menuitem" th:attr="data-category-parent=${parent.productCategoryId},data-category-child=${child.productCategoryId}" th:text="${child.categoryName}"></button>
                            </th:block>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="category-filter">
            <span id="vendor-label">廠商</span>
            <select id="filter-vendor" hidden aria-hidden="true" tabindex="-1">
                <option value="">全部</option>
                <option th:each="vendor : ${vendorListData}" th:value="${vendor.vendorId}"
                        th:text="${vendor.vendorName}" th:selected="${selectedVendorId == vendor.vendorId}"></option>
            </select>
            <div class="category-dropdown" id="vendor-dropdown">
                <button type="button" class="category-trigger" id="vendor-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="vendor-menu" aria-labelledby="vendor-label vendor-caption">
                    <span id="vendor-caption">全部</span><span aria-hidden="true">▾</span>
                </button>
                <div class="category-menu" id="vendor-menu" role="menu" aria-label="供應廠商" hidden>
                    <input id="vendor-search" class="dropdown-search" type="search" placeholder="輸入供應商名稱" aria-label="搜尋供應廠商" autocomplete="off">
                    <div id="vendor-options" class="vendor-options"></div>
                    <p id="vendor-no-results" class="dropdown-empty" role="status" hidden>沒有符合的供應廠商</p>
                </div>
            </div>
        </div>
        <label class="modified-sort-control" for="modified-sort">修改
            <button type="button" id="modified-sort" aria-label="修改時間排序" th:attr="aria-pressed=${sortBy == 'modified'},data-order=${sortBy == 'modified' and sortDirection == 'asc' ? 'asc' : 'desc'}"><svg class="time-sort-icon" th:if="${sortBy != 'modified'}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span th:if="${sortBy == 'modified'}" th:text="${sortDirection == 'asc' ? '最舊' : '最新'}">最新</span></button><span>排序</span>
        </label>
        </div>
        <div class="filter-row-secondary">
        <label for="stock-filter">庫存
            <select id="stock-filter">
                <option value="all" th:selected="${stockFilter == 'all'}">全部</option>
                <option value="normal" th:selected="${stockFilter == 'normal'}">正常</option>
                <option value="abnormal" th:selected="${stockFilter == 'abnormal'}">異常</option>
                <option value="below-safety" th:selected="${stockFilter == 'below-safety'}">低於安全庫存</option>
                <option value="high-stock" th:selected="${stockFilter == 'high-stock'}">庫存高於100</option>
                <option value="inbound" th:selected="${stockFilter == 'inbound'}">待進貨異常</option>
                <option value="outbound" th:selected="${stockFilter == 'outbound'}">待出貨異常</option>
                <option value="unset-safety" th:selected="${stockFilter == 'unset-safety'}">未設安全庫存</option>
            </select>
        </label>
        <label for="status-filter">狀態
            <select id="status-filter">
                <option value="all" th:selected="${statusFilter == 'all'}">全部</option>
                <option value="on" th:selected="${statusFilter == 'on'}">僅顯示上架</option>
                <option value="off" th:selected="${statusFilter == 'off'}">僅顯示下架</option>
            </select>
        </label>
        <label class="comment-range" for="min-comments">評論
            <input id="min-comments" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="評論數下限" aria-describedby="comment-range-error" th:value="${minComments}" autocomplete="off">
            <span>~</span>
            <input id="max-comments" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="評論數上限" aria-describedby="comment-range-error" th:value="${maxComments}" autocomplete="off">
        </label>
        <div class="rating-filter-control">
        <label for="rating-filter">評分
            <select id="rating-filter">
                <option value="" th:selected="${ratingFilter == ''}">全部</option>
                <option value="unrated" th:selected="${ratingFilter == 'unrated'}">未評分</option>
                <option value="0-1" th:selected="${ratingFilter == '0-1'}">0~1</option>
                <option value="1-2" th:selected="${ratingFilter == '1-2'}">1~2</option>
                <option value="2-3" th:selected="${ratingFilter == '2-3'}">2~3</option>
                <option value="3-4" th:selected="${ratingFilter == '3-4'}">3~4</option>
                <option value="4-5" th:selected="${ratingFilter == '4-5'}">4~5</option>
            </select>
        </label>
        <button type="button" id="reset-product-filters">恢復預設</button>
        </div>
        </div>
        <p id="comment-range-error" role="status" aria-live="polite" hidden></p>
    </div>
    </div>
    <div class="search-drawer-footer">
        <button type="button" id="toggle-product-search" aria-label="收起搜尋功能" aria-controls="product-search-content" aria-expanded="true" title="收起搜尋功能"><svg viewBox="0 0 24 18" aria-hidden="true"><path d="M3 12 12 5 21 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <p id="page-status-message" role="status" aria-live="polite" hidden></p>
    </div>
    </section>
    <table id="product-table" th:attr="data-page=${currentPage},data-total-pages=${totalPages},data-total-products=${totalProducts},data-sort-by=${sortBy},data-sort-direction=${sortDirection}">
        <colgroup>
            <col class="col-number"><col class="col-image"><col class="col-name"><col class="col-sku"><col class="col-vendor"><col class="col-stock">
            <col class="col-count"><col class="col-score"><col class="col-status"><col class="col-actions">
        </colgroup>
        <thead>
        <tr>
            <th> </th>
            <th>圖片</th>
            <th>名稱</th>
            <th>規格</th>
            <th>廠商</th>
            <th>庫存</th>
            <th scope="col" th:attr="aria-sort=${sortBy == 'comments' ? (sortDirection == 'desc' ? 'descending' : 'ascending') : 'none'}">
                <button type="button" class="review-sort" data-sort="comments" aria-label="評論排序"><span>評論</span><span class="sort-arrows" aria-hidden="true"><span data-direction="asc">▲</span><span data-direction="desc">▼</span></span></button>
            </th>
            <th scope="col" th:attr="aria-sort=${sortBy == 'rating' ? (sortDirection == 'desc' ? 'descending' : 'ascending') : 'none'}">
                <button type="button" class="review-sort" data-sort="rating" aria-label="評分排序"><span>評分</span><span class="sort-arrows" aria-hidden="true"><span data-direction="asc">▲</span><span data-direction="desc">▼</span></span></button>
            </th>
            <th>狀態</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr data-product-row th:with="thumbnailId=${overviewLightweight == true ? product.imageId : (product.getFirstProductImage() == null ? null : product.getFirstProductImage().imageId)}, displayVendorName=${overviewLightweight == true ? product.vendorName : (product.vendor == null ? null : product.vendor.vendorName)}" th:each="product, stat : ${productListData}"
        	th:classappend="${product.status == 0 ? ' product-off' : ''}">
            <td th:text="${(currentPage - 1) * pageSize + stat.index + 1}"></td>
            <td>
    			<th:block th:if="${thumbnailId != null}">
		        <span class="product-thumbnail"><span class="product-thumbnail-track">
		        <img
                th:attr="data-src=@{/product/image/{imageId}/thumbnail(imageId=${thumbnailId})},data-image-base=@{/product/image/},data-image-ids=${overviewImageIds != null and overviewImageIds[product.productId] != null ? #strings.listJoin(overviewImageIds[product.productId], ',') : ''}" loading="lazy" decoding="async" width="50px" height="50px"
            		th:alt="${product.productName}"
            		style="width: 50px; height: 50px; object-fit: cover;">
		        </span></span>
    			</th:block>
			    <th:block th:unless="${thumbnailId != null}">
        			<span>無圖片</span>
    			</th:block>
			</td>
            <td><span class="cell-name" th:text="${#strings.length(product.productName) > 10 ? #strings.substring(product.productName, 0, 10) + '…' : product.productName}" th:title="${product.productName}"></span></td>
            <td th:with="skuNames=${overviewSkuNames != null ? overviewSkuNames[product.productId] : null}">
                <div class="sku-switcher" th:if="${skuNames != null and !#lists.isEmpty(skuNames)}">
                    <div class="sku-name-viewport" aria-live="polite" aria-atomic="true"><div class="sku-name-track"><span class="sku-name" th:text="${#strings.length(skuNames[0]) > 8 ? #strings.substring(skuNames[0], 0, 8) + '…' : skuNames[0]}" th:title="${skuNames[0]}"></span></div></div>
                    <button type="button" class="sku-counter stock-alert" th:text="${'1/' + #lists.size(skuNames)}" th:disabled="${#lists.size(skuNames) <= 1}" th:attr="aria-label=${'切換下一個規格，目前第1個，共' + #lists.size(skuNames) + '個'}"></button>
                    <div class="sku-name-options" hidden><span th:each="skuName : ${skuNames}" th:text="${skuName}"></span></div>
                </div>
                <span th:unless="${skuNames != null and !#lists.isEmpty(skuNames)}">無規格</span>
            </td>
            <td><span class="cell-name" th:text="${displayVendorName != null ? displayVendorName : '—'}" th:title="${displayVendorName}"></span></td>
            <td>
                <div class="stock-alerts" th:if="${overviewStockStatuses != null and overviewStockStatuses[product.productId] != null}">
                    <span class="stock-alert" th:each="alert : ${overviewStockStatuses[product.productId]}"
                          th:classappend="${alert == '正常' ? 'stock-normal' : ((alert == '低於安全庫存' or alert == '庫存低於10') ? 'stock-danger' : 'stock-warning')}"
                          th:attr="title=${alert},aria-label=${alert}" tabindex="0" th:text="${stockAlertLabels.get(alert)}"></span>
                </div>
            </td>
            <td class="comment-count" th:text="${product.allCommentAmount}"> </td>
            <td class="score" th:classappend="${product.allCommentAmount == null or product.allCommentAmount == 0 ? 'score-unrated' : ''}" th:text="${product.allCommentAmount != null and product.allCommentAmount > 0 ? #numbers.formatDecimal((product.allCommentStar == null ? 0 : product.allCommentStar) * 1.0 / product.allCommentAmount, 1, 1) : '未評分'}"> </td>
			<td>
                <span th:if="${product.status == 2}" class="status-discontinued" title="解除永久停產請由 ADMIN 修改商品">永久停產</span>
                <label class="switch" th:if="${product.status != 2}">
       		 	<input
            		type="checkbox"
            		class="status-toggle"
            		th:checked="${product.status == 1}"
            		th:attr="data-product-id=${product.productId}"
            		onchange="changeProductStatus(this)">

        			<span class="slider">
            			<span class="switch-text on">上架</span>
            			<span class="switch-text off">下架</span>
       				</span>
    			</label>
			</td>
            <td>
                <div class="product-actions">
                <button type="button" data-product-detail title="查看" aria-label="查看" th:attr="data-detail-url=@{/product/getOne_For_Display(productId=${product.productId},modal=true)},data-detail-name=${product.productName}"><i class="fas fa-eye" aria-hidden="true"></i></button>

                <button type="button" data-product-edit title="修改" aria-label="修改"
                        th:attr="data-detail-url=@{/product/getOne_For_Display(productId=${product.productId},modal=true)},data-detail-name=${product.productName}"><i class="fas fa-cog" aria-hidden="true"></i></button>

<form th:action="@{/product/delete}" method="post" data-product-delete>
<input type="hidden" name="productId" th:value="${product.productId}">
<button class="delete" type="submit" title="刪除" aria-label="刪除"><i class="fas fa-trash-alt" aria-hidden="true"></i></button>
</form>
                </div>
            </td>
        </tr>
        <tr id="empty-products" hidden>
            <td class="empty" colspan="10">目前沒有商品資料</td>
        </tr>
        </tbody>
    </table>
    <div class="page-footer">
        <span id="page-summary" role="status" aria-live="polite"></span>
        <nav class="pagination" id="product-pagination" aria-label="商品總覽分頁"></nav>
    </div>
</div>
<script th:inline="javascript">

let productStatusBusy = false;

function lockProductStatus(busy) {
    productStatusBusy = busy;
    const toggles = document.querySelectorAll('#product-table tbody [data-product-row] .status-toggle');
    toggles.forEach(toggle => { toggle.disabled = busy; });
    ['page-status-on', 'page-status-off'].forEach(id => {
        document.getElementById(id).disabled = busy || toggles.length === 0;
    });
}

function showProductStatusMessage(text, error = false, offline = false) {
    const message = document.getElementById('page-status-message');
    message.textContent = text;
    message.classList.toggle('status-error', error);
    message.classList.toggle('status-off', offline);
    message.hidden = false;
}

async function changeProductStatus(toggleElement) {
    if (productStatusBusy) { toggleElement.checked = !toggleElement.checked; return; }
    const status = toggleElement.checked ? 1 : 0;
    lockProductStatus(true);
    try {
        const response = await window.requestProductStatus(/*[[@{/product/updateStatus}]]*/ "/product/updateStatus",
            new URLSearchParams({productId: toggleElement.dataset.productId, status}));
        const result = await response.text();
        if (!response.ok || result !== 'success') throw new Error(result || '更新失敗');
        toggleElement.closest('tr').classList.toggle('product-off', status === 0);
        document.getElementById('page-status-message').hidden = true;
    } catch (error) {
        toggleElement.checked = !toggleElement.checked;
        showProductStatusMessage(error.message || '商品狀態更新失敗，已還原開關。', true);
    } finally { lockProductStatus(false); }
}

async function changePageProductStatus(status) {
    if (productStatusBusy) return;
    const toggles = Array.from(document.querySelectorAll('#product-table tbody [data-product-row] .status-toggle'));
    if (!toggles.length) return;
    const actionName = status === 1 ? '上架' : '下架';
    if (!await window.confirmProductAction(status === 1 ? 'page-on' : 'page-off',
        '本功能將讓本頁面商品全數' + actionName + '，您確定要執行此動作？')) return;
    if (productStatusBusy) return;
    const body = new URLSearchParams({status});
    toggles.forEach(toggle => body.append('productIds', toggle.dataset.productId));
    lockProductStatus(true);
    showProductStatusMessage('正在更新本頁商品狀態…');
    try {
        const response = await window.requestProductStatus(/*[[@{/product/updatePageStatus}]]*/ "/product/updatePageStatus", body);
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || '更新失敗');
        toggles.forEach(toggle => {
            toggle.checked = status === 1;
            toggle.closest('tr').classList.toggle('product-off', status === 0);
        });
        showProductStatusMessage('本頁 ' + result.updated + ' 個商品已全部' + (status === 1 ? '上架' : '下架') + '。', false, status === 0);
    } catch (error) {
        showProductStatusMessage('本頁商品更新失敗：' + error.message, true);
    } finally { lockProductStatus(false); }
}

</script>
<script th:src="@{/admin/js/product-action-confirm.js}" defer></script>
<script th:src="@{/admin/js/product-pagination.js}" defer></script>
<script th:src="@{/admin/js/product-detail-modal.js}" defer></script>
<script th:src="@{/admin/js/product-sku-switcher.js}" defer></script>
<script th:src="@{/admin/js/product-status.js}"></script>
</body>
</html>
