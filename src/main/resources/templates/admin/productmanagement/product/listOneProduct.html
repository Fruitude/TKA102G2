<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.productName}">商品</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            margin: 30px;
            background: #f5f7f4;
            color: #333;
        }

        .container {
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 10px;
        }

        h1 {
            text-align: left; padding-left: 1em;
            margin-top: 0;
            margin-bottom: 24px;
        }

        /* 左圖右資料 */
        .detail-layout {
            display: grid;
            grid-template-columns: 420px minmax(0, 1fr);
            gap: 32px;
            align-items: start;
        }

        /* 左側圖片區 */
        .gallery {
    		width: 420px;
    		max-width: 100%;
    		min-width: 0;
        }

        .main-image-box {
            width: 420px;
            max-width: 100%;
            height: 390px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .no-image {
            color: #888;
            font-size: 16px;
        }

        /* 小圖與左右箭頭 */
        .thumbnail-area {
        	width: 420px;
    		max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 14px auto 0;
        }

        .thumb-viewport {
            width: 320px;
            max-width: calc(100% - 84px);
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .thumb-viewport::-webkit-scrollbar {
            display: none;
        }

        .thumb-track {
            display: flex;
            gap: 10px;
            width: max-content;
        }

        .thumbnail {
            flex: 0 0 100px;
            width: 100px;
            height: 85px;
            padding: 0;
            border: 2px solid transparent;
            border-radius: 6px;
            background: white;
            overflow: hidden;
            cursor: pointer;
        }

        .thumbnail img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail.active {
            border-color: #287a4b;
        }

        .arrow {
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #287a4b;
            color: white;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }

        .arrow:disabled { background: #d1d5db; color: #777; cursor: default; }
        .arrow:hover:not(:disabled) {
            background: #1e603a;
        }

        /* 右側商品資料 */
        .product-info {
            min-width: 0;
        }

        .item {
            display: flex;
            align-items: flex-start;
            padding: 13px 0;
            border-bottom: 1px solid #eee;
        }

        .name {
            display: inline-block;
            width: 120px;
            flex-shrink: 0;
            font-weight: bold;
        }

        .value {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        /* 規格選項 */
        .sku-section {
            margin-top: 22px;
        }

        .sku-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .sku-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .sku-option {
            padding: 9px 14px;
            border: 1px solid #aaa;
            border-radius: 5px;
            background: white;
            color: #333;
            cursor: pointer;
            font-size: 14px;
        }

        .sku-option:hover {
            border-color: #287a4b;
            color: #287a4b;
        }

        .sku-option.active {
            border: 2px solid #287a4b;
            background: #edf6ef;
            color: #287a4b;
            font-weight: bold;
        }

        /* 規格詳細資料 */
        .sku-panel {
            display: none;
            margin-top: 16px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 14px 16px;
            background: #fcfcfc;
        }

        .sku-panel.active {
            display: block;
        }

        .sku-panel .item:first-child {
            padding-top: 0;
        }

        .sku-panel .item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-0 {
            background: #eee;
            color: #666;
        }

        .status-1 {
            background: #e5f4e9;
            color: #287a4b;
        }

        .status-2 {
            background: #fff0d9;
            color: #a45b00;
        }

        .status-3 {
            background: #fff0f0;
            color: #b33a3a;
        }

        .no-sku {
            color: #888;
            padding: 12px 0;
        }

        /* 底部按鈕 */
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        .action-buttons form {
            margin: 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #287a4b;
            color: white;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1e603a;
        }

        .btn-edit {
            background: #557aaf;
        }

        .btn-edit:hover {
            background: #3f6396;
        }

        @media (max-width: 760px) {
            body {
                margin: 12px;
            }

            .container {
                padding: 18px;
            }

            .detail-layout {
                grid-template-columns: 1fr;
                gap: 26px;
            }
            
            .gallery {
        		width: 100%;
    		}

            .main-image-box {
            	width: 100%;
                height: 320px;
            }
            
            .thumbnail-area {
        		width: 100%;
    		}

            .product-info {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .main-image-box {
                height: 260px;
            }

            .name {
                width: 100px;
            }

            .thumb-viewport {
                width: 230px;
            }

            .thumbnail {
                flex-basis: 70px;
                width: 70px;
                height: 65px;
            }
        }
    </style>
<style th:if="${param.modal != null}">
        body { margin: 0; background: white; }
        .container { padding: 20px; }
        .container > h1 { display: none; }
        body { font-size: 13px; line-height: 1.4; }
        .container { padding: 12px 16px; }
        .detail-layout { grid-template-columns: 280px minmax(0, 1fr); gap: 20px; }
        .gallery, .main-image-box, .thumbnail-area { width: 280px; }
        .main-image-box { height: 250px; }
        .thumbnail-area { gap: 6px; margin-top: 10px; }
        .thumb-viewport { width: 204px; max-width: calc(100% - 64px); }
        .thumb-track { gap: 6px; }
        .thumbnail { flex-basis: 64px; width: 64px; height: 56px; }
        .arrow { flex-basis: 26px; width: 26px; height: 26px; font-size: 18px; }
        .item { padding: 6px 0; }
        .name { width: 82px; }
        .sku-section { margin-top: 10px; }
        .sku-title { margin-bottom: 6px; }
        .sku-options { gap: 6px; }
        .sku-option { padding: 5px 8px; font-size: 12px; }
        .sku-panel { margin-top: 8px; padding: 8px 10px; }
        .sku-panel.active { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px; }
        .sku-panel .item { padding: 5px 0; }
        .sku-panel .name { width: 72px; }
        .sku-panel .value { white-space: normal; }
        .status { padding: 2px 6px; font-size: 12px; }
        @media (max-width: 650px) {
            .detail-layout { grid-template-columns: 1fr; gap: 12px; }
            .gallery { margin: auto; }
        }
        @media (max-width: 380px) { .sku-panel.active { grid-template-columns: 1fr; } }
    </style>
<style>
        .product-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; }
        .product-meta .item { min-width: 0; }
        .product-meta .name { width: 82px; }
        .meta-wide { grid-column: 1 / -1; }
        .description-item .value { min-height: 1.4em; max-height: 4.2em; line-height: 1.4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
        .status-item { align-items: center; }
        .status-value { display: flex; align-items: center; gap: 8px; white-space: normal; }
        .status-error { color: #b42318; font-size: 12px; }
        .switch input:disabled + .slider { opacity: .6; cursor: wait; }
        .switch input:focus-visible + .slider { outline: 2px solid #1d4ed8; outline-offset: 2px; }
        .rating-value { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; white-space: normal; }
        .rating-stars { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
        .rating-star { position: relative; width: 16px; height: 16px; display: block; }
        .rating-star svg { width: 16px; height: 16px; display: block; fill: #d1d5db; }
        .rating-star-fill { position: absolute; left: 0; top: 0; height: 100%; overflow: hidden; }
        .rating-star-fill svg { fill: #f5c542; }
        .switch { position: relative; display: inline-block; width: 50px; height: 22px; vertical-align: middle; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #e74a3b; border-radius: 20px; cursor: pointer; }
        .slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: white; box-shadow: 0 1px 3px #0004; }
        .switch-text { position: absolute; top: 50%; width: 50%; transform: translateY(-50%); text-align: center; font-size: 10px; font-weight: bold; color: white; }
        .switch-text.on { left: 0; display: none; }
        .switch-text.off { right: 0; }
        .switch input:checked + .slider { background: #287A47; }
        .switch input:checked + .slider::before { transform: translateX(28px); }
        .switch input:checked + .slider .on { display: inline; }
        .switch input:checked + .slider .off { display: none; }
        .sku-section { display: grid; grid-template-columns: 82px minmax(0, 1fr); column-gap: 0; align-items: start; }
        .sku-title { margin-bottom: 0; padding-top: 6px; }
        .sku-panel, .no-sku { grid-column: 1 / -1; }
        @media(max-width: 480px) { .product-meta { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">

    <h1 th:text="${product.productName}">商品</h1>

    <div class="detail-layout">

        <!-- 左側：商品圖片 -->
        <section class="gallery">

            <!-- 有圖片時顯示第一張大圖 -->
            <div class="main-image-box"
                 th:if="${productImageList != null and !#lists.isEmpty(productImageList)}">

                <img id="mainImage"
                     class="main-image"
                     th:src="@{/product/image/{imageId}(imageId=${productImageList[0].imageId})}"
                     th:alt="${product.productName}">
            </div>

            <!-- 沒有圖片時 -->
            <div class="main-image-box"
                 th:if="${productImageList == null or #lists.isEmpty(productImageList)}">
                <span class="no-image">目前沒有商品圖片</span>
            </div>

            <!-- 小圖列 -->
            <div class="thumbnail-area"
                 th:if="${productImageList != null and !#lists.isEmpty(productImageList)}">

                <button type="button"
                        class="arrow"
                        id="previous-image" disabled onclick="scrollThumbnails(-1)"
                        aria-label="上一張圖片">
                    &#8249;
                </button>

                <div class="thumb-viewport">
                    <div class="thumb-track" id="thumbTrack">

                        <button type="button"
                                class="thumbnail"
                                th:each="image, stat : ${productImageList}"
                                th:classappend="${stat.index == 0 ? ' active' : ''}"
                                th:attr="data-image-url=@{/product/image/{imageId}(imageId=${image.imageId})},data-sku-id=${image.productSku.skuId}"
                                onclick="changeMainImage(this)">

                            <img th:src="@{/product/image/{imageId}(imageId=${image.imageId})}"
                                 th:alt="${product.productName + '圖片' + (stat.index + 1)}">
                        </button>

                    </div>
                </div>

                <button type="button"
                        class="arrow"
                        id="next-image" th:disabled="${#lists.size(productImageList) <= 1}" onclick="scrollThumbnails(1)"
                        aria-label="下一張圖片">
                    &#8250;
                </button>
            </div>
        </section>

        <!-- 右側：商品基本資料與規格 -->
        <section class="product-info">

            <div class="product-meta">
                <div class="item"><span class="name">商品分類</span><span class="value" th:text="${product.productCategory != null ? product.productCategory.categoryName : '—'}"></span></div>
                <div class="item"><span class="name">供應廠商</span><span class="value" th:text="${product.vendor != null ? product.vendor.vendorName : '—'}"></span></div>
                <div class="item"><span class="name">建立時間</span><span class="value" th:text="${product.createdAt != null ? #temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm:ss') : '—'}"></span></div>
                <div class="item"><span class="name">修改時間</span><span class="value" th:text="${product.updatedAt != null ? #temporals.format(product.updatedAt, 'yyyy-MM-dd HH:mm:ss') : '—'}"></span></div>
                <div class="item" th:with="rating=${product.allCommentAmount != null and product.allCommentAmount > 0 and product.allCommentStar != null ? product.allCommentStar * 1.0 / product.allCommentAmount : 0.0}">
                    <span class="name">平均評分</span><span class="value rating-value">
                        <span class="rating-stars" role="img" th:attr="aria-label=${#numbers.formatDecimal(rating, 1, 1) + '顆星，共5顆星'}">
                            <span class="rating-star" th:each="star : ${#numbers.sequence(1,5)}">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01Z"/></svg>
                                <span class="rating-star-fill" th:style="${'width:' + (rating >= star ? 100 : (rating > star - 1 ? (rating - star + 1) * 100 : 0)) + '%'}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01Z"/></svg></span>
                            </span>
                        </span><span th:text="${product.allCommentAmount != null and product.allCommentAmount > 0 ? #numbers.formatDecimal(rating, 1, 1) : '尚未評分'}"></span>
                    </span>
                </div>
                <div class="item"><span class="name">評論總數</span><span class="value" th:text="${product.allCommentAmount != null ? product.allCommentAmount : 0}"></span></div>
                <div class="item meta-wide status-item"><span class="name">商品狀態</span><span class="value status-value">
                    <label class="switch" th:attr="aria-label=${product.status == 1 ? '上架' : '下架'}"><input id="detail-product-status" type="checkbox" th:checked="${product.status == 1}" th:attr="data-product-id=${product.productId},data-update-url=@{/product/updateStatus}" onchange="changeDetailProductStatus(this)"><span class="slider"><span class="switch-text on">上架</span><span class="switch-text off">下架</span></span></label><span id="detail-status-error" class="status-error" role="status" hidden></span>
                </span></div>
                <div class="item meta-wide description-item"><span class="name">商品描述</span><span class="value" th:text="${product.productDesc}"></span></div>
            </div>

            <!-- 規格按鈕 -->
            <div class="sku-section">
                <div class="sku-title">規格選項</div>

                <div class="sku-options"
                     th:if="${productSkuList != null and !#lists.isEmpty(productSkuList)}">

                    <button type="button"
                            class="sku-option"
                            th:each="sku, stat : ${productSkuList}"
                            th:classappend="${stat.index == 0 ? ' active' : ''}"
                            th:attr="data-panel-id=|sku-panel-${sku.skuId}|,data-sku-id=${sku.skuId}"
                            onclick="showSkuInfo(this)"
                            th:text="${sku.displayName}">
                    </button>
                </div>

                <div class="no-sku"
                     th:if="${productSkuList == null or #lists.isEmpty(productSkuList)}">
                    目前沒有規格資料
                </div>

                <!-- 各規格資訊區塊 -->
                <div th:each="sku, stat : ${productSkuList}"
                     th:id="|sku-panel-${sku.skuId}|"
                     class="sku-panel"
                     th:classappend="${stat.index == 0 ? ' active' : ''}">

                    <div class="item">
                        <span class="name">規格價格</span>
                        <span class="value"
                              th:text="${sku.price != null ? 'NT$ ' + sku.price : '—'}">
                        </span>
                    </div>

                    <div class="item">
    					<span class="name">規格狀態</span>
    					<span class="value" th:switch="${sku.status}">
        					<span th:case="0" class="status status-0">下架</span>
        					<span th:case="1" class="status status-1">上架</span>
        					<span th:case="2" class="status status-2">缺貨</span>
        					<span th:case="3" class="status status-3">即將下架</span>
        					<span th:case="*" class="status">未設定</span>
    					</span>
					</div>

                    <div class="item">
                        <span class="name">庫存量</span>
                        <span class="value" th:text="${sku.stock != null ? sku.stock : 0}"></span>
                    </div>

                    <div class="item">
                        <span class="name">安全庫存量</span>
                        <span class="value"
                              th:text="${sku.safetyStock != null ? sku.safetyStock : 0}">
                        </span>
                    </div>

                    <div class="item">
                        <span class="name">待進貨</span>
                        <span class="value"
                              th:text="${sku.inboundQty != null ? sku.inboundQty : 0}">
                        </span>
                    </div>

                    <div class="item">
                        <span class="name">待出貨</span>
                        <span class="value"
                              th:text="${sku.outboundQty != null ? sku.outboundQty : 0}">
                        </span>
                    </div>
                </div>
            </div>

            <!-- 修改與返回按鈕 -->
            <div class="action-buttons" th:if="${param.modal == null}"><a class="btn" th:href="@{/productsku/listAllProductSku}">管理規格</a>

                <form th:action="@{/product/getOne_For_Update}" method="post">
                    <input type="hidden"
                           name="productId"
                           th:value="${product.productId}">
                    <button type="submit" class="btn btn-edit">修改</button>
                </form>

                <a class="btn" th:href="@{/product/listAllProduct}">
                    返回商品列表
                </a>
            </div>

        </section>
    </div>
</div>

<script>
    async function changeDetailProductStatus(toggle) {
        const status = toggle.checked ? 1 : 0;
        const error = document.getElementById('detail-status-error');
        error.hidden = true; toggle.disabled = true;
        try {
            const response = await fetch(toggle.dataset.updateUrl, {
                method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({productId: toggle.dataset.productId, status})
            });
            const result = await response.text();
            if (!response.ok || result !== 'success') throw new Error(result || '更新失敗');
            toggle.closest('label').setAttribute('aria-label', status === 1 ? '上架' : '下架');
            document.dispatchEvent(new CustomEvent('product-status-updated', {
                detail: {productId: Number(toggle.dataset.productId), status}
            }));
        } catch (failure) {
            toggle.checked = !toggle.checked;
            error.textContent = '更新失敗，請重試。'; error.hidden = false;
        } finally { toggle.disabled = false; }
    }
    const thumbnails = Array.from(document.querySelectorAll('.thumbnail'));
    let selectedImageIndex = thumbnails.findIndex(button => button.classList.contains('active'));

    function updateImageArrows() {
        const previous = document.getElementById('previous-image');
        const next = document.getElementById('next-image');
        if (previous) previous.disabled = selectedImageIndex <= 0;
        if (next) next.disabled = selectedImageIndex < 0 || selectedImageIndex >= thumbnails.length - 1;
    }

    function changeMainImage(button) {
        const mainImage = document.getElementById('mainImage');
        if (!mainImage || !button?.dataset.imageUrl) return;
        selectedImageIndex = thumbnails.indexOf(button);
        mainImage.src = button.dataset.imageUrl;
        mainImage.hidden = false;
        const noImage = document.querySelector('.main-image-box .no-image');
        if (noImage) noImage.hidden = true;
        thumbnails.forEach(thumb => thumb.classList.toggle('active', thumb === button));
        updateImageArrows();
        const viewport = document.querySelector('.thumb-viewport');
        if (viewport) {
            const left = button.getBoundingClientRect().left - viewport.getBoundingClientRect().left + viewport.scrollLeft;
            viewport.scrollTo({left: Math.max(0, left - (viewport.clientWidth - button.offsetWidth) / 2), behavior: 'smooth'});
        }
    }

    function scrollThumbnails(direction) {
        const nextIndex = selectedImageIndex + direction;
        if (selectedImageIndex < 0 || nextIndex < 0 || nextIndex >= thumbnails.length) return;
        changeMainImage(thumbnails[nextIndex]);
    }

    // 點選規格按鈕，顯示該規格的詳細資訊
    function showSkuInfo(button) {
        const panelId = button.dataset.panelId;

        if (!panelId) {
            return;
        }

        document.querySelectorAll(".sku-option").forEach(function (option) {
            option.classList.remove("active");
        });

        document.querySelectorAll(".sku-panel").forEach(function (panel) {
            panel.classList.remove("active");
        });

        button.classList.add("active");

        const firstImage = thumbnails.find(image => image.dataset.skuId === button.dataset.skuId);
        if (firstImage) {
            changeMainImage(firstImage);
        } else {
            selectedImageIndex = -1;
            thumbnails.forEach(image => image.classList.remove('active'));
            const mainImage = document.getElementById('mainImage');
            if (mainImage) mainImage.hidden = true;
            const box = document.querySelector('.main-image-box');
            if (box) {
                let message = box.querySelector('.no-image');
                if (!message) { message = document.createElement('span'); message.className = 'no-image'; box.appendChild(message); }
                message.textContent = '此規格沒有圖片'; message.hidden = false;
            }
            updateImageArrows();
        }
        const selectedPanel = document.getElementById(panelId);
        if (selectedPanel) {
            selectedPanel.classList.add("active");
        }
    }
    const initialSku = document.querySelector('.sku-option.active');
    if (initialSku) showSkuInfo(initialSku);
    else updateImageArrows();
</script>
</body>
</html>
