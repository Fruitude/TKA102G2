<!DOCTYPE html><html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>水果商城管理</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f7f4;color:#26332b;margin:24px}main{max-width:1100px;margin:auto;background:white;padding:24px;border-radius:10px}nav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px}a{color:#287a4b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}label{display:block;margin:12px 0}input,select,textarea{padding:8px;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:90px}button{padding:8px 14px;background:#287a4b;color:white;border:0;border-radius:4px;cursor:pointer}form.inline{display:inline}.error{color:#b42318}.success{color:#287a4b}.sku-card{border:1px solid #ccc;padding:16px;margin:16px 0}.preview{max-width:240px;max-height:160px}fieldset{margin:16px 0} @media(max-width:700px){main{padding:12px}table{display:block;overflow-x:auto}}</style></head><body><main><nav><a th:href="@{/}">首頁</a><a th:href="@{/product/listAllProduct}">商品</a><a th:href="@{/productsku/listAllProductSku}">規格</a><a th:href="@{/productcategory/list}">分類</a><a th:href="@{/product/image/list}">圖片</a></nav><p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p><p class="error" th:if="${errorMsg}" th:text="${errorMsg}"></p><p class="success" th:if="${successMessage}" th:text="${successMessage}"></p><p class="success" th:if="${success}" th:text="${success}"></p><h1 th:text="${productSku.displayName}"></h1><p>商品：<span th:text="${productSku.product.productName}"></span></p><p>別稱：<span th:text="${productSku.anotherName}"></span></p><p>價格：<span th:text="${productSku.price}"></span></p><p>庫存：<span th:text="${productSku.stock}"></span>，安全庫存：<span th:text="${productSku.safetyStock}"></span></p><p>待進貨：<span th:text="${productSku.inboundQty}"></span>，待出貨：<span th:text="${productSku.outboundQty}"></span></p><p>預計庫存：<span th:text="${productSku.expectedStock}"></span></p><p>狀態：<span th:text="${productSku.status == 0 ? '下架' : (productSku.status == 1 ? '上架' : (productSku.status == 2 ? '缺貨' : '即將下架'))}"></span></p><a th:href="@{/productsku/getOne_For_Update(skuId=${productSku.skuId})}">修改規格</a> <a th:href="@{/product/image/list(skuId=${productSku.skuId})}">管理圖片</a><div th:each="i:${productSku.productImages}"><img class="preview" th:src="@{/product/image/{id}(id=${i.imageId})}" th:alt="${i.imageName}"></div></main></body></html>
