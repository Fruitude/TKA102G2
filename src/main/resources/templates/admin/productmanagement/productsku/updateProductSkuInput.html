<!DOCTYPE html><html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>水果商城管理</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f7f4;color:#26332b;margin:24px}main{max-width:1100px;margin:auto;background:white;padding:24px;border-radius:10px}nav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px}a{color:#287a4b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}label{display:block;margin:12px 0}input,select,textarea{padding:8px;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:90px}button{padding:8px 14px;background:#287a4b;color:white;border:0;border-radius:4px;cursor:pointer}form.inline{display:inline}.error{color:#b42318}.success{color:#287a4b}.sku-card{border:1px solid #ccc;padding:16px;margin:16px 0}.preview{max-width:240px;max-height:160px}fieldset{margin:16px 0} @media(max-width:700px){main{padding:12px}table{display:block;overflow-x:auto}}</style></head><body><main><nav><a th:href="@{/}">首頁</a><a th:href="@{/product/listAllProduct}">商品</a><a th:href="@{/productsku/listAllProductSku}">規格</a><a th:href="@{/productcategory/list}">分類</a><a th:href="@{/product/image/list}">圖片</a></nav><p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p><p class="error" th:if="${errorMsg}" th:text="${errorMsg}"></p><p class="success" th:if="${successMessage}" th:text="${successMessage}"></p><p class="success" th:if="${success}" th:text="${success}"></p><h1>修改規格</h1><form th:action="@{/productsku/update}" th:object="${productSku}" method="post"><ul class="error" th:if="${#fields.hasAnyErrors()}"><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul><input type="hidden" th:field="*{skuId}"><label th:if="${productSku.skuId == null}">所屬商品 <select name="product.productId" required><option value="">請選擇</option><option th:each="p:${productListData}" th:value="${p.productId}" th:text="${p.productName}" th:selected="${productSku.product != null and productSku.product.productId == p.productId}"></option></select></label><p th:if="${productSku.skuId != null}" th:text="${productSku.product.productName}"></p><label>規格名稱 <input th:field="*{skuName}" maxlength="50" required></label><label>別稱 <input th:field="*{anotherName}" maxlength="50"></label><label>價格 <input type="number" th:field="*{price}" min="1" required></label><label>庫存 <input type="number" th:field="*{stock}" min="0" required></label><label>安全庫存 <input type="number" th:field="*{safetyStock}" min="0" required></label><label>待進貨 <input type="number" th:field="*{inboundQty}" min="0" required></label><label>待出貨 <input type="number" th:field="*{outboundQty}" min="0" required></label><label>狀態 <select th:field="*{status}"><option th:disabled="${productSku.status == 4 and canRestoreDiscontinued != true}" value="0">下架</option><option th:disabled="${productSku.status == 4 and canRestoreDiscontinued != true}" value="1">上架</option><option th:disabled="${productSku.status == 4 and canRestoreDiscontinued != true}" value="2">缺貨</option><option th:disabled="${productSku.status == 4 and canRestoreDiscontinued != true}" value="3">即將下架</option><option value="4">永久停產</option><option th:disabled="${productSku.status != 5}" value="5">預備上架</option></select></label><button>儲存</button> <a th:href="@{/productsku/listAllProductSku}">返回</a></form></main></body></html>
