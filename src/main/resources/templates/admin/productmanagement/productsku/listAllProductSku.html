<!DOCTYPE html><html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>水果商城管理</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f7f4;color:#26332b;margin:24px}main{max-width:1100px;margin:auto;background:white;padding:24px;border-radius:10px}nav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px}a{color:#287a4b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}label{display:block;margin:12px 0}input,select,textarea{padding:8px;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:90px}button{padding:8px 14px;background:#287a4b;color:white;border:0;border-radius:4px;cursor:pointer}form.inline{display:inline}.error{color:#b42318}.success{color:#287a4b}.sku-card{border:1px solid #ccc;padding:16px;margin:16px 0}.preview{max-width:240px;max-height:160px}fieldset{margin:16px 0} @media(max-width:700px){main{padding:12px}table{display:block;overflow-x:auto}}</style></head><body><main><nav><a th:href="@{/}">首頁</a><a th:href="@{/product/listAllProduct}">商品</a><a th:href="@{/productsku/listAllProductSku}">規格</a><a th:href="@{/productcategory/list}">分類</a><a th:href="@{/product/image/list}">圖片</a></nav><p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p><p class="error" th:if="${errorMsg}" th:text="${errorMsg}"></p><p class="success" th:if="${successMessage}" th:text="${successMessage}"></p><p class="success" th:if="${success}" th:text="${success}"></p><h1>商品規格</h1><a th:href="@{/productsku/addProductSku}">新增規格</a><table><thead><tr><th>商品</th><th>規格</th><th>價格</th><th>庫存／預計庫存</th><th>安全庫存</th><th>操作</th></tr></thead><tbody><tr th:each="s:${productSkuList}"><td th:text="${s.product.productName}"></td><td th:text="${s.displayName}"></td><td th:text="${s.price}"></td><td><span th:text="${s.stock}"></span>／<span th:text="${s.expectedStock}"></span></td><td><span th:text="${s.safetyStock}"></span> <strong class="error" th:if="${s.belowSafetyStock}">低於安全庫存</strong></td><td><a th:href="@{/productsku/detail(skuId=${s.skuId})}">詳細</a> <a th:href="@{/productsku/getOne_For_Update(skuId=${s.skuId})}">修改</a> <a th:href="@{/product/image/list(skuId=${s.skuId})}">圖片</a> <form class="inline" th:action="@{/productsku/delete}" method="post" onsubmit="return confirm('刪除此規格及其圖片？')"><input type="hidden" name="skuId" th:value="${s.skuId}"><button>刪除</button></form></td></tr><tr th:if="${#lists.isEmpty(productSkuList)}"><td colspan="6">沒有規格資料</td></tr></tbody></table></main></body></html>
