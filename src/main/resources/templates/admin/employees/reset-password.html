<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>設定員工密碼</title>
    <th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
</head>
<body class="admin-login-page">
    <main class="admin-login-panel" aria-labelledby="employee-reset-title">
        <header class="admin-login-heading">
            <h1 class="h4 text-gray-800 mb-1" id="employee-reset-title">
                <i class="fas fa-envelope-open-text mr-2" aria-hidden="true"></i>信箱確認與密碼設定
            </h1>
            <p class="small text-muted mb-0">驗證信件中的一次性連結後，設定員工帳號的新密碼</p>
        </header>
        <div class="admin-login-form">
            <p class="text-muted mb-0" id="employee-reset-validation" aria-live="polite">正在確認驗證連結…</p>

            <form id="employee-reset-form" hidden>
                <div class="form-group">
                    <label for="employee-reset-password">新密碼</label>
                    <input class="form-control" id="employee-reset-password" type="password"
                           minlength="8" maxlength="72" autocomplete="new-password" required>
                    <small class="form-text text-muted">8～72 個字元，建議同時包含英文與數字。</small>
                </div>
                <div class="form-group">
                    <label for="employee-reset-confirm-password">再次輸入新密碼</label>
                    <input class="form-control" id="employee-reset-confirm-password" type="password"
                           minlength="8" maxlength="72" autocomplete="new-password" required>
                </div>
                <p class="admin-login-feedback" id="employee-reset-feedback" aria-live="polite"></p>
                <button class="btn btn-primary btn-block" id="employee-reset-submit" type="submit">
                    <i class="fas fa-key mr-1" aria-hidden="true"></i>確認更新密碼
                </button>
            </form>

            <div id="employee-reset-success" hidden>
                <p class="text-success font-weight-bold">密碼已更新完成。</p>
                <a class="btn btn-primary btn-block" th:href="@{/admin/employees/login}">
                    <i class="fas fa-sign-in-alt mr-1" aria-hidden="true"></i>前往員工登入
                </a>
            </div>
        </div>
    </main>
    <th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>
    <script th:src="@{/js/employee-password-reset.js?v=1}"></script>
</body>
</html>
