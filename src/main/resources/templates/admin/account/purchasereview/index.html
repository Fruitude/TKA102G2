<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Purchase Review</title>

	<!-- 引入css資源 -->
	 <th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<!-- DataTables 樣式 -->
<link th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet">
<style>
#po_review_list_all th, #po_review_list_all td {
	white-space: nowrap; /* 不換行 */
	vertical-align: middle; /* 內容上下置中 */
}

#po_review_list_all {
	font-size: 0.9rem;
}
</style>
</head>
<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- 引入側邊欄 -->
        <ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- 引入Topbar -->
                <nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

                <!-- 這裡放頁面自己的內容 -->
                <div class="container-fluid">

					<!-- 查無採購單等提示：由 PoReviewController 的 updatePurchaseReview redirect 回來時顯示 -->
					<div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

					<!-- 待審核（poStatus = 0）的採購單：poListData 由 PoReviewController 的 purchasereview 放入 model -->
					<!-- 表格比照 psi/receiving/index.html；清單裡都是待審核的單，所以不列採購單狀態，驗收相關的欄位此時也還沒有資料 -->
					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">待審核採購單</h6>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-bordered" id="po_review_list_all" width="100%" cellspacing="0">
									<thead>
										<tr>
											<th>操作</th>
											<th>編號</th>
											<th>供應商</th>
											<th>採購員工</th>
											<th>採購日期</th>
											<th>總金額</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="poVO : ${poListData}">
											<td>
												<!-- 連到 PoReviewController 的 updatePurchaseReview，以 updatePurchaseReview.html 顯示審核頁 -->
												<a th:href="@{/admin/account/purchasereview/updatePurchaseReview(poId=${poVO.poId})}"
													class="btn btn-primary btn-sm">詳細</a>
											</td>
											<td th:text="${poVO.poNo}" style="text-align: center"></td>
											<td th:text="${poVO.vendor.vendorId + ' - ' + poVO.vendor.vendorName}"></td>
											<td th:text="${poVO.poEmployeeId.employeeId + ' - ' + poVO.poEmployeeId.employeeName}"></td>
											<td th:text="${{poVO.orderDate}}"></td>
											<td th:text="${poVO.totalAmount}"></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>

                </div>

            </div>

            <!-- 引入Footer -->
            <footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

        </div>
    </div>

    <!-- Scroll to Top Button-->
    <span class="scroll-to-top rounded">
        <i class="fas fa-angle-up"></i>
    </span>
		<!-- 	引入js資源     -->
    <th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

	<!-- DataTables 套件與初始化 -->
	<script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
	<script th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"></script>
	<script>
		$(document).ready(function() {
			var table = $('#po_review_list_all').DataTable({
				searching : true, // 顯示右上角的搜尋欄位
				lengthMenu : [ 5, 10, 25, 50, 100 ], // 每頁顯示筆數的選項
				pageLength : 5, // 預設每頁顯示筆數
				columnDefs : [ {
					orderable : false,
					searchable : false,
					targets : [ 0 ] // 操作欄不可排序、不列入搜尋
				} ],
				// 預設依採購單編號由小到大：編號是日期加流水號，最早送出的排最上面，先送的先審
				order : [ [ 1, 'asc' ] ],
				language : {
					lengthMenu : "每頁顯示 _MENU_ 筆", // 左上角的筆數選單
					search : "搜尋：", // 右上角的搜尋欄位
					info : "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆", // 左下角的資訊
					infoEmpty : "顯示第 0 至 0 筆，共 0 筆", // 沒有資料時的左下角資訊
					infoFiltered : "（從 _MAX_ 筆中篩選）", // 搜尋後附加在左下角資訊後面
					zeroRecords : "找不到符合的資料", // 搜尋不到資料時顯示
					emptyTable : "目前沒有資料", // 表格完全沒資料時顯示
					paginate : {
						previous : "上一頁",
						next : "下一頁"
					}
				}
			});

			var searchInput = $('#po_review_list_all_filter input');
			var searchButton = $('<button type="button" class="btn btn-primary btn-sm ml-2">搜尋</button>');

			searchInput.off('.DT'); // 移除 DataTables 內建的即時搜尋
			$('#po_review_list_all_filter').append(searchButton); // 把按鈕放在搜尋欄位後面

			searchButton.on('click', function() {
			    table.search(searchInput.val()).draw();
			});

			// 在搜尋欄位按 Enter 也可以搜尋
			searchInput.on('keydown', function(e) {
			    if (e.key === 'Enter') {
			        table.search(searchInput.val()).draw();
			    }
			});

			// 搜尋欄位被清空時，自動還原成全部資料
			searchInput.on('input', function() {
			    if (searchInput.val().trim() === '') {
			        table.search('').draw();
			    }
			});
		});
	</script>

</body>
</html>
