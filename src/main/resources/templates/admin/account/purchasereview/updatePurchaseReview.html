<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>採購單審核</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">

					<!-- 左邊是回首頁的按鈕，右上角是審核結果的提示：由 PoReviewController 的 approve、reject、cancel redirect 回來時顯示 -->
					<div class="d-flex justify-content-between align-items-start mb-3">
						<a th:href="@{/admin/account/purchasereview}" class="btn btn-secondary btn-icon-split">
							<span class="icon text-white-50"><i class="fas fa-arrow-left"></i></span>
							<span class="text">回採購單審核</span>
						</a>
						<div>
							<div class="alert alert-success mb-0" th:if="${success != null}" th:text="${success}"></div>
							<div class="alert alert-danger mb-0" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>
						</div>
					</div>

					<!-- 採購單資料：poVO 由 PoReviewController 的 updatePurchaseReview 放入 model，審核完回到這頁時已經不是待審核 -->
					<!-- 這頁只顯示不能編輯，審核的人只決定通過、不通過或取消 -->
					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">採購單資料</h6>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-bordered" width="100%" cellspacing="0">
									<tbody>
										<tr>
											<th class="bg-light" style="width: 150px;">編號</th>
											<td th:text="${poVO.poNo}"></td>
										</tr>
										<tr>
											<th class="bg-light">供應商</th>
											<td th:text="${poVO.vendor.vendorId + ' - ' + poVO.vendor.vendorName}"></td>
										</tr>
										<tr>
											<th class="bg-light">採購員工</th>
											<td th:text="${poVO.poEmployeeId.employeeId + ' - ' + poVO.poEmployeeId.employeeName}"></td>
										</tr>
										<tr>
											<th class="bg-light">採購日期</th>
											<td th:text="${{poVO.orderDate}}"></td>
										</tr>
										<tr>
											<th class="bg-light">採購單狀態</th>
											<td th:switch="${poVO.poStatus}">
												<span th:case="0">待審核</span>
												<span th:case="1">申請通過</span>
												<span th:case="2">申請未通過</span>
												<span th:case="3">已取消</span>
												<span th:case="4">已結案</span>
											</td>
										</tr>
										<tr>
											<th class="bg-light">總金額</th>
											<td th:text="${poVO.totalAmount}"></td>
										</tr>
									</tbody>
								</table>
							</div>

							<!-- 採購明細：和採購單資料放在同一個區塊；poVO.poDetails 由 PoVO 的 @OneToMany 帶出 -->
							<h6 class="font-weight-bold text-primary mt-4 mb-3">採購明細</h6>
							<div class="table-responsive">
								<table class="table table-bordered mb-0" width="100%" cellspacing="0">
									<thead>
										<tr>
											<th>明細編號</th>
											<th>商品規格編號</th>
											<th>商品規格</th>
											<th>採購數量</th>
											<th>進貨單價</th>
											<th>小計</th>
										</tr>
									</thead>
									<tbody>
										<tr th:if="${#lists.isEmpty(poVO.poDetails)}">
											<td colspan="6" class="text-center">此採購單尚無明細</td>
										</tr>
										<tr th:each="poDetailVO : ${poVO.poDetails}">
											<td th:text="${poDetailVO.poDetailId}"></td>
											<td th:text="${poDetailVO.skuId.skuId}"></td>
											<td th:text="${poDetailVO.skuId.displayName}"></td>
											<td th:text="${poDetailVO.quantity}"></td>
											<td th:text="${poDetailVO.unitPrice}"></td>
											<td th:text="${poDetailVO.subtotal}"></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>

					<!-- 審核：獨立的區塊，待審核（poStatus = 0）的採購單才顯示，審核完就不再顯示 -->
					<!-- 三個按鈕共用一個表單送出 poId，各自以 formaction 送到 PoReviewController 的 approve、reject、cancel -->
					<div class="card shadow mb-4" th:if="${poVO.editable}">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">審核結果</h6>
						</div>
						<div class="card-body">
							<form method="post" th:action="@{/admin/account/purchasereview/approve}">
								<input type="hidden" name="poId" th:value="${poVO.poId}">
								<!-- 這次看到的內容摘要（PoReviewController 的 updatePurchaseReview 放入 model），只有通過會比對；期間採購單被修改過就不通過 -->
								<input type="hidden" name="reviewedContent" th:value="${reviewedContent}">
								<button type="submit" class="btn btn-success mr-2"
									onclick="return confirm('確定要通過這張採購單嗎？');">通過</button>
								<button type="submit" class="btn btn-danger mr-2"
									th:formaction="@{/admin/account/purchasereview/reject}"
									onclick="return confirm('確定要將這張採購單審核為不通過嗎？');">不通過</button>
								<button type="submit" class="btn btn-secondary"
									th:formaction="@{/admin/account/purchasereview/cancel}"
									onclick="return confirm('確定要取消這張採購單嗎？');">取消採購</button>
							</form>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

</body>
</html>
