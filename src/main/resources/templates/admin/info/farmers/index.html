<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>小農資訊管理</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<!-- DataTables 樣式 -->
<link th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet">
<style>
#farmer_list th, #farmer_list td {
	white-space: nowrap;
	vertical-align: middle;
}

#farmer_list {
	font-size: 0.9rem;
}

.slogan-text {
	white-space: normal;
	min-width: 160px;
}
</style>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">
					<h1 class="h3 mb-4 text-gray-800">小農資訊管理</h1>

					<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

					<a th:href="@{/admin/info/farmers/add}" class="btn btn-primary btn-icon-split mb-3">
						<span class="icon text-white-50"><i class="fas fa-plus"></i></span>
						<span class="text">新增小農資訊</span>
					</a>

					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary">小農列表</h6>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-bordered" id="farmer_list" width="100%" cellspacing="0">
									<thead>
										<tr>
											<th>操作</th>
											<th style="text-align: center">供應商編號</th>
											<th>小農姓名（聯絡人）</th>
											<th>品牌名稱</th>
											<th>產地</th>
											<th>圖片</th>
											<th>品名</th>
											<th>標語</th>
											<th>前台顯示</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="farmer : ${farmerListData}">
											<td>
												<a th:href="@{/admin/info/farmers/edit(vendorId=${farmer.vendorId})}" class="btn btn-danger btn-sm">修改</a>
											</td>
											<td th:text="${farmer.vendorId}" style="text-align: center"></td>
											<td th:text="${farmer.vendor.contactPerson}"></td>
											<td th:text="${farmer.vendor.vendorName}"></td>
											<td th:text="${farmer.vendor.origin}"></td>
											<td><img th:if="${farmer.farmerImagePath != null}" th:src="@{${farmer.farmerImagePath}}" width="80px"></td>
											<td th:text="${farmer.growProduct}"></td>
											<td><div class="slogan-text" th:text="${farmer.farmerSlogan}"></div></td>
											<td>
												<span th:if="${farmer.showInFarmers}" class="alert alert-success d-inline-block py-1 px-3 mb-0">顯示</span>
												<span th:unless="${farmer.showInFarmers}" class="alert alert-secondary d-inline-block py-1 px-3 mb-0">隱藏</span>
												<span th:if="${farmer.showInFarmers and farmer.vendor.isActive != 1}" class="text-danger small d-block mt-1">供應商未啟用，前台不顯示</span>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

	<!-- DataTables 套件與初始化 -->
	<script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
	<script th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"></script>
	<script>
		$(document).ready(function() {
			$('#farmer_list').DataTable({
				searching : true,
				lengthMenu : [ 5, 10, 25, 50, 100 ],
				pageLength : 10,
				columnDefs : [ {
					orderable : false,
					searchable : false,
					targets : [ 0, 5 ] // 操作、圖片
				} ],
				order : [ [ 1, 'asc' ] ],
				language : {
					lengthMenu : "每頁顯示 _MENU_ 筆",
					search : "搜尋：",
					info : "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆",
					infoEmpty : "顯示第 0 至 0 筆，共 0 筆",
					infoFiltered : "（從 _MAX_ 筆中篩選）",
					zeroRecords : "找不到符合的資料",
					emptyTable : "目前沒有小農資料",
					paginate : {
						previous : "上一頁",
						next : "下一頁"
					}
				}
			});
		});
	</script>

</body>
</html>
