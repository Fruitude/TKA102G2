<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${editing} ? '修改小農資訊' : '新增小農資訊'">新增小農資訊</title>

<!-- 引入css資源 -->
<th:block th:replace="~{admin/index :: adminIndex-css}"></th:block>
<style>
#farmer_form label {
	font-weight: bold;
}

#farmer_form .required::after {
	content: " *";
	color: #e74a3b;
}

#farmer_form input[type="file"]::file-selector-button {
	margin-right: 10px;
	padding: 0.375rem 0.75rem;
	font-size: 1rem;
	line-height: 1.5;
	color: #fff;
	background-color: #858796;
	border: 1px solid #858796;
	border-radius: 0.35rem;
	cursor: pointer;
}

#farmer_blob_holder img {
	margin-top: 10px;
	border: 1px solid #d1d3e2;
}
</style>
</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- 引入側邊欄 -->
		<ul th:replace="~{admin/index :: adminIndex-sidebar}"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- 引入Topbar -->
				<nav th:replace="~{admin/index :: adminIndex-topbar}"></nav>

				<!-- 這裡放頁面自己的內容 -->
				<div class="container-fluid">
					<h1 class="h3 mb-4 text-gray-800">小農資訊管理</h1>

					<a th:href="@{/admin/info/farmers}" class="btn btn-secondary btn-icon-split mb-3">
						<span class="icon text-white-50"><i class="fas fa-arrow-left"></i></span>
						<span class="text">回小農資訊管理</span>
					</a>

					<div class="card shadow mb-4">
						<div class="card-header py-3">
							<h6 class="m-0 font-weight-bold text-primary" th:text="${editing} ? '修改小農資訊' : '新增小農資訊'">新增小農資訊</h6>
						</div>
						<div class="card-body">
							<p class="text-muted"><span class="text-danger">*</span> 為必填欄位；勾選「顯示在小農資訊」時，品名、標語、小農故事與小農圖片必填</p>

							<form id="farmer_form" method="post" enctype="multipart/form-data" th:object="${farmerForm}"
								th:action="${editing} ? @{/admin/info/farmers/update} : @{/admin/info/farmers/insert}">

								<!-- 供應商：新增時從下拉選擇，修改時固定且唯讀；姓名、產地等欄位都來自 vendor，不在這裡儲存 -->
								<div class="alert alert-warning" role="alert" th:if="${!editing}">
									<i class="fas fa-exclamation-triangle mr-1"></i>
									<strong>提醒：</strong>小農姓名（聯絡人）、產地等供應商資料不在此新增，請至
									<a th:href="@{/admin/psi} + '#vendor'" class="alert-link">供應商管理系統</a>新增。
								</div>

								<div class="form-group" th:if="${!editing}">
									<label for="vendorId" class="required">供應商</label>
									<select th:field="*{vendorId}" class="custom-select" onchange="hideContent('vendorId.errors'); showVendor(this);">
										<option value="">請選擇供應商</option>
										<option th:each="v : ${vendorOptions}" th:value="${v.vendorId}"
											th:text="${v.vendorId + ' - ' + v.vendorName + (v.hasFarmer ? '（已建立小農資訊）' : '')}"
											th:disabled="${v.hasFarmer}"
											th:attr="data-contact=${v.contactPerson},data-origin=${v.origin}"></option>
									</select>
									<span th:if="${#fields.hasErrors('vendorId')}" th:errors="*{vendorId}"
										class="text-danger d-block mt-1" id="vendorId.errors"></span>
									<small class="text-muted d-block mt-1">只列出已啟用的供應商；已建立小農資訊的請至<a th:href="@{/admin/info/farmers}">小農列表</a>修改</small>
								</div>

								<div th:if="${editing}">
									<div class="alert alert-warning" role="alert">
										<i class="fas fa-exclamation-triangle mr-1"></i>
										<strong>提醒：</strong>小農姓名（聯絡人）、產地等供應商資料不在此修改，請至
										<a th:href="@{/admin/info/farmers/vendor-edit(vendorId=${farmer.vendorId})}" class="alert-link">供應商管理系統</a>修改。
									</div>
									<input type="hidden" th:field="*{vendorId}" />
									<div class="form-group">
										<label>供應商</label>
										<input type="text" class="form-control" readonly
											th:value="${farmer.vendorId + ' - ' + farmer.vendor.vendorName}" />
									</div>
								</div>

								<div class="form-row">
									<div class="form-group col-md-6">
										<label>小農姓名（聯絡人）</label>
										<input type="text" id="vendorContact" class="form-control" readonly
											th:value="${editing} ? ${farmer.vendor.contactPerson}" />
									</div>
									<div class="form-group col-md-6">
										<label>產地</label>
										<input type="text" id="vendorOrigin" class="form-control" readonly
											th:value="${editing} ? ${farmer.vendor.origin}" />
									</div>
								</div>

								<div class="form-group">
									<div class="custom-control custom-checkbox">
										<input type="checkbox" th:field="*{showInFarmers}" class="custom-control-input" id="showInFarmers" />
										<label class="custom-control-label" for="showInFarmers">是否顯示在小農資訊</label>
									</div>
								</div>

								<div class="form-group">
									<label for="farmerImage" class="required">小農圖片</label>
									<input type="file" id="farmerImage" name="farmerImage" class="form-control-file"
										accept="image/png, image/jpeg, image/gif"
										onchange="hideContent('farmerImage.errors'); previewFarmerImage(this);" />
									<small class="text-muted d-block">PNG、JPEG 或 GIF，5 MB 以內<span th:if="${editing}">；不重新選擇就維持原本的圖片</span></small>
									<span class="text-danger d-block mt-1" th:text="${farmerImageError}" id="farmerImage.errors"></span>
									<div id="farmer_blob_holder">
										<img th:if="${editing and farmer.farmerImagePath != null}" th:src="@{${farmer.farmerImagePath}}" width="120px" />
									</div>
								</div>

								<div class="form-group">
									<label for="growProduct" class="required">品名（種植）</label>
									<input type="text" th:field="*{growProduct}" class="form-control" maxlength="50"
										placeholder="種植何種水果，例如：愛文芒果" onclick="hideContent('growProduct.errors');" />
									<span th:if="${#fields.hasErrors('growProduct')}" th:errors="*{growProduct}"
										class="text-danger d-block mt-1" id="growProduct.errors"></span>
								</div>

								<div class="form-group">
									<label for="farmerSlogan" class="required">標語</label>
									<input type="text" th:field="*{farmerSlogan}" class="form-control" maxlength="100"
										onclick="hideContent('farmerSlogan.errors');" />
									<span th:if="${#fields.hasErrors('farmerSlogan')}" th:errors="*{farmerSlogan}"
										class="text-danger d-block mt-1" id="farmerSlogan.errors"></span>
								</div>

								<div class="form-group">
									<label for="farmerStory" class="required">小農故事</label>
									<textarea th:field="*{farmerStory}" class="form-control" rows="8" maxlength="5000"
										placeholder="一行一段，前台會依換行分段顯示" onclick="hideContent('farmerStory.errors');"></textarea>
									<span th:if="${#fields.hasErrors('farmerStory')}" th:errors="*{farmerStory}"
										class="text-danger d-block mt-1" id="farmerStory.errors"></span>
								</div>

								<button type="submit" id="submit" class="btn btn-primary" th:text="${editing} ? '送出修改' : '送出新增'">送出</button>
							</form>
						</div>
					</div>

				</div>

			</div>

			<!-- 引入Footer -->
			<footer th:replace="~{admin/index :: adminIndex-footer}"></footer>

		</div>
	</div>

	<!-- Scroll to Top Button-->
	<span class="scroll-to-top rounded"> <i class="fas fa-angle-up"></i>
	</span>

	<!-- 引入js資源 -->
	<th:block th:replace="~{admin/index :: adminIndex-scripts}"></th:block>

	<script>
		//清除提示信息
		function hideContent(d) {
			var el = document.getElementById(d);
			if (el) {
				el.style.display = "none";
			}
		}

		//新增時選擇供應商後，帶出聯絡人與產地（唯讀）
		function showVendor(select) {
			var option = select.options[select.selectedIndex];
			document.getElementById("vendorContact").value = option.getAttribute("data-contact") || "";
			document.getElementById("vendorOrigin").value = option.getAttribute("data-origin") || "";
		}
		var vendorSelect = document.getElementById("vendorId");
		if (vendorSelect && vendorSelect.tagName === "SELECT") {
			showVendor(vendorSelect);
		}

		//送出後鎖住按鈕，避免連按重複送出
		document.getElementById("farmer_form").addEventListener("submit", function() {
			document.getElementById("submit").disabled = true;
		});

		//按上一頁回到此頁時，瀏覽器可能還原成鎖住的狀態，需恢復按鈕
		window.addEventListener("pageshow", function() {
			document.getElementById("submit").disabled = false;
		});

		//小農圖片上傳-預覽用
		var acceptedTypes = {
			'image/png' : true,
			'image/jpeg' : true,
			'image/gif' : true
		};

		function previewFarmerImage(input) {
			var holder = document.getElementById("farmer_blob_holder");
			var submitBtn = document.getElementById("submit");
			var file = input.files[0];

			holder.innerHTML = "";
			submitBtn.disabled = false;

			if (!file) {
				return;
			}

			if (acceptedTypes[file.type] === true) {
				var reader = new FileReader();
				reader.onload = function(event) {
					var image = new Image();
					image.src = event.target.result;
					image.width = 120;
					holder.appendChild(image);
				};
				reader.readAsDataURL(file);
			} else {
				var info = document.createElement("div");
				info.className = "text-danger small mt-2";
				info.innerText = "● filename: " + file.name
						+ "\n● ContentType: " + file.type
						+ "\n● size: " + file.size + " bytes"
						+ "\n● 上傳ContentType限制: image/png、image/jpeg、image/gif";
				holder.appendChild(info);
				submitBtn.disabled = true;
			}
		}
	</script>

</body>
</html>
