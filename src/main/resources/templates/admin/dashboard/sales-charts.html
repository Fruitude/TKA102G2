<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<body>

	<!-- 後台首頁：銷售儀表板，資料由 /js/dashboard-chart-admin.js 以 fetch 載入；版面參考 SB Admin 2 charts.html -->
	<div th:fragment="sales-charts" id="dashboard-sales-charts"
		th:data-monthly-url="@{/api/admin/dashboard/monthly-sales}"
		th:data-sku-url="@{/api/admin/dashboard/top-selling-skus}"
		th:data-vendor-url="@{/api/admin/dashboard/top-vendor-sales}">

		<!-- 期間選單：切換後三張圖表一起更新 -->
		<div class="d-flex align-items-center justify-content-end mb-3">
			<label for="dashboard-period" class="mb-0 mr-2 text-gray-700 small font-weight-bold">統計期間</label>
			<select id="dashboard-period" class="form-control form-control-sm" style="width: auto;">
				<option value="1">近一個月</option>
				<option value="3" selected>近三個月</option>
				<option value="6">近六個月</option>
				<option value="12">近一年</option>
			</select>
		</div>

		<!-- 三張圖同一列（5/5/2），卡片內容高度皆 20rem；小於 xl 時各自滿寬往下堆疊 -->
		<div class="row">

			<!-- 累計銷售趨勢（金額＋數量逐月累加，雙 Y 軸） -->
			<div class="col-xl-5 col-lg-12">
				<div class="card shadow mb-4">
					<div class="card-header py-3">
						<h6 class="m-0 font-weight-bold text-primary">累計銷售趨勢</h6>
					</div>
					<div class="card-body">
						<div class="chart-area" style="height: 20rem;">
							<canvas id="dashboard-monthly-chart"></canvas>
						</div>
						<p class="dashboard-chart-message small text-center mt-2 mb-0" data-chart="monthly" hidden></p>
					</div>
				</div>
			</div>

			<!-- 商品（SKU）銷售數量 Top 3，柱子下方兩行：商品名稱／規格 -->
			<div class="col-xl-5 col-lg-12">
				<div class="card shadow mb-4">
					<div class="card-header py-3">
						<h6 class="m-0 font-weight-bold text-primary">商品銷售數量 Top 3</h6>
					</div>
					<div class="card-body">
						<div class="chart-bar" style="height: 20rem;">
							<canvas id="dashboard-sku-chart"></canvas>
						</div>
						<p class="dashboard-chart-message small text-center mt-2 mb-0" data-chart="sku" hidden></p>
					</div>
				</div>
			</div>

			<!-- 供應商銷售金額 Top 3（含其他）；外層維持 20rem 讓三張卡片等高，圓餅縮為約 2/3 並垂直置中 -->
			<!-- .chart-pie 在 sb-admin-2 有 !important，覆蓋高度也要加 -->
			<div class="col-xl-2 col-lg-12">
				<div class="card shadow mb-4">
					<div class="card-header py-3">
						<h6 class="m-0 font-weight-bold text-primary">供應商 Top 3</h6>
					</div>
					<div class="card-body">
						<div class="d-flex align-items-center" style="height: 20rem;">
							<div class="chart-pie w-100" style="height: 13.5rem !important;">
								<canvas id="dashboard-vendor-chart"></canvas>
							</div>
						</div>
						<p class="dashboard-chart-message small text-center mt-2 mb-0" data-chart="vendor" hidden></p>
					</div>
				</div>
			</div>

		</div>
	</div>

</body>
</html>
