<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>結帳 | 鮮果鋪</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<link href="../../6706de395f0ceac28687d464/css/shuttershopx-template.webflow.d1e3efa9a.css" rel="stylesheet" type="text/css"/>
<link href="../../css/cart.css" rel="stylesheet" type="text/css"/>
<link href="../../css/checkout-confirm.css" rel="stylesheet" type="text/css"/>
<script src="../../ajax/libs/webfont/1.6.26/webfont.js" type="text/javascript"></script>
<script type="text/javascript">WebFont.load({  google: {    families: ["Playfair Display:regular,500,600,italic,500italic,600italic","Jost:regular,500,600,700,italic,500italic,600italic"]  }});</script>
<link href="../../66ecb06b29465580bc39d040/66f9e2f29a06e073fa0b4e8c_Shutter_Shop_&ndash;_32_Fav.svg" rel="shortcut icon" type="image/x-icon"/>
<link href="../../66ecb06b29465580bc39d040/66f9e2f649279bcda23519f4_Shutter_Shop_&ndash;_256.svg" rel="apple-touch-icon"/>

<link th:href="@{/front/css/front-theme.css}" rel="stylesheet" type="text/css"/>
</head>
<body class="front-theme">
<div class="checkout-form confirm-page">
  <div class="confirm-container">

    <div class="checkout-header confirm-top-header">
      <h1 class="heading-h3">結帳</h1>
      <!-- 總付款金額與確認付款放在最上面的「結帳」區塊，捲動時也一直看得到 -->
      <div class="confirm-top-actions">
        <div id="confirm-bottom-bar" class="confirm-bottom-bar" style="display:none">
          <div>
            <div class="confirm-bottom-bar-total-label paragraph-18">總付款金額</div>
            <div class="confirm-bottom-bar-total-value heading-h4" id="confirm-bottom-total"></div>
          </div>
          <button class="primary-button buy-button" id="confirm-pay-button" type="button"
                  th:data-place-order-url="@{/front/checkout/place-order}"
                  th:data-free-shipping-url="@{/front/checkout/free-shipping}"
                  th:data-product-discount-url="@{/front/checkout/product-discount}"
                  th:data-credit-balance-url="@{/front/checkout/credit-balance}">確認付款</button>
        </div>
        <a class="secondary-button w-button" href="../">返回購物車</a>
      </div>
    </div>

    <div id="confirm-empty-state" class="confirm-empty-state" style="display:none">
      <div class="paragraph-18" id="confirm-empty-message">您的購物車是空的。</div>
      <a class="primary-button w-button" id="confirm-empty-link" href="../../all-products/" style="margin-top:1.5rem; display:inline-flex;">回去逛逛</a>
    </div>

    <div id="confirm-success-state" class="confirm-success-state" style="display:none">
      <h2 class="heading-h4">訂單已送出，感謝您的購買！</h2>
      <a class="primary-button w-button" href="../../" style="margin-top:1.5rem; display:inline-flex;">回首頁</a>
    </div>

    <div id="confirm-order-ui" class="confirm-grid">
      <!-- 左欄：訂單商品（商品多時只在欄內捲動，不拉長整頁） -->
      <div class="confirm-col">
      <div class="checkout-header confirm-block-header">
        <h2 class="heading-h4">訂單商品</h2>
      </div>
      <div class="checkout-contents">
        <div id="confirm-item-list"></div>
      </div>
      </div>

      <!-- 右欄：購物金折抵與付款詳情 -->
      <div class="confirm-col">

      <div class="checkout-header confirm-block-header">
        <h2 class="heading-h4">購物金折抵</h2>
      </div>
      <div class="checkout-contents">
        <p class="paragraph-18" id="confirm-credit-balance">目前購物金：載入中…</p>
        <div class="confirm-credit-input-row">
          <label class="form_field-label" for="store-credit-input">輸入要折抵的購物金</label>
          <input class="form-input" id="store-credit-input" inputmode="numeric" min="0" placeholder="0" type="number"/>
        </div>
        <p class="paragraph-18" id="confirm-credit-hint" style="display:none"></p>
      </div>

      <div class="checkout-header confirm-block-header">
        <h2 class="heading-h4">付款詳情</h2>
      </div>
      <div class="checkout-contents">
        <div class="w-commerce-commercecheckoutsummarylineitem">
          <div class="paragraph-18">商品總金額</div>
          <div class="paragraph-18" id="confirm-items-total"></div>
        </div>
        <div class="w-commerce-commercecheckoutsummarylineitem">
          <div class="paragraph-18">運費金額</div>
          <div class="paragraph-18" id="confirm-shipping-fee"></div>
        </div>
        <div class="w-commerce-commercecheckoutsummarylineitem">
          <div class="paragraph-18">運費折抵</div>
          <div class="paragraph-18" id="confirm-shipping-discount"></div>
        </div>
        <div class="w-commerce-commercecheckoutsummarylineitem" id="confirm-promo-discount-row" style="display:none">
          <div class="paragraph-18">活動折扣</div>
          <div class="paragraph-18" id="confirm-promo-discount"></div>
        </div>
        <div class="w-commerce-commercecheckoutsummarylineitem" id="confirm-promo-title-row" style="display:none">
          <div class="paragraph-18">折抵活動</div>
          <div class="paragraph-18" id="confirm-promo-title"></div>
        </div>
        <div class="w-commerce-commercecheckoutsummarylineitem" id="confirm-credit-discount-row" style="display:none">
          <div class="paragraph-18">購物金折抵</div>
          <div class="paragraph-18" id="confirm-credit-discount"></div>
        </div>
        <div class="w-commerce-commercecheckoutsummarylineitem">
          <div class="paragraph-18">總付款金額</div>
          <div class="w-commerce-commercecheckoutsummarytotal paragraph-18" id="confirm-total"></div>
        </div>
      </div>
      </div>
    </div>

  </div>
</div>

<script src="../../js/cart.js" type="text/javascript"></script>
<script type="text/javascript">
(function () {
  "use strict";

  var SHIPPING_FEE = 45;
  var PROMO_DISCOUNT = 0; // 全館折扣、壽星月、新會員首購等商品折扣，同樣只供畫面顯示
  var PROMO_TITLE = "";   // 給折扣的活動名稱，顯示在「活動折扣」下一行
  var SHIPPING_DISCOUNT = 0; // 滿額免運達標時才會是 SHIPPING_FEE（只供畫面顯示，實際金額以下單時伺服器重算為準）

  var itemListEl = document.getElementById("confirm-item-list");
  var creditInput = document.getElementById("store-credit-input");
  var creditBalanceEl = document.getElementById("confirm-credit-balance");
  var creditHintEl = document.getElementById("confirm-credit-hint");
  var CREDIT_BALANCE = null;    // 目前會員的購物金餘額；null = 還沒取得或取不到（結帳時伺服器會再確認一次）
  var lastCreditApplied = 0;    // 最近一次畫面上實際折抵的購物金，按「確認付款」時就送這個金額
  var itemsTotalEl = document.getElementById("confirm-items-total");
  var shippingFeeEl = document.getElementById("confirm-shipping-fee");
  var shippingDiscountEl = document.getElementById("confirm-shipping-discount");
  var promoDiscountRow = document.getElementById("confirm-promo-discount-row");
  var promoDiscountEl = document.getElementById("confirm-promo-discount");
  var creditDiscountRow = document.getElementById("confirm-credit-discount-row");
  var creditDiscountEl = document.getElementById("confirm-credit-discount");
  var totalEl = document.getElementById("confirm-total");
  var bottomBar = document.getElementById("confirm-bottom-bar");
  var bottomTotalEl = document.getElementById("confirm-bottom-total");
  var payButton = document.getElementById("confirm-pay-button");
  var orderUi = document.getElementById("confirm-order-ui");
  var emptyState = document.getElementById("confirm-empty-state");
  var emptyMessageEl = document.getElementById("confirm-empty-message");
  var emptyLinkEl = document.getElementById("confirm-empty-link");
  var successState = document.getElementById("confirm-success-state");

  var formatMoney = window.SSXCart.formatMoney;
  var rawCart = window.SSXCart.readCart();
  // Only the items the user left checked in the cart drawer are carried
  // into checkout; unchecked ones stay behind in the cart untouched.
  var items = window.SSXCart.getCheckedItems(rawCart);

  function renderItems() {
    itemListEl.innerHTML = "";
    items.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "confirm-item-row";

      var left = document.createElement("div");
      var name = document.createElement("div");
      name.className = "confirm-item-name heading-h5";
      name.textContent = item.name;
      var qty = document.createElement("div");
      qty.className = "confirm-item-qty paragraph-18";
      qty.textContent = "數量：" + item.qty;
      left.appendChild(name);
      left.appendChild(qty);

      var right = document.createElement("div");
      right.className = "paragraph-18";
      right.textContent = formatMoney(item.qty * item.price);
      window.SSXCart.appendOriginalPrice(right, item.originalPrice * item.qty, item.qty * item.price);

      row.appendChild(left);
      row.appendChild(right);
      itemListEl.appendChild(row);
    });
  }

  function getCreditRequested() {
    var raw = parseFloat(creditInput.value);
    if (!isFinite(raw) || raw <= 0) return 0;
    return raw;
  }

  function recalc() {
    var itemsTotal = window.SSXCart.getSubtotal(items);
    var beforeCredit = Math.max(0, itemsTotal + SHIPPING_FEE - SHIPPING_DISCOUNT - PROMO_DISCOUNT);
    var creditRequested = getCreditRequested();
    // never let store-credit redemption push the payable total below zero
    // 折抵金額不能超過「應付金額」，也不能超過會員目前的購物金餘額（餘額取得後才限制）
    var creditLimit = CREDIT_BALANCE === null ? beforeCredit : Math.min(beforeCredit, CREDIT_BALANCE);
    var creditApplied = Math.min(creditRequested, creditLimit);
    lastCreditApplied = creditApplied;
    var total = beforeCredit - creditApplied;

    // 輸入框上限與提示：輸入的比能折抵的多時，說明實際會折抵多少
    creditInput.max = String(Math.floor(creditLimit));
    if (creditRequested > creditApplied) {
      creditHintEl.style.display = "";
      creditHintEl.textContent = (CREDIT_BALANCE !== null && creditRequested > CREDIT_BALANCE
        ? "超過目前購物金，" : "超過應付金額，") + "最多可折抵 " + formatMoney(Math.floor(creditLimit));
    } else {
      creditHintEl.style.display = "none";
    }

    itemsTotalEl.textContent = formatMoney(itemsTotal);
    shippingFeeEl.textContent = formatMoney(SHIPPING_FEE);
    shippingDiscountEl.textContent = formatMoney(-SHIPPING_DISCOUNT);

    var promoTitleRow = document.getElementById("confirm-promo-title-row");
    if (PROMO_DISCOUNT > 0) {
      promoDiscountRow.style.display = "";
      promoDiscountEl.textContent = formatMoney(-PROMO_DISCOUNT);
      // textContent：活動名稱是後台輸入的，不能當 HTML 解析
      document.getElementById("confirm-promo-title").textContent = PROMO_TITLE;
      promoTitleRow.style.display = PROMO_TITLE ? "" : "none";
    } else {
      promoDiscountRow.style.display = "none";
      promoTitleRow.style.display = "none";
    }

    if (creditApplied > 0) {
      creditDiscountRow.style.display = "";
      creditDiscountEl.textContent = formatMoney(-creditApplied);
    } else {
      creditDiscountRow.style.display = "none";
    }

    totalEl.textContent = formatMoney(total);
    bottomTotalEl.textContent = formatMoney(total);
  }

  function showSuccess() {
    orderUi.style.display = "none";
    bottomBar.style.display = "none";
    successState.style.display = "";
  }

  if (items.length === 0) {
    orderUi.style.display = "none";
    if (rawCart.length === 0) {
      emptyMessageEl.textContent = "您的購物車是空的。";
      emptyLinkEl.textContent = "回去逛逛";
      emptyLinkEl.href = "../../all-products/";
    } else {
      emptyMessageEl.textContent = "您尚未勾選要結帳的商品，請回到購物車勾選後再試一次。";
      emptyLinkEl.textContent = "返回購物車";
      emptyLinkEl.href = "../";
    }
    emptyState.style.display = "";
  } else {
    renderItems();
    recalc();
    bottomBar.style.display = "flex";
    // 取得目前「滿額免運」門檻（0 = 沒有活動），商品金額達標就折抵運費。失敗就維持原價，不影響結帳
    fetch(payButton.dataset.freeShippingUrl)
      .then(function (res) { return res.ok ? res.json() : 0; })
      .then(function (threshold) {
        if (threshold > 0 && window.SSXCart.getSubtotal(items) >= threshold) {
          SHIPPING_DISCOUNT = SHIPPING_FEE;
          recalc();
        }
      })
      .catch(function () {});
    // 商品折扣：全館折扣、壽星月、新會員首購（只取折扣最大的一個，沒有符合的活動回傳 0）
    // 折扣由伺服器依「規格:數量」用資料庫價格算（活動價的品項不算進折扣基準）
    fetch(payButton.dataset.productDiscountUrl + "?items="
        + encodeURIComponent(items.map(function (item) { return item.skuId + ":" + item.qty; }).join(",")))
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (discount) {
        if (discount && discount.amount > 0) {
          PROMO_DISCOUNT = discount.amount;
          PROMO_TITLE = discount.title || "";
          recalc();
        }
      })
      .catch(function () {});
    // 取得目前會員的購物金餘額並顯示；沒有餘額就停用輸入框。取不到就不限制輸入，結帳時伺服器仍會檢查餘額
    fetch(payButton.dataset.creditBalanceUrl, { cache: "no-store", credentials: "same-origin" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (balance) {
        if (typeof balance !== "number") {
          creditBalanceEl.textContent = "目前購物金：無法取得，結帳時會再次確認";
          return;
        }
        CREDIT_BALANCE = balance;
        creditBalanceEl.textContent = "目前購物金：" + formatMoney(balance);
        if (balance <= 0) {
          creditInput.value = "";
          creditInput.disabled = true;
        }
        recalc();
      })
      .catch(function () { creditBalanceEl.textContent = "目前購物金：無法取得，結帳時會再次確認"; });
    creditInput.addEventListener("input", recalc);
    payButton.addEventListener("click", function () {
      payButton.disabled = true; // prevent double-clicks from placing the order twice
      var body = new URLSearchParams();
      // backend takes an Integer; a decimal like 12.5 would be rejected with 400
      // 送的是畫面上實際折抵的金額（已經限制在餘額與應付金額以內）
      body.append("storeCredit", String(Math.floor(lastCreditApplied)));

      fetch(payButton.dataset.placeOrderUrl, { method: "POST", body: body })
        .then(function (res) {
          if (res.status === 410) { // session expired: checkout data is gone
            alert("結帳資料已逾時，請重新填寫");
            window.location.href = "../";
            return;
          }
          if (res.status === 401) { // 登入逾時：導去登入頁，登入後回到結帳頁
            alert("登入已逾時，請重新登入");
            window.location.href = "../../about/login/?next=" + encodeURIComponent(window.location.pathname.replace(/confirm\/?$/, ""));
            return;
          }
          if (res.status === 409) { // 例如購物金餘額不足、商品已下架：顯示伺服器說明，讓使用者調整後重試
            return res.text().then(function (msg) {
              alert(msg || "訂單無法建立，請調整後再試");
              payButton.disabled = false;
              throw new Error("handled");
            });
          }
          if (!res.ok) throw new Error(res.status);
          // only clear the cart once the backend has accepted the order
          window.SSXCart.removeItems(items.map(function (item) { return item.skuId; }));
          showSuccess();
        })
        .catch(function (err) {
          if (err && err.message === "handled") return; // 上面已經提示過了
          alert("訂單送出失敗，請稍後再試");
          payButton.disabled = false;
        });
    });
  }
})();
</script>
</body>
</html>
