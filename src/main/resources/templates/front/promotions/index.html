    <section class="asset-main">
      <div class="asset-shell">

          </a>
          <a class="asset-tab" data-view="perks" href="?view=perks">
            <span class="asset-tab-label">常態活動</span><span class="asset-tab-count" th:text="${#lists.size(memberPerks)}">0</span>
          </a>
        </nav>

        <div class="asset-workspace">
          <section class="asset-panel" data-panel="limited" aria-labelledby="limited-title" hidden>
            <div class="asset-panel-heading">
              <div><p class="asset-kicker">有檔期、期間限定</p><h2 id="limited-title">限時活動</h2></div>
            </div>
            <p th:if="${#lists.isEmpty(limitedPromos)}">目前沒有進行中的限時活動。</p>
            <article class="promo-page-card" th:each="p : ${limitedPromos}" th:id="${'promo-' + p.promoProjectId}">
              <div class="promo-page-head">
                <div>
                  <div class="promo-page-type" th:text="${p.typeLabel}"></div>
                  <h3 class="heading-h4 promo-page-name" th:text="${p.title}"></h3>
                </div>
                <div class="promo-page-benefit" th:if="${!#strings.isEmpty(p.benefit)}" th:text="${p.benefit}"></div>
              </div>
              <p class="promo-page-context" th:if="${!#strings.isEmpty(p.context)}" th:text="${p.context}"></p>
              <dl class="promo-page-facts">
                <div>
                  <dt>舉辦日期</dt>
                  <dd>
                    <span th:text="${#temporals.format(p.start, 'yyyy/MM/dd HH:mm') + ' ~ ' + #temporals.format(p.end, 'yyyy/MM/dd HH:mm')}"></span>
                    <span class="promo-page-countdown" th:attr="data-end=${#temporals.format(p.end, 'yyyy-MM-dd''T''HH:mm:ss')}"></span>
                  </dd>
                </div>
                <div th:if="${!#strings.isEmpty(p.condition)}"><dt>使用條件</dt><dd th:text="${p.condition}"></dd></div>
                <div th:if="${p.quota != null}"><dt>名額</dt><dd th:text="${p.quota + ' 位'}"></dd></div>
              </dl>
              <table class="promo-page-products" th:if="${!#lists.isEmpty(p.products)}">
                <thead><tr><th>商品</th><th>原價</th><th>活動價</th></tr></thead>
                <tbody>
                  <tr th:each="item : ${p.products}">
                    <td><a th:href="@{/front/product/view/(productId=${item.productId})}"
                           th:text="${item.productName + (#strings.isEmpty(item.skuName) ? '' : '（' + item.skuName + '）')}"></a></td>
                    <td class="promo-page-original" th:text="${'NT$ ' + item.originalPrice}"></td>
                    <td class="promo-page-price" th:text="${'NT$ ' + item.promoPrice}"></td>
                  </tr>
                </tbody>
              </table>
              <div class="promo-page-actions"><a class="promo-page-shop" th:href="@{/front/all-products/}">去逛逛商品</a></div>
            </article>
          </section>

          <section class="asset-panel" data-panel="perks" aria-labelledby="perks-title" hidden>

              <div><p class="asset-kicker">長期提供、符合資格即可使用</p><h2 id="perks-title">常態活動</h2></div>

  <script>
    // 分類切換：用 ?view= 記住目前分類（limited / perks）。沒帶或帶錯時顯示限時活動；
    // 限時活動是空的而常態活動有資料，就改顯示常態活動。網址帶 #promo-編號 時，切到那個活動所在的分類
    (function () {
      var tabs = document.querySelectorAll(".asset-tab[data-view]");
      var panels = document.querySelectorAll(".asset-panel[data-panel]");
      var views = Array.prototype.map.call(tabs, function (tab) { return tab.getAttribute("data-view"); });

      function setView(view, updateUrl) {
        if (views.indexOf(view) < 0) view = views[0];
        tabs.forEach(function (tab) {
          var active = tab.getAttribute("data-view") === view;
          tab.classList.toggle("is-active", active);
          if (active) tab.setAttribute("aria-current", "page"); else tab.removeAttribute("aria-current");
        });
        panels.forEach(function (panel) { panel.hidden = panel.getAttribute("data-panel") !== view; });
        if (updateUrl) {
          var url = new URL(window.location.href);
          url.searchParams.set("view", view);
          window.history.replaceState({}, "", url);
        }
      }

      function countOf(view) {
        var tab = document.querySelector('.asset-tab[data-view="' + view + '"] .asset-tab-count');
        return tab ? Number(tab.textContent) || 0 : 0;
      }

      tabs.forEach(function (tab) {
        tab.addEventListener("click", function (event) {
          event.preventDefault();
          setView(tab.getAttribute("data-view"), true);
        });
      });

      var view = new URLSearchParams(window.location.search).get("view");
      var target = window.location.hash ? document.querySelector(window.location.hash.replace(/[^#\w-]/g, "")) : null;
      var panel = target ? target.closest(".asset-panel[data-panel]") : null;
      if (panel) view = panel.getAttribute("data-panel");
      if (views.indexOf(view) < 0) view = (countOf("limited") === 0 && countOf("perks") > 0) ? "perks" : views[0];
      setView(view, false);
      if (target) target.scrollIntoView();
    })();
  </script>
  <script>
    // 限時活動倒數：一天以上顯示「剩 N 天」，不到一天顯示「剩 HH:MM:SS」，到期後顯示「已結束」
    (function () {
      var els = document.querySelectorAll(".promo-page-countdown[data-end]");
      if (!els.length) return;
      function pad(n) { return (n < 10 ? "0" : "") + n; }
      function tick() {
        var now = Date.now();
        els.forEach(function (el) {
          var left = new Date(el.getAttribute("data-end")).getTime() - now;
          if (isNaN(left)) { el.textContent = ""; return; }
          if (left <= 0) { el.textContent = "已結束"; return; }
          var days = Math.floor(left / 86400000);
          if (days >= 1) { el.textContent = "剩 " + days + " 天"; return; }
          var h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000), s = Math.floor(left % 60000 / 1000);
          el.textContent = "剩 " + pad(h) + ":" + pad(m) + ":" + pad(s);
        });
      }
      tick();
      window.setInterval(tick, 1000);
    })();
  </script>
