<!DOCTYPE html><html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>鮮果鋪搜尋</title></head><body>
<dialog id="fruit-search-dialog" aria-labelledby="fruit-search-title">
 <div class="fruit-search-orange">
  <button class="fruit-search-close" type="button" aria-label="關閉搜尋">×</button>
  <img class="fruit-search-brand" th:src="@{/front/6706de395f0ceac28687d464/6706de395f0ceac28687d5ed_Shutter_Shop.svg}" alt="鮮果鋪">
  <p class="fruit-search-eyebrow">一口鮮甜，從這裡開始</p><h2 id="fruit-search-title">今天想吃什麼水果？</h2>
  <form id="fruit-search-form" method="get" th:action="@{/front/search/}">
   <label class="fruit-search-label" for="fruit-search-keyword">搜尋關鍵字</label>
   <input id="fruit-search-keyword" type="search" name="q" maxlength="20" placeholder="試試「芒果」、「台南」或供應商名稱" th:value="${searchQuery.q}" autocomplete="off">
   <p class="fruit-search-hint">輸入部分名稱也能找到。可以搭配下方條件一起搜尋。</p>
   <div class="fruit-search-tabs" role="tablist" aria-label="搜尋篩選方式">
    <button type="button" id="fruit-tab-category" role="tab" aria-selected="true" aria-controls="fruit-panel-category" data-search-tab="category">水果種類</button>
    <button type="button" id="fruit-tab-origin" role="tab" aria-selected="false" aria-controls="fruit-panel-origin" data-search-tab="origin" tabindex="-1">產地</button>
    <button type="button" id="fruit-tab-vendor" role="tab" aria-selected="false" aria-controls="fruit-panel-vendor" data-search-tab="vendor" tabindex="-1">供應商</button>
    <button type="button" id="fruit-tab-promotion" role="tab" aria-selected="false" aria-controls="fruit-panel-promotion" data-search-tab="promotion" tabindex="-1">優惠活動</button>
    <button type="button" id="fruit-tab-rating" role="tab" aria-selected="false" aria-controls="fruit-panel-rating" data-search-tab="rating" tabindex="-1">高評分</button>
   </div>
   <div class="fruit-search-panel" id="fruit-panel-category" role="tabpanel" aria-labelledby="fruit-tab-category">
    <label id="fruit-search-category-label" for="fruit-category-trigger">選擇水果種類</label><select id="fruit-search-category" name="category" class="fruit-category-select" hidden aria-hidden="true" tabindex="-1"><option value="">不限種類</option><option th:each="o:${searchOptions.categories}" th:attr="data-category-parent=${o.parent}" th:value="${o.value}" th:text="${o.label}" th:selected="${searchQuery.category != null and o.value == searchQuery.category.toString()}"></option></select><div class="fruit-category-dropdown"><button type="button" id="fruit-category-trigger" class="fruit-category-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="fruit-category-menu" aria-labelledby="fruit-search-category-label fruit-category-caption"><span id="fruit-category-caption">不限種類</span><b aria-hidden="true">▾</b></button><div class="fruit-category-menu" id="fruit-category-menu" role="menu" aria-label="水果巢狀分類" hidden><input type="search" class="fruit-category-filter" aria-label="搜尋分類" placeholder="輸入分類名稱" autocomplete="off"><p class="fruit-category-empty" role="status" hidden>沒有符合的分類</p><div class="fruit-category-options"></div></div></div>
   </div>
   <div class="fruit-search-panel" id="fruit-panel-origin" role="tabpanel" aria-labelledby="fruit-tab-origin" hidden>
    <label for="fruit-search-origin">選擇產地</label><select id="fruit-search-origin" name="origin"><option value="">不限產地</option><option th:each="o:${searchOptions.origins}" th:value="${o.value}" th:text="${o.label}" th:selected="${o.value == searchQuery.origin}"></option></select>
   </div>
   <div class="fruit-search-panel" id="fruit-panel-vendor" role="tabpanel" aria-labelledby="fruit-tab-vendor" hidden>
    <label for="fruit-search-vendor">選擇供應商</label><select id="fruit-search-vendor" name="vendor"><option value="">不限供應商</option><option th:each="o:${searchOptions.vendors}" th:value="${o.value}" th:text="${o.label}" th:selected="${searchQuery.vendor != null and o.value == searchQuery.vendor.toString()}"></option></select>
   </div>
   <div class="fruit-search-panel" id="fruit-panel-promotion" role="tabpanel" aria-labelledby="fruit-tab-promotion" hidden>
    <label for="fruit-search-promotion">選擇目前有效的商品優惠</label><select id="fruit-search-promotion" name="promotion"><option value="">不限活動</option><option value="any" th:selected="${searchQuery.promotion == 'any'}">所有商品優惠</option><option th:each="o:${searchOptions.promotions}" th:value="${o.value}" th:text="${o.label}" th:selected="${o.value == searchQuery.promotion}"></option></select>
   </div>
   <div class="fruit-search-panel" id="fruit-panel-rating" role="tabpanel" aria-labelledby="fruit-tab-rating" hidden>
    <label class="fruit-search-rating"><input type="checkbox" name="highRated" value="true" th:checked="${searchQuery.highRated}"><span>只看平均評分 4～5 分的商品</span></label><p>依已公開的商品評論計算。</p>
   </div>
   <p class="fruit-search-selected" id="fruit-search-selected" aria-live="polite">尚未設定篩選條件</p>
   <div class="fruit-search-actions"><button class="fruit-search-clear" type="button">清除條件</button><button class="fruit-search-submit" type="submit">開始搜尋 <span aria-hidden="true">→</span></button></div>
  </form>
 </div>
</dialog>
</body></html>
