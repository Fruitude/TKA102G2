  <main id="main-content">
    <section class="asset-hero">
      <div class="asset-hero-inner">
        <p class="asset-eyebrow">我的鮮果鋪</p>
        <h1 class="asset-title">常用資料</h1>
      </div>
    </section>

    <section class="asset-main">
      <div class="asset-shell">
        <nav class="asset-tabs" aria-label="會員常用資料">
          <a class="asset-tab" data-view="address" href="?view=address">
            <span class="asset-tab-label">我的地址</span><span class="asset-tab-count" id="address-count">0</span>
          </a>
          <a class="asset-tab" data-view="card" href="?view=card">
            <span class="asset-tab-label">我的信用卡</span><span class="asset-tab-count" id="card-count">0</span>
          </a>
          <a class="asset-tab" data-view="phone" href="?view=phone">
            <span class="asset-tab-label">我的電話</span><span class="asset-tab-count" id="phone-count">0</span>
          </a>
        </nav>

        <div class="asset-workspace">
          <section class="asset-panel" data-panel="address" aria-labelledby="address-title">
            <div class="asset-panel-heading">
              <div><p class="asset-kicker">配送資訊</p><h2 id="address-title">我的地址</h2></div>
              <p>結帳時可快速選用常用收件地址。</p>
            </div>
            <form class="asset-form" data-form="address" novalidate>
              <input data-id type="hidden" />
              <div class="asset-field asset-field-wide">
                <label for="contact-address">收件地址</label>
                <input id="contact-address" maxlength="255" placeholder="例如：台北市信義區鮮果路 1 號" required type="text" />
              </div>
              <label class="asset-checkbox"><input data-default type="checkbox" /><span>設為預設地址</span></label>
              <div class="asset-form-actions">
                <button class="asset-secondary-button" data-cancel hidden type="button">取消編輯</button>
                <button class="primary-button w-button asset-save-button" data-save type="submit">新增地址</button>
              </div>
              <p class="asset-feedback" data-feedback aria-live="polite"></p>
            </form>
            <div class="asset-list" data-list="address" aria-live="polite"></div>
          </section>

          <section class="asset-panel" data-panel="card" aria-labelledby="card-title">
            <div class="asset-panel-heading">
              <div><p class="asset-kicker">付款資訊</p><h2 id="card-title">我的信用卡</h2></div>
              <p>只保存卡片辨識資料，不會在頁面顯示完整卡號。</p>
            </div>
            <form class="asset-form" data-form="card" novalidate>
              <input data-id type="hidden" />
              <div class="asset-form-grid">
                <div class="asset-field"><label for="card-brand">卡片品牌</label><input id="card-brand" maxlength="20" placeholder="Visa" required type="text" /></div>
                <div class="asset-field"><label for="card-last-four">卡號末四碼</label><input id="card-last-four" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="1234" required type="text" /></div>
                <div class="asset-field"><label for="card-holder">持卡人姓名</label><input id="card-holder" maxlength="50" required type="text" /></div>
                <div class="asset-field"><label for="card-expiry">到期年月</label><input id="card-expiry" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="YYMM，例如 2912" required type="text" /></div>
              </div>
              <label class="asset-checkbox"><input data-default type="checkbox" /><span>設為預設信用卡</span></label>
              <div class="asset-form-actions">
                <button class="asset-secondary-button" data-cancel hidden type="button">取消編輯</button>
                <button class="primary-button w-button asset-save-button" data-save type="submit">新增信用卡</button>
              </div>
              <p class="asset-feedback" data-feedback aria-live="polite"></p>
            </form>
            <div class="asset-list" data-list="card" aria-live="polite"></div>
          </section>

          <section class="asset-panel" data-panel="phone" aria-labelledby="phone-title">
            <div class="asset-panel-heading">
              <div><p class="asset-kicker">聯絡資訊</p><h2 id="phone-title">我的電話</h2></div>
              <p>保存常用聯絡電話，方便配送時聯繫。</p>
            </div>
            <form class="asset-form" data-form="phone" novalidate>
              <input data-id type="hidden" />
              <div class="asset-field asset-field-wide">
                <label for="contact-phone">聯絡電話</label>
                <input id="contact-phone" maxlength="20" placeholder="例如：0912-345-678" required type="tel" />
              </div>
              <label class="asset-checkbox"><input data-default type="checkbox" /><span>設為預設電話</span></label>
              <div class="asset-form-actions">
                <button class="asset-secondary-button" data-cancel hidden type="button">取消編輯</button>
                <button class="primary-button w-button asset-save-button" data-save type="submit">新增電話</button>
              </div>
              <p class="asset-feedback" data-feedback aria-live="polite"></p>
            </form>
            <div class="asset-list" data-list="phone" aria-live="polite"></div>
          </section>
        </div>
      </div>
