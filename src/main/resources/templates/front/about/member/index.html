  <script>
    (function() {
      var form = document.getElementById('member-profile-form');
      var saveButton = document.getElementById('profile-save');
      var feedback = document.getElementById('profile-feedback');
      var contextPath = window.location.pathname.split('/front/')[0];

      function showFeedback(message, type) {
        feedback.textContent = message;
        feedback.className = 'profile-feedback' + (type ? ' is-' + type : '');
      }

      function redirectToLogin() {
        window.location.replace(contextPath + '/front/about/login/');
      }

      function formatDate(value) {
        return value ? value.split('T')[0].replace(/-/g, '/') : '未填寫';
      }

      function renderMember(member) {
        document.getElementById('summary-name').textContent = member.memberName;
        document.getElementById('summary-status').textContent =
          member.memberStatus === 1 ? '帳戶使用中' : '帳戶已停權';
        document.getElementById('summary-id').textContent = '#' + member.memberId;
        document.getElementById('summary-credit').textContent =
          'NT$ ' + Number(member.shoppingCredit || 0).toLocaleString('zh-TW');
        document.getElementById('summary-created').textContent = formatDate(member.createdAt);
        document.getElementById('member-name').value = member.memberName || '';
        document.getElementById('member-birthday').value = member.memberBirthday || '';
        document.getElementById('member-account').value = member.memberAccount || '';
        document.getElementById('member-email').value = member.memberEmail || '';
      }

      function readJson(response) {
        return response.json().catch(function() {
          return {};
        }).then(function(body) {
          return { ok: response.ok, status: response.status, body: body };
        });
      }

      fetch(contextPath + '/api/members/me', {
        credentials: 'same-origin',
        headers: { 'Accept': 'application/json' }
      }).then(readJson).then(function(result) {
        if (result.status === 401) {
          redirectToLogin();
          return;
        }
        if (!result.ok) {
          throw new Error(result.body.message || '目前無法載入會員資料');
        }
        renderMember(result.body);
      }).catch(function(error) {
        showFeedback(error.message || '目前無法載入會員資料', 'error');
      });

      form.addEventListener('submit', function(event) {
        event.preventDefault();
        if (!form.reportValidity()) return;

        saveButton.disabled = true;
        saveButton.textContent = '儲存中...';
        showFeedback('正在儲存會員資料', '');

        var payload = {
          memberName: document.getElementById('member-name').value.trim(),
          memberBirthday: document.getElementById('member-birthday').value || null,
          memberAccount: document.getElementById('member-account').value.trim(),
          memberEmail: document.getElementById('member-email').value.trim(),
          memberPassword: document.getElementById('member-password').value
        };

        fetch(contextPath + '/api/members/me', {
          method: 'PUT',
          credentials: 'same-origin',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        }).then(readJson).then(function(result) {
          if (result.status === 401) {
            redirectToLogin();
            return;
          }
          if (!result.ok) {
            throw new Error(result.body.message || '會員資料儲存失敗');
          }
          renderMember(result.body);
          document.getElementById('member-password').value = '';
          var menuName = document.querySelector('.member-menu-name');
          if (menuName) menuName.textContent = result.body.memberName;
          showFeedback('會員資料已更新', 'success');
        }).catch(function(error) {
          showFeedback(error.message || '會員資料儲存失敗，請稍後再試', 'error');
        }).finally(function() {
          saveButton.disabled = false;
          saveButton.textContent = '儲存變更';
        });
      });
    })();
  </script>
