  <script>
    // 分頁切換：用 ?view= 記住目前分頁，沒帶或帶錯就顯示第一個（待出貨）
    (function() {
      var tabs = document.querySelectorAll(".asset-tab[data-view]");
      var panels = document.querySelectorAll(".asset-panel[data-panel]");
      var views = Array.prototype.map.call(tabs, function(tab) { return tab.getAttribute("data-view"); });

      function setView(view, updateUrl) {
        if (views.indexOf(view) < 0) view = views[0];
        tabs.forEach(function(tab) {
          var active = tab.getAttribute("data-view") === view;
          tab.classList.toggle("is-active", active);
          if (active) tab.setAttribute("aria-current", "page"); else tab.removeAttribute("aria-current");
        });
        panels.forEach(function(panel) { panel.hidden = panel.getAttribute("data-panel") !== view; });
        if (updateUrl) {
          var url = new URL(window.location.href);
          url.searchParams.set("view", view);
          window.history.replaceState({}, "", url);
        }
      }

      tabs.forEach(function(tab) {
        tab.addEventListener("click", function(event) {
          event.preventDefault();
          setView(tab.getAttribute("data-view"), true);
        });
      });
      setView(new URLSearchParams(window.location.search).get("view"), false);
    })();
    // 載入登入會員的訂單，依後端合併狀態算出的分頁（tab）放進對應分頁，顯示品名、數量、訂單金額
    (function() {
      var contextPath = window.location.pathname.split("/front/")[0];

      function text(tag, className, value) {
        var el = document.createElement(tag);
        if (className) el.className = className;
        el.textContent = value;
        return el;
      }

      function renderOrder(order) {
        var card = document.createElement("div");
        card.className = "order-card";
        var head = document.createElement("div");
        head.className = "order-card-head";
        head.appendChild(text("span", "", "訂單 #" + order.ordersId));
        head.appendChild(text("span", "order-card-status", order.status));
        card.appendChild(head);
        card.appendChild(text("div", "order-card-date", (order.ordersDate || "").replace("T", " ").substring(0, 16)));
        for (var i = 0; i < order.items.length; i++) {
          var row = document.createElement("div");
          row.className = "order-item";
          row.appendChild(text("span", "", order.items[i].productName));
          row.appendChild(text("span", "", "× " + order.items[i].quantity));
          // 已完成的訂單，每個商品多「再買一次」「評論」兩個按鈕；不成立的訂單只有「再買一次」（評論功能之後再接）
          if (order.tab === "completed" || order.tab === "canceled") {
            var actions = document.createElement("span");
            actions.className = "order-item-actions";
            var actionNames = order.tab === "completed" ? ["rebuy", "comment"] : ["rebuy"];
            var actionLabels = ["再買一次", "評論"];
            for (var j = 0; j < actionNames.length; j++) {
              var button = text("button", "asset-row-button", actionLabels[j]);
              button.type = "button";
              button.setAttribute("data-action", actionNames[j]);
              button.setAttribute("data-orders-id", order.ordersId);
              button.setAttribute("data-sku-id", order.items[i].skuId);
              button.setAttribute("data-quantity", order.items[i].quantity);
              actions.appendChild(button);
            }
            row.appendChild(actions);
          }
          card.appendChild(row);
        }
        card.appendChild(text("div", "order-card-total", "訂單金額 NT$ " + Number(order.amount || 0).toLocaleString("zh-TW")));
        return card;
      }

      // 再買一次：用同一規格、同樣數量加入購物車。沿用購物車原本的庫存與價格檢查（庫存不足會跳訊息）
      document.addEventListener("click", function(event) {
        var button = event.target.closest('button[data-action="rebuy"]');
        if (!button) return;
        if (!window.SSXCart || !window.SSXCart.addProduct) {
          window.alert("購物車尚未準備好，請重新整理頁面後再試");
          return;
        }
        window.SSXCart.addProduct({ skuId: button.getAttribute("data-sku-id"), image: "" },
          Number(button.getAttribute("data-quantity")) || 1, button, null);
      });

      fetch(contextPath + "/api/members/me/orders", { credentials: "same-origin", headers: { "Accept": "application/json" } })
        .then(function(res) {
          if (res.status === 401) { window.location.href = contextPath + "/front/about/login/"; return null; }
          return res.ok ? res.json() : [];
        })
        .then(function(orders) {
          if (!orders) return;
          var counts = {};
          for (var i = 0; i < orders.length; i++) {
            var panel = document.querySelector('.asset-panel[data-panel="' + orders[i].tab + '"]');
            if (!panel) continue;
            panel.querySelector("[data-order-list]").appendChild(renderOrder(orders[i]));
            counts[orders[i].tab] = true;
          }
          document.querySelectorAll(".asset-panel[data-panel]").forEach(function(panel) {
            panel.querySelector("[data-order-empty]").hidden = !!counts[panel.getAttribute("data-panel")];
          });
        })
        .catch(function() {
          document.querySelectorAll("[data-order-empty]").forEach(function(p) { p.hidden = false; });
        });
    })();
  </script>
