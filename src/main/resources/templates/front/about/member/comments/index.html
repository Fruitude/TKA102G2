  <script>
    // 載入登入會員的評論紀錄（新的在前），版型沿用購買清單的卡片
    (function() {
      var contextPath = window.location.pathname.split("/front/")[0];
      var list = document.getElementById("review-list");
      var empty = document.getElementById("review-empty");
      var pager = document.getElementById("review-pager");
      var PAGE_SIZE = 20;
      var state = { page: 0, totalPages: 0, totalElements: 0 };

      function text(tag, className, value) {
        var el = document.createElement(tag);
        if (className) el.className = className;
        el.textContent = value;
        return el;
      }

      function renderReview(review) {
        var card = document.createElement("div");
        card.className = "order-card";
        var head = document.createElement("div");
        head.className = "order-card-head";
        head.appendChild(text("span", "", review.productName));
        var stars = document.createElement("span");
        stars.className = "review-card-stars";
        stars.setAttribute("aria-label", review.commentStar + " 顆星");
        for (var s = 1; s <= 5; s++) {
          stars.appendChild(text("span", s <= review.commentStar ? "is-on" : "", "★"));
        }
        head.appendChild(stars);
        card.appendChild(head);
        card.appendChild(text("div", "order-card-date", (review.commentDate || "").replace("T", " ").substring(0, 16)));
        if (review.commentText) card.appendChild(text("p", "review-card-text", review.commentText));

        var foot = document.createElement("div");
        foot.className = "review-card-foot";
        var orderLink = text("a", "", "訂單 #" + review.ordersId);
        orderLink.href = contextPath + "/front/about/member/orders/?ordersId=" + encodeURIComponent(review.ordersId);
        foot.appendChild(orderLink);
        // 評論狀態：1 顯示中，2 被檢舉審核中，3 已被隱藏
        if (review.commentStatus === 2) foot.appendChild(text("span", "order-card-status", "檢舉審核中"));
        else if (review.commentStatus === 3) foot.appendChild(text("span", "order-card-status", "已被隱藏"));
        card.appendChild(foot);
        return card;
      }

      // 向後端取一頁評論（page 從 0 開始），每頁 PAGE_SIZE 筆
      function loadPage() {
        var url = contextPath + "/api/members/me/reviews?page=" + state.page + "&size=" + PAGE_SIZE;
        return fetch(url, { credentials: "same-origin", headers: { "Accept": "application/json" } })
          .then(function(res) {
            if (res.status === 401) { window.location.href = contextPath + "/front/about/login/?next=" + encodeURIComponent(window.location.pathname + window.location.search); return null; }
            return res.ok ? res.json() : null;
          })
          .then(function(result) {
            if (!result) { empty.hidden = false; return; }
            state.page = Number(result.page || 0);
            state.totalPages = Number(result.totalPages || 0);
            state.totalElements = Number(result.totalElements || 0);
            list.replaceChildren();
            (result.reviews || []).forEach(function(review) { list.appendChild(renderReview(review)); });
            empty.hidden = state.totalElements > 0;
            pager.hidden = state.totalPages <= 1;
            var visiblePage = state.totalPages === 0 ? 0 : state.page + 1;
            document.getElementById("review-page-summary").textContent =
              "第 " + visiblePage + " / " + state.totalPages + " 頁，共 " + state.totalElements + " 筆";
            document.getElementById("review-page-previous").disabled = state.page <= 0;
            document.getElementById("review-page-next").disabled = state.totalPages === 0 || state.page >= state.totalPages - 1;
          })
          .catch(function() { empty.hidden = false; });
      }

      document.getElementById("review-page-previous").addEventListener("click", function() {
        if (state.page > 0) {
          state.page -= 1;
          loadPage().then(function() { window.scrollTo({ top: 0, behavior: "smooth" }); });
        }
      });
      document.getElementById("review-page-next").addEventListener("click", function() {
        if (state.page < state.totalPages - 1) {
          state.page += 1;
          loadPage().then(function() { window.scrollTo({ top: 0, behavior: "smooth" }); });
        }
      });
      loadPage();
    })();
  </script>
