    /* 共用的 .asset-shell 是「左側分頁 250px + 右側內容」兩欄；這頁沒有分頁，改成單欄讓內容撐滿 */

    #review-list { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; margin-top: 1rem; }
    .review-card { display: block; width: 100%; box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 8px; padding: 1.25rem 1.5rem; }
    .review-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .5rem 1.5rem; padding-bottom: .75rem; border-bottom: 1px dashed #e5e5e5; }
    .review-name { font-weight: 600; font-size: 1.125rem; }
    .review-meta { color: #555; font-size: .95rem; display: flex; gap: 1.25rem; }
    .review-stars { display: flex; gap: .25rem; margin: .75rem 0; }
    .review-star { background: none; border: 0; padding: 0; font-size: 1.75rem; line-height: 1; color: #ccc; cursor: pointer; }
    .review-star.is-on { color: #f5a623; }
    .review-star:disabled { cursor: default; }
    .review-text { display: block; width: 100%; box-sizing: border-box; min-height: 220px; padding: .75rem 1rem; line-height: 1.6; border: 1px solid #ccc; border-radius: 6px; resize: vertical; font: inherit; }
    .review-foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: .5rem; }
    .review-count { color: #777; font-size: .875rem; }
    .review-message { color: #b4462b; font-size: .875rem; flex: 1; }
    .review-message.is-ok { color: #2e7d32; }
    .review-done { color: #2e7d32; font-weight: 600; margin-top: .5rem; }
    .review-back { margin-top: 1rem; }
  </style>

  <script src="../../../js/jquery-3.5.1.min.dc5e7f18c8.js" type="text/javascript"></script>
  <script src="../../../6706de395f0ceac28687d464/js/webflow.50a1b7525.js" type="text/javascript"></script>
  <script>
    (function() {
      var MAX_LENGTH = 800;
      var contextPath = window.location.pathname.split("/front/")[0];
      var ordersId = new URLSearchParams(window.location.search).get("ordersId");
      var apiUrl = contextPath + "/api/members/me/orders/" + encodeURIComponent(ordersId) + "/reviews";
      var list = document.getElementById("review-list");
      var empty = document.getElementById("review-empty");

      function el(tag, className, value) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (value != null) node.textContent = value;
        return node;
      }

      function showEmpty(message) {
        empty.textContent = message;
        empty.hidden = false;
        document.getElementById("review-hint").hidden = true;
      }

      // 已評論：唯讀顯示星數與內容
      function renderDone(card, star, content, notice) {
        card.querySelectorAll(".review-form").forEach(function(n) { n.remove(); });
        var stars = el("div", "review-stars");
        for (var s = 1; s <= 5; s++) {
          var mark = el("span", "review-star" + (s <= star ? " is-on" : ""), "★");
          stars.appendChild(mark);
        }
        card.appendChild(stars);
        if (content) card.appendChild(el("p", "", content));
        card.appendChild(el("div", "review-done", notice));
      }

      function renderItem(item) {
        var card = el("div", "review-card");
        var head = el("div", "review-head");
        head.appendChild(el("span", "review-name", item.productName));
        var meta = el("span", "review-meta");
        var unitPrice = Number(item.unitPrice || 0);
        meta.appendChild(el("span", "", "單價 NT$ " + unitPrice.toLocaleString("zh-TW")));
        meta.appendChild(el("span", "", "數量 × " + item.quantity));
        meta.appendChild(el("span", "", "小計 NT$ " + (unitPrice * Number(item.quantity || 0)).toLocaleString("zh-TW")));
        head.appendChild(meta);
        card.appendChild(head);

        if (item.commentText) {
          renderDone(card, item.commentStar, item.commentText, "已評論");
          return card;
        }
        if (item.reviewed) {
          card.appendChild(el("div", "review-done", "您已評論過這個商品"));
          return card;
        }

        var form = el("div", "review-form");
        var star = 0;
        var stars = el("div", "review-stars");
        var starButtons = [];
        function paint() {
          starButtons.forEach(function(b, idx) { b.classList.toggle("is-on", idx < star); });
        }
        for (var s = 1; s <= 5; s++) {
          (function(value) {
            var b = el("button", "review-star", "★");
            b.type = "button";
            b.setAttribute("aria-label", value + " 顆星");
            b.addEventListener("click", function() { star = value; paint(); });
            starButtons.push(b);
            stars.appendChild(b);
          })(s);
        }
        form.appendChild(stars);

        var area = el("textarea", "review-text");
        area.maxLength = MAX_LENGTH;
        area.placeholder = "說說您對這個商品的感受（最多 " + MAX_LENGTH + " 字）";
        form.appendChild(area);

        var foot = el("div", "review-foot");
        var message = el("span", "review-message", "");
        var count = el("span", "review-count", "0 / " + MAX_LENGTH);
        var submit = el("button", "asset-row-button", "送出評論");
        submit.type = "button";
        foot.appendChild(message);
        foot.appendChild(count);
        foot.appendChild(submit);
        form.appendChild(foot);
        card.appendChild(form);

        area.addEventListener("input", function() { count.textContent = area.value.length + " / " + MAX_LENGTH; });
        submit.addEventListener("click", function() {
          var content = area.value.trim();
          message.className = "review-message";
          if (star < 1) { message.textContent = "請先選擇星數"; return; }
          if (!content) { message.textContent = "請輸入評論內容"; return; }
          if (content.length > MAX_LENGTH) { message.textContent = "評論內容最多 " + MAX_LENGTH + " 字"; return; }
          submit.disabled = true;
          fetch(apiUrl, {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ ordersDetailId: item.ordersDetailId, star: star, text: content })
          }).then(function(res) {
            if (res.status === 401) { window.location.href = contextPath + "/front/about/login/"; return null; }
            return res.json().catch(function() { return {}; }).then(function(body) { return { ok: res.ok, body: body }; });
          }).then(function(result) {
            if (!result) return;
            if (result.ok) {
              renderDone(card, star, content, "評論已送出，謝謝您！");
            } else {
              message.textContent = result.body.message || "送出失敗，請稍後再試";
              submit.disabled = false;
            }
          }).catch(function() {
            message.textContent = "送出失敗，請稍後再試";
            submit.disabled = false;
          });
        });
        return card;
      }

      if (!ordersId) { showEmpty("找不到要評論的訂單"); return; }
      document.getElementById("review-order-label").textContent = "訂單 #" + ordersId;

      fetch(apiUrl, { credentials: "same-origin", headers: { "Accept": "application/json" } })
        .then(function(res) {
          if (res.status === 401) { window.location.href = contextPath + "/front/about/login/"; return null; }
          return res.json().catch(function() { return {}; }).then(function(body) { return { ok: res.ok, body: body }; });
        })
        .then(function(result) {
          if (!result) return;
          if (!result.ok) { showEmpty(result.body.message || "無法載入訂單"); return; }
          if (!result.body.length) { showEmpty("這張訂單沒有商品"); return; }
          result.body.forEach(function(item) { list.appendChild(renderItem(item)); });
        })
        .catch(function() { showEmpty("無法載入訂單，請稍後再試"); });
    })();
  </script>
