</div>

        <img loading="lazy" th:src="@{${'/product/image/' + imageId + '?v=' + (productImageVersions == null ? '0' : productImageVersions.get(imageId))}}" th:alt="${s.name}"/>

</button>
</div>
</div>

  <div class="pv-supplier-row"><span class="pv-supplier-label">產地：</span><span th:text="${productSupplier != null and !#strings.isEmpty(productSupplier.origin) ? productSupplier.origin : '未提供'}"></span></div>
</div>

<script type="text/javascript">
(function () {
  var select = document.getElementById("pv-sku");
  if (!select) return;
  var form = document.getElementById("pv-form");
  function formatProductPrice(amount) {
    return "NT$ " + Number(amount).toLocaleString("zh-TW", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }
  function updateTotalPrice() {
    var option = select.options[select.selectedIndex];
    var quantity = Math.max(1, Math.floor(Number(document.getElementById("pv-qty").value) || 1));
    var price = document.getElementById("pv-price");
    price.dataset.unitPrice = option.dataset.price;
    price.textContent = formatProductPrice(Number(option.dataset.price) * quantity);
    // 促銷中：在活動價下方顯示劃線的原價；沒有促銷就隱藏（各規格的原價放在上方隱藏的 .pv-sku-original）
    var originalEl = document.getElementById("pv-original-price");
    var originalHolder = document.querySelector(".pv-sku-original[data-sku-id=\"" + option.value + "\"]");
    var originalValue = originalHolder ? Number(originalHolder.dataset.original) : 0;
    document.getElementById("pv-promo-ribbon").hidden = originalValue <= Number(option.dataset.price);
    if (originalValue > Number(option.dataset.price)) {
      originalEl.textContent = formatProductPrice(originalValue * quantity);
      originalEl.style.display = "";
    } else {
      originalEl.textContent = "";
      originalEl.style.display = "none";
    }
  }
  function updateSku() {
    var option = select.options[select.selectedIndex];
    form.setAttribute("data-commerce-sku-id", option.value);
    document.getElementById("pv-image").src = option.dataset.imageUrl;
    var stock = Math.max(0, Number(option.dataset.stock) || 0);
    var qty = document.getElementById("pv-qty");
    qty.max = String(stock);
    qty.value = String(Math.min(Math.max(1, Number(qty.value) || 1), Math.max(stock, 1)));
    updateTotalPrice();
    var soldOut = Number(option.dataset.skuStatus) === 4;
    form.querySelector('[type="submit"]').disabled = stock === 0;
    form.querySelector('[type="submit"]').value = stock === 0 ? (soldOut ? "已售完" : "目前缺貨") : "加入購物車";
    var buy = form.querySelector('.w-commerce-commercebuynowbutton');
    // Keep the second button's layout space while unavailable; it cannot receive clicks or focus.
    buy.hidden = false;
    buy.style.display = "";
    buy.style.visibility = stock === 0 ? "hidden" : "";
    buy.inert = stock === 0;
    if (stock === 0) buy.setAttribute("aria-hidden", "true");
    else buy.removeAttribute("aria-hidden");
  }
  function updateNotice() {
    var notice = document.getElementById("pv-quantity-notice");
    notice.textContent = window.SSXCart.quantityNotice(select.options[select.selectedIndex].dataset.skuStatus, Number(document.getElementById("pv-qty").value));
    notice.hidden = !notice.textContent;
  }
  document.getElementById("pv-qty").addEventListener("input", function () { updateNotice(); updateTotalPrice(); });
  document.getElementById("pv-qty").addEventListener("change", function () {
    var qty = this; qty.value = String(Math.min(Number(qty.max), Math.max(1, Math.floor(Number(qty.value) || 1)))); updateNotice(); updateTotalPrice();
  });
  select.addEventListener("change", function () { updateSku(); updateNotice(); });
  updateSku();
  updateNotice(); // 缺貨（狀態 2）的提示一進頁面就要顯示

  // 我的最愛愛心
  var fav = document.getElementById("pv-favorite");
  function renderFav(on) {
    fav.setAttribute("aria-pressed", on ? "true" : "false");
    fav.setAttribute("aria-label", on ? "移除我的最愛" : "加入我的最愛");
    fav.querySelector("svg").setAttribute("fill", on ? "currentColor" : "none");
  }
  function currentProduct() {
    return {
      productId: Number(fav.dataset.productId),
      skuId: document.getElementById("pv-form").getAttribute("data-commerce-sku-id"),
      productName: document.getElementById("pv-name").textContent.trim(),
      price: Number(select.options[select.selectedIndex].dataset.price) || 0,
      imageUrl: document.getElementById("pv-image").src
    };
  }
  window.FavoriteStore.ready.then(function(session) {
    if (session && session.loggedIn) renderFav(window.FavoriteStore.has(fav.dataset.productId));
  }).catch(function() {});
  fav.addEventListener("click", function () {
    window.FavoriteStore.ready.then(function(session) {
      if (!session || !session.loggedIn) {
        var next = window.location.pathname + window.location.search;
        window.location.replace("../../about/login/?next=" + encodeURIComponent(next));
        return;
      }
      if (window.FavoriteStore.has(fav.dataset.productId)) {
        window.FavoriteStore.remove(fav.dataset.productId);
        renderFav(false);
      } else {
        window.FavoriteStore.add(currentProduct());
        renderFav(true);
      }
    });
  });
  window.addEventListener("favorite:changed", function() {
    renderFav(window.FavoriteStore.has(fav.dataset.productId));
  });
})();
</script>
