###:MessageSourceProperties
# spring.messages.basename=messages, messages2

###:for DB - datasource - MySQL 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:tka10202_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

# spring.datasource.jndi-name=jdbc/TestDB3
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true

###:for Redis 
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

###:context path
# server.servlet.context-path=/

###:port (for Application.java ---> main method)
server.port=${SERVER_PORT:8080}

###:for high concurrency (k6 1000 users login test)
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000
server.tomcat.threads.max=400
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=60000

###:for Upload capacity limit (default)
 spring.servlet.multipart.max-file-size=5MB
 spring.servlet.multipart.max-request-size=30MB
# spring.servlet.multipart.file-size-threshold=0MB

###:In the development process, the cache is usually closed 
###:to ensure that the data can be responded to in time during the testing process.
spring.thymeleaf.cache=false

###:對外網址（密碼重設信連結使用）
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8081/TKA102G2}

###:會員忘記密碼寄信（Gmail 需使用兩步驟驗證產生的應用程式密碼）
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.password-reset.minutes-to-live=15

###:for log
# logging.level.org.springframework.web=INFO

###:for farmer image upload（小農圖片放在此資料夾底下的 farmers/；不設定時自動使用專案的 src/main/resources/templates/front/img，GCP 請設定環境變數 FRUITUDE_UPLOAD_DIR）
fruitude.upload-dir=${FRUITUDE_UPLOAD_DIR:}

# 商品原圖與縮圖共用磁碟快取。
product.image-cache.directory=${PRODUCT_IMAGE_CACHE_DIR:${java.io.tmpdir}/fruitude/product-cache}
product.image-cache.ttl-seconds=86400
product.image-cache.max-bytes=268435456
product.image-cache.cleanup-ms=3600000

###:for 後台首頁天氣（中央氣象署開放資料；授權碼請設定環境變數 CWA_API_KEY，不要寫在這裡。未設定時首頁標題維持「首頁」）
cwa.api-key=${CWA_API_KEY:}
cwa.dataset=O-A0003-001
cwa.station-id=466920
