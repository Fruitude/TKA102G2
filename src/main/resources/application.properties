###:MessageSourceProperties
# spring.messages.basename=messages, messages2

###:for DB - datasource - MySQL 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:tka10202_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

# spring.datasource.jndi-name=jdbc/TestDB3
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true

###:for Redis 
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

###:context path
# server.servlet.context-path=/

###:port (for Application.java ---> main method)
server.port=${SERVER_PORT:8080}

###:for Upload capacity limit (default)
 spring.servlet.multipart.max-file-size=5MB
 spring.servlet.multipart.max-request-size=30MB
# spring.servlet.multipart.file-size-threshold=0MB

###:In the development process, the cache is usually closed 
###:to ensure that the data can be responded to in time during the testing process.
spring.thymeleaf.cache=false

###:會員 Google 登入（請在環境變數設定 Google Cloud OAuth 憑證）
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8081/TKA102G2}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:${app.public-base-url}/api/members/google/callback}

###:會員忘記密碼寄信（Gmail 需使用兩步驟驗證產生的應用程式密碼）
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.password-reset.minutes-to-live=15

