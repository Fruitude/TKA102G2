services:
  mysql:
    image: mysql:8
    container_name: tka102-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: tibame
    ports:
      - "13306:3306"
    volumes:
      - ./mySQL_data:/var/lib/mysql

  redis:
    image: redis:6
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes

  adminer:
    image: adminer
    container_name: tka102-adminer
    restart: always
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

  app:
    image: singledog/wangwang:0.0.1
    build: .
    container_name: tka102-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=fruits
      - MYSQL_USER=root
      - MYSQL_PASSWORD=tibame
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis

